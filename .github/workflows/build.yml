name: Build

# The build, sign, notarize and package half of a release, shared by the two
# channels that ship binaries:
#
# - stable: release.yml calls this for a `v*` tag push (and for its manual dry
#   run). All six platform legs build, the musl legs also make .deb packages
#   and the Windows legs .msi packages, exactly as before this was split out.
# - dev: dev.yml calls this for a commit on main that passed CI and asked for
#   a dev build. Only the four legs Homebrew installs from build (macOS and
#   Linux, arm64 and x86_64), with no .deb, and the dev version is written
#   into the checkout first.
#
# Artifacts uploaded here belong to the calling run, so the caller's publish
# jobs download them by the same names as before.
on:
  workflow_call:
    inputs:
      channel:
        description: 'stable or dev.'
        type: string
        default: stable
      version:
        description: 'dev only: the version to build, without a prefix (0.22.0-dev.4817). stable reads the tag.'
        type: string
        default: ''
    # The signing secrets live in the `release` environment, which the build
    # job below declares for its signing legs. A secret of that environment
    # wins over one passed in here, so the callers' explicit pass only
    # matters while the secrets still live at the repository level, which a
    # called workflow cannot otherwise see. All optional: a dry run without
    # them builds an unsigned binary.
    secrets:
      APPLE_CERTIFICATE_P12:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_API_KEY_P8:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER_ID:
        required: false

env:
  CARGO_TERM_COLOR: always

# A called workflow can only narrow the caller's token, never widen it. Both
# callers grant contents: read to the calling job, and that is all any job
# here needs: a checkout, and artifacts, which use the runtime token.
permissions:
  contents: read

jobs:
  # The Fluid bundle, built once for the whole release. It is JavaScript, so it
  # is the same bytes on every platform and there is no reason for six build
  # legs to each stand up a Node toolchain and produce it again. Every leg
  # downloads this artifact into fluid/dist before cargo runs, because
  # crates/service/build.rs stages whatever is in that folder at compile time
  # and the binary carries the copy.
  fluid-dist:
    name: build the fluid bundle
    runs-on: ubuntu-latest
    env:
      # Corepack fetches the pinned pnpm on first use, and the confirmation it
      # would otherwise ask for has nobody to answer it here. Set the way
      # fluid/Dockerfile and the CI fluid job set it, and for the same reason.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    defaults:
      run:
        working-directory: fluid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The UI freezes its package.json version into the bundle and compares it
      # against the server's, so a dev bundle carries the dev version too or
      # every dev user sees a version-skew warning.
      - name: Set the dev version
        if: inputs.channel == 'dev'
        env:
          DEV_VERSION: ${{ inputs.version }}
        run: bash ../scripts/set-build-version.sh "$DEV_VERSION" fluid

      # Corepack rather than a pnpm setup action, and for one reason: corepack
      # reads the "packageManager" pin in fluid/package.json, so the pnpm
      # version used here, in CI, in the Fluid image and on a laptop is one fact
      # in one place. It is no longer bundled with Node, hence the install,
      # pinned to the same corepack release fluid/Dockerfile pins. ci.yml's
      # fluid job explains the zizmor ignore.
      - name: Enable corepack
        run: | # zizmor: ignore[adhoc-packages]
          npm install --global corepack@0.35.0
          corepack enable pnpm
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the bundle
        run: pnpm build

      # Repository-relative: working-directory applies to run steps, not to an
      # action's inputs.
      - name: Upload the bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fluid-dist
          path: fluid/dist
          if-no-files-found: error
          # The action skips dotfiles by default and the index.html guard in
          # the build legs would never notice one missing; a future vite
          # emitting .vite/manifest.json must ride along, not silently drop.
          include-hidden-files: true

  # The build matrix, one leg per platform, as data. It is a job output rather
  # than a literal matrix because the dev channel builds only four of the six
  # legs, and a static matrix cannot drop legs by an input: an `exclude` does
  # not apply to `include` entries, and a job-level `if` cannot see the matrix.
  # Runs beside fluid-dist, so it costs no wall time.
  legs:
    name: pick the build legs
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - name: Pick the legs for this channel
        id: pick
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
        # Notes on the legs, which JSON cannot carry inline:
        #
        # - homebrew: the four legs the Homebrew formulae install from, the
        #   only ones the dev channel builds.
        # - macos-intel: macos-15-intel is the last Intel macOS image GitHub
        #   ships; it retires in August 2027. Before then drop this leg or
        #   switch to cross-compiling on an arm64 runner (smoke test under
        #   Rosetta 2, which those images include).
        # - linux-arm64: candle-core pulls in gemm-f16, whose aarch64 NEON
        #   kernels emit fullfp16 asm without gating it behind a
        #   target-feature check (upstream bug, see research notes).
        #   aarch64-apple-darwin enables +fp16 by default so only this Linux
        #   arm64 leg needs it.
        # - windows-arm64: +crt-static mirrors the x64 Windows leg. +fp16 is
        #   the same gemm-f16 ungated-asm workaround as linux-arm64 above:
        #   aarch64-pc-windows-msvc enables NEON but not fp16 by default.
        #   This raises the binary's baseline to ARMv8.2 FEAT_FP16; every
        #   Windows 11 on ARM device is ARMv8.2+, so nothing supported is
        #   excluded.
        run: |
          set -euo pipefail
          legs=$(cat << 'LEGS'
          [
            {"target": "aarch64-apple-darwin", "platform": "macos-arm64", "os": "macos-latest",
             "archive_ext": "tar.gz", "codesign": true, "homebrew": true},
            {"target": "x86_64-apple-darwin", "platform": "macos-intel", "os": "macos-15-intel",
             "archive_ext": "tar.gz", "codesign": true, "homebrew": true},
            {"target": "x86_64-unknown-linux-musl", "platform": "linux-amd64", "os": "ubuntu-latest",
             "archive_ext": "tar.gz", "musl": true, "deb_arch": "amd64", "homebrew": true},
            {"target": "aarch64-unknown-linux-musl", "platform": "linux-arm64", "os": "ubuntu-24.04-arm",
             "archive_ext": "tar.gz", "musl": true, "deb_arch": "arm64", "homebrew": true,
             "rustflags": "-C target-feature=+fp16"},
            {"target": "x86_64-pc-windows-msvc", "platform": "windows-amd64", "os": "windows-latest",
             "archive_ext": "zip", "rustflags": "-C target-feature=+crt-static", "msi": true},
            {"target": "aarch64-pc-windows-msvc", "platform": "windows-arm64", "os": "windows-11-arm",
             "archive_ext": "zip", "rustflags": "-C target-feature=+crt-static,+fp16", "msi": true}
          ]
          LEGS
          )
          case "$CHANNEL" in
            stable) filter='map(del(.homebrew))' ;;
            dev) filter='map(select(.homebrew) | del(.homebrew))' ;;
            *)
              echo "::error::unknown channel '$CHANNEL' (stable or dev)"
              exit 1
              ;;
          esac
          include=$(jq -c "$filter" <<< "$legs")
          echo "$include" | jq .
          echo "include=$include" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: [fluid-dist, legs]
    runs-on: ${{ matrix.os }}
    # The macOS legs sign and notarize, so they run in the protected
    # `release` environment, which only `v*` tags and main may enter and
    # which holds the Apple secrets. The other legs need no secret and stay
    # outside it. So does a manual dry run from any other branch: the
    # environment would refuse it, and once the Apple secrets live only in
    # the environment they are empty outside it, so such a dry run builds an
    # unsigned binary as designed (see "Decide whether to sign and
    # notarize"). deployment: false uses the
    # environment for its secrets and branch rule without recording a
    # deployment for every build.
    environment:
      name: ${{ matrix.codesign && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && 'release' || '' }}
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.legs.outputs.include) }}
    # The matrix and the inputs reach the shell steps as environment
    # variables, never as `${{ }}` text pasted into a script.
    env:
      LEG_TARGET: ${{ matrix.target }}
      LEG_PLATFORM: ${{ matrix.platform }}
      LEG_DEB_ARCH: ${{ matrix.deb_arch }}
      BUILD_CHANNEL: ${{ inputs.channel }}
      DEV_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Add release target
        shell: bash
        run: rustup target add "$LEG_TARGET"

      - name: Install musl-tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # The dev channel only. A stable build compiles cold, for two reasons.
      # Trust: a tag run can restore only what main saved, and any job that
      # runs on main (a test, a build script, a pnpm install) can write any
      # cache key there, so a restored cache is input to the signed release
      # that no review covers; a key prefix of its own would not change that.
      # Cost: next to nothing today, since the stable legs already found no
      # cache in the v0.21.3 cycle (the cache is over its 10 GB budget), and
      # what a tag run saved was scoped to its tag, where nothing ever read
      # it. A warm hit would save at most about 20 minutes on the Intel leg.
      # The key stays release-<target>: ci.yml's musl-spike job reads the
      # x86_64 musl entry the dev channel writes.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: inputs.channel == 'dev'
        with:
          key: release-${{ matrix.target }}

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BUILD_CHANNEL" = "dev" ]; then
            echo "version=v${DEV_VERSION}" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=v0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      # A stable build compiles the version its tagged Cargo.toml carries. A
      # dev build writes the dev version into this checkout first (never
      # committed), so --version, the MCP server info and the Fluid about line
      # all name the dev build a Homebrew user installed.
      - name: Set the dev version
        if: inputs.channel == 'dev'
        shell: bash
        run: bash scripts/set-build-version.sh "$DEV_VERSION" cargo

      # The web UI, downloaded before cargo runs on purpose: the service crate's
      # build script copies fluid/dist into its OUT_DIR and the derive embeds
      # that copy, so a bundle arriving after the compile is a bundle nobody
      # ships. download-artifact is cross-platform, so the Windows legs take
      # this path too.
      - name: Download the fluid bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fluid-dist
          path: fluid/dist

      # Cheap, and it is the difference between a release that ships the UI and
      # one that quietly answers 503 on every navigation.
      - name: The bundle is there to embed
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f fluid/dist/index.html ]; then
            echo "::error::fluid/dist/index.html is missing, so this binary would ship with no web UI. The fluid-dist job builds the bundle and uploads it as the fluid-dist artifact; this leg downloads it into fluid/dist."
            exit 1
          fi
          echo "bundle: $(find fluid/dist -type f | wc -l) files staged for the embed"

      # --locked: Cargo.lock is the build's input, and a lockfile that would
      # need an update fails the build instead of being re-resolved on the
      # runner. The dev channel's version rewrite above keeps the lockfile in
      # step with Cargo.toml for exactly this reason.
      # cargo-auditable embeds the resolved dependency list in a section of
      # the binary (a few kB), so `cargo audit bin`, Trivy, Grype and
      # osv-scanner can name the crates inside a shipped binary or container
      # image long after the release. The install action fetches a prebuilt
      # binary and checks it against the SHA-256 in its manifest.
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-auditable@0.7.6

      # The build itself is unchanged; `cargo auditable build` takes the same
      # arguments as `cargo build` and the packagers below (.deb, .msi) wrap
      # this binary with --no-build.
      - name: Build crystalline
        shell: bash
        run: cargo auditable build --release --locked --target "$LEG_TARGET" -p crystalline
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Locate the built binary
        id: bin
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${LEG_TARGET}/release/crystalline"
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin="target/${LEG_TARGET}/release/crystalline.exe"
          fi
          if [ ! -f "$bin" ]; then
            echo "::error::built binary not found at $bin"
            exit 1
          fi
          echo "path=$bin" >> "$GITHUB_OUTPUT"

      - name: Smoke test the binary
        shell: bash
        env:
          BIN: ${{ steps.bin.outputs.path }}
        run: |
          set -euo pipefail
          "$BIN" --version
          "$BIN" verify --help

      # The formula's own test compares `crystalline --version` against the
      # formula version, so a rewrite that did not reach the binary fails here
      # rather than on a user's `brew test`.
      - name: The binary carries the dev version
        if: inputs.channel == 'dev'
        shell: bash
        env:
          BIN: ${{ steps.bin.outputs.path }}
        run: |
          set -euo pipefail
          got="$("$BIN" --version | head -1)"
          want="crystalline ${DEV_VERSION}"
          if [ "$got" != "$want" ]; then
            echo "::error::the binary says '$got', expected '$want'"
            exit 1
          fi
          echo "$got"

      # macOS code signing and notarization: sign the bare Mach-O with a
      # Developer ID Application certificate under the hardened runtime,
      # then notarize it with notarytool via an App Store Connect API key.
      # A bare binary cannot carry a stapled ticket, so Gatekeeper resolves
      # the notarization ticket online on first run; distribution stays a
      # plain tar.gz. Signing runs BEFORE staging so the same signed binary
      # flows into the archive, the Homebrew tap and the .mcpb bundles.
      - name: Decide whether to sign and notarize
        if: matrix.codesign
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=()
          for var in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_TEAM_ID \
                     APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            [ -n "${!var:-}" ] || missing+=("$var")
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          elif [ "${#missing[@]}" -eq 6 ] && [ "$GITHUB_REF_TYPE" != "tag" ] && [ "$BUILD_CHANNEL" != "dev" ]; then
            echo "::notice::Apple signing secrets are not configured; this dry run produces an UNSIGNED macOS binary"
            echo "sign=false" >> "$GITHUB_OUTPUT"
          else
            # A dev build is published like a tag build, so it must sign too,
            # even though it runs on a branch rather than a tag.
            echo "::error::Apple signing secrets missing (${missing[*]}); a tag or dev build must sign and a partial secret set is always a misconfiguration"
            exit 1
          fi

      - name: Set up signing keychain
        if: matrix.codesign && steps.signing.outputs.sign == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          cert="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$cert"

      - name: Sign the binary
        if: matrix.codesign && steps.signing.outputs.sign == 'true'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BIN: ${{ steps.bin.outputs.path }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::no Developer ID Application identity found in the signing keychain"
            exit 1
          fi
          codesign --force --timestamp --options runtime \
            --identifier io.github.jordiboehme.crystalline \
            --keychain "$keychain" \
            --sign "$identity" \
            "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          info="$(codesign --display --verbose=2 "$BIN" 2>&1)"
          echo "$info"
          grep -q "Identifier=io.github.jordiboehme.crystalline" <<< "$info"
          grep -q "TeamIdentifier=${APPLE_TEAM_ID}" <<< "$info"
          grep -q "(runtime)" <<< "$info"

      - name: Notarize the binary
        if: matrix.codesign && steps.signing.outputs.sign == 'true'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          BIN: ${{ steps.bin.outputs.path }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/asc-key.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          zip="$RUNNER_TEMP/notarize.zip"
          ditto -c -k "$BIN" "$zip"
          result="$RUNNER_TEMP/notarize-result.json"
          set +e
          xcrun notarytool submit "$zip" \
            --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 30m --output-format json > "$result"
          submit_rc=$?
          set -e
          cat "$result"
          status="$(jq -r '.status // "unknown"' "$result")"
          if [ "$submit_rc" -ne 0 ] || [ "$status" != "Accepted" ]; then
            echo "::error::notarization failed (notarytool exit $submit_rc, status $status)"
            submission_id="$(jq -r '.id // empty' "$result")"
            if [ -n "$submission_id" ]; then
              xcrun notarytool log "$submission_id" \
                --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" || true
            fi
            exit 1
          fi
          rm -f "$zip"

      # Proves the hardened runtime does not break the binary (the embedded
      # candle ML runtime is pure Rust with no JIT, so it should not).
      - name: Smoke test the signed binary
        if: matrix.codesign && steps.signing.outputs.sign == 'true'
        shell: bash
        env:
          BIN: ${{ steps.bin.outputs.path }}
        run: |
          set -euo pipefail
          "$BIN" --version
          "$BIN" verify --help

      - name: Delete signing keychain
        if: always() && matrix.codesign
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          if [ -f "$keychain" ]; then
            security delete-keychain "$keychain"
          fi
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/asc-key.p8" "$RUNNER_TEMP/notarize.zip"

      - name: Stage archive contents
        id: stage
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          BIN: ${{ steps.bin.outputs.path }}
        run: |
          set -euo pipefail
          name="crystalline-${RELEASE_VERSION}-${LEG_PLATFORM}"
          stage="dist/$name"
          mkdir -p "$stage"
          cp "$BIN" "$stage/"
          cp LICENSE "$stage/"
          cp README.md "$stage/"
          cp -r docs "$stage/docs"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Package archive (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        working-directory: dist
        env:
          STAGE: ${{ steps.stage.outputs.name }}
        run: tar czf "${STAGE}.tar.gz" "$STAGE"

      - name: Package archive (zip)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        working-directory: dist
        env:
          STAGE: ${{ steps.stage.outputs.name }}
        run: Compress-Archive -Path "${env:STAGE}/*" -DestinationPath "${env:STAGE}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crystalline-${{ matrix.platform }}
          path: dist/${{ steps.stage.outputs.name }}.${{ matrix.archive_ext }}
          if-no-files-found: error

      # .deb packages: only the two musl legs produce one, since a static
      # musl binary needs no runtime shared-library dependencies (Depends is
      # left empty in crates/cli/Cargo.toml's [package.metadata.deb] rather
      # than the "$auto" default that would try to resolve them via ldd). The
      # dev channel ships through Homebrew only, so it builds none.
      # The install action fetches a prebuilt binary and checks it against
      # the SHA-256 in its manifest. Its cargo-deb manifest has an x86_64
      # Linux binary only, so the arm64 leg falls back to
      # `cargo install --locked cargo-deb@3.7.0`: the same pinned build as
      # before, never the unpinned cargo-binstall download.
      - name: Install cargo-deb
        if: matrix.musl && inputs.channel != 'dev'
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deb@3.7.0
          fallback: cargo-install

      - name: Build .deb package
        if: matrix.musl && inputs.channel != 'dev'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          deb_version="${RELEASE_VERSION#v}"
          cargo deb -p crystalline \
            --target "$LEG_TARGET" \
            --no-build \
            --deb-version "$deb_version" \
            --output "dist/crystalline_${deb_version}_${LEG_DEB_ARCH}.deb"

      - name: Upload .deb artifact
        if: matrix.musl && inputs.channel != 'dev'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crystalline-deb-${{ matrix.deb_arch }}
          path: dist/crystalline_*.deb
          if-no-files-found: error

      # .msi package: only the two Windows legs produce one, built with the
      # WiX v3 toolset and driven by cargo-wix from crates/cli/wix/main.wxs.
      # windows-latest preinstalls WiX; the windows-11-arm image ships
      # without it (verified 2026-07-11), so the guard step below installs the
      # pinned package there and asserts the version on both legs. The MSI
      # installs per machine into Program Files, puts the binary on the system
      # PATH and upgrades in place thanks to the frozen
      # UpgradeCode in the wxs, which stays shared across arches: on Windows
      # on Arm the arm64 MSI major-upgrades an emulated-x64 install in
      # place, which is the desired behavior.
      - name: Ensure WiX toolset is available
        if: matrix.msi
        shell: pwsh
        run: |
          # WiX v3 pinned: windows-latest preinstalls 3.14.1.8722 and the
          # windows-11-arm image has none, so the arm leg installs the
          # Chocolatey package that ships the same build. Either way the
          # version is asserted, so an image update that moves WiX fails here
          # instead of changing the MSI toolchain unnoticed. Move both values
          # together.
          $want = '3.14.1.8722'
          $candle = (Get-Command candle.exe -ErrorAction SilentlyContinue).Source
          if (-not $candle) {
            choco install wixtoolset --version 3.14.1.20250415 --no-progress -y
            # A GITHUB_PATH append only reaches later steps, and choco's PATH
            # edit does not reach this shell either, so verify by full path.
            $candle = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin\candle.exe"
            if (-not (Test-Path $candle)) { throw "candle.exe not found after WiX install" }
            Split-Path $candle | Add-Content -Path $env:GITHUB_PATH
          }
          $got = (Get-Item $candle).VersionInfo.FileVersion
          "WiX candle $got at $candle"
          if ($got -ne $want) { throw "WiX candle is $got, expected $want" }

      # Built from source on purpose: install-action has no cargo-wix
      # manifest (checked at v2.87.22, the newest release on 2026-10-02), and
      # its cargo-binstall fallback would download a binary no checksum pins.
      # It is one step on the two Windows legs, under a minute.
      - name: Install cargo-wix
        if: matrix.msi
        run: cargo install cargo-wix --version 0.3.9 --locked

      - name: Build .msi package
        if: matrix.msi
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # MSI ProductVersion is numeric major.minor.patch. A tag build uses
          # the tag. A dry run (v0.0.0-dev) uses the workspace version from
          # Cargo.toml, so its MSI can upgrade the last release in the
          # upgrade test. A dry run's MSI is never published.
          msi_version="${RELEASE_VERSION#v}"
          msi_version="${msi_version%%-*}"
          if [ "$msi_version" = "0.0.0" ]; then
            msi_version=$(sed -n 's/^version = "\([0-9.]*\)"$/\1/p' Cargo.toml | head -n 1)
          fi
          cargo wix -p crystalline \
            --no-build --nocapture \
            --target "$LEG_TARGET" \
            --install-version "$msi_version" \
            --output "dist/crystalline-${RELEASE_VERSION}-${LEG_PLATFORM}.msi"

      # A real elevated install rather than an administrative extract: only an
      # actual install exercises the PATH Environment component, the upgrade
      # table and clean removal.
      - name: Smoke test the .msi
        if: matrix.msi
        shell: pwsh
        run: |
          $msi = (Get-Item dist/*.msi).FullName
          $log = Join-Path $env:RUNNER_TEMP 'msi-install.log'
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /norestart /L*v `"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 50; throw "install failed: $($p.ExitCode)" }
          $exe = 'C:\Program Files\Crystalline\bin\crystalline.exe'
          if (-not (Test-Path $exe)) { throw 'crystalline.exe missing after install' }
          & $exe --version
          $sysPath = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment').Path
          if ($sysPath -notlike '*Crystalline\bin*') { throw 'install dir not on the system PATH' }
          # The daemon task: registered by the installed binary, defined for
          # the Users group, removed on uninstall. Run once on a best-effort
          # basis: a hosted runner may have no interactive session for a group
          # task, so a run that starts no daemon is a warning here and a check
          # on a real machine before the release.
          $task = '\Crystalline\Daemon'
          schtasks /Query /TN $task *> $null
          if ($LASTEXITCODE -ne 0) { throw "the MSI did not register $task" }
          # Export-ScheduledTask hands back a .NET string, so the encoding
          # schtasks would pick for a pipe never comes up.
          $xml = Export-ScheduledTask -TaskPath '\Crystalline\' -TaskName 'Daemon' -ErrorAction SilentlyContinue
          # Kept as an artifact whatever the checks below say: the shape Task
          # Scheduler really stores is what the next debugging needs.
          if ($xml) { $xml | Set-Content -Path (Join-Path $env:RUNNER_TEMP 'daemon-task-export.xml') -Encoding utf8 }
          if (-not $xml) { throw "the MSI did not register $task" }
          # Read as XML, not as text: Task Scheduler writes the definition back
          # in its own form, so a substring of what was registered may not be
          # in what it exports.
          [xml]$doc = $xml
          $ns = @{ t = 'http://schemas.microsoft.com/windows/2004/02/mit/task' }
          $one = { param($path) (Select-Xml -Xml $doc -XPath $path -Namespace $ns | Select-Object -First 1).Node }
          $checks = [ordered]@{
            'a logon trigger'              = { [bool](& $one '//t:Triggers/t:LogonTrigger') }
            'the Users group'              = { (& $one '//t:Principal/t:GroupId').InnerText -in @('S-1-5-32-545', 'BUILTIN\Users', 'Users') }
            'parallel instances'           = { (& $one '//t:MultipleInstancesPolicy').InnerText -eq 'Parallel' }
            'no time limit'                = { (& $one '//t:ExecutionTimeLimit').InnerText -eq 'PT0S' }
            'serve --daemon --from-task'   = { (& $one '//t:Exec/t:Arguments').InnerText -eq 'serve --daemon --from-task' }
            'the installed crystalline.exe' = { (& $one '//t:Exec/t:Command').InnerText -like '*Crystalline\bin\crystalline.exe*' }
          }
          $missing = @($checks.Keys | Where-Object { -not (& $checks[$_]) })
          if ($missing.Count -gt 0) {
            $xml
            throw "the task definition lacks: $($missing -join ', ')"
          }
          # The same facts through Task Scheduler's own object model, which
          # drops no default the way the export does.
          $t = Get-ScheduledTask -TaskPath '\Crystalline\' -TaskName 'Daemon'
          "principal: GroupId=$($t.Principal.GroupId) UserId=$($t.Principal.UserId) RunLevel=$($t.Principal.RunLevel)"
          $action = @($t.Actions)[0]
          $typed = [ordered]@{
            'Settings.MultipleInstances is Parallel'                = { "$($t.Settings.MultipleInstances)" -in @('Parallel', '0') }
            'Settings.ExecutionTimeLimit is PT0S'                   = { $t.Settings.ExecutionTimeLimit -eq 'PT0S' }
            'a MSFT_TaskLogonTrigger'                               = { @($t.Triggers | Where-Object { $_.CimClass.CimClassName -eq 'MSFT_TaskLogonTrigger' }).Count -ge 1 }
            'Actions.Execute ends in Crystalline\bin\crystalline.exe' = { $action.Execute.Trim('"') -like '*\Crystalline\bin\crystalline.exe' }
            'Actions.Arguments has serve --daemon --from-task'      = { $action.Arguments -like '*serve --daemon --from-task*' }
          }
          $failed = @($typed.Keys | Where-Object { -not (& $typed[$_]) })
          if ($failed.Count -gt 0) {
            $t | Format-List *
            $t.Settings | Format-List *
            $t.Actions | Format-List *
            throw "the registered task fails: $($failed -join ', ')"
          }
          # Who may run it, read back through the COM API: the descriptor the
          # definition carries is applied by Task Scheduler or not, and only
          # this shows which. 0xF asks for the SACL too, which needs a
          # privilege the runner may not hold; 4 is the DACL alone.
          $scheduler = New-Object -ComObject 'Schedule.Service'
          $scheduler.Connect()
          $registered = $scheduler.GetFolder('\Crystalline').GetTask('Daemon')
          try { $sddl = $registered.GetSecurityDescriptor(0xF) } catch { $sddl = $registered.GetSecurityDescriptor(4) }
          "security descriptor: $sddl"
          $sd = New-Object System.Security.AccessControl.RawSecurityDescriptor($sddl)
          $usersCanRun = $false
          foreach ($ace in $sd.DiscretionaryAcl) {
            if ("$($ace.AceType)" -ne 'AccessAllowed' -or $ace.SecurityIdentifier.Value -ne 'S-1-5-32-545') { continue }
            $mask = [BitConverter]::ToUInt32([BitConverter]::GetBytes([int32]$ace.AccessMask), 0)
            # Generic read and execute (GRGX), or the file rights Task
            # Scheduler may map them to (FRFX).
            foreach ($rights in @([uint32]2684354560, [uint32]1179817)) {
              if (($mask -band $rights) -eq $rights) { $usersCanRun = $true }
            }
          }
          if (-not $usersCanRun) { throw "the task's security descriptor gives the Users group no read and execute right: $sddl" }
          # A task under the name 0.24.0 gave this user's task moves to the
          # name with the SID: daemon-task register adds the new one, then
          # removes the old one, which runs as this account.
          $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $oldUserTask = "\Crystalline Daemon for $env:USERNAME"
          $newUserTask = "\Crystalline Daemon for $env:USERNAME ($sid)"
          $definition = Join-Path $env:RUNNER_TEMP 'old-user-task.xml'
          & $exe daemon-task show | Set-Content -Path $definition -Encoding Unicode
          schtasks /Create /TN $oldUserTask /XML $definition /F | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "could not plant $oldUserTask" }
          $said = & $exe daemon-task register
          if ($LASTEXITCODE -ne 0) { throw "daemon-task register failed: $said" }
          $said
          schtasks /Query /TN $newUserTask *> $null
          if ($LASTEXITCODE -ne 0) { throw "$newUserTask was not registered" }
          schtasks /Query /TN $oldUserTask *> $null
          if ($LASTEXITCODE -eq 0) { throw "$oldUserTask is still there after the move" }
          if (-not ($said -match 'removed the task')) { throw "register did not say it removed $oldUserTask" }
          & $exe daemon-task unregister
          if ($LASTEXITCODE -ne 0) { throw 'daemon-task unregister failed' }
          schtasks /Query /TN $newUserTask *> $null
          if ($LASTEXITCODE -eq 0) { throw "$newUserTask is still there after daemon-task unregister" }
          $global:LASTEXITCODE = 0
          schtasks /Run /TN $task | Out-Null
          $up = $false
          for ($i = 0; $i -lt 30; $i++) {
            & $exe ctl status *> $null
            if ($LASTEXITCODE -eq 0) { $up = $true; break }
            Start-Sleep -Milliseconds 500
          }
          if ($up) {
            "the task started a daemon that answers"
            & $exe ctl shutdown *> $null
          } else {
            "::warning::the task did not start a daemon on this runner; the real-machine check covers it"
          }
          # A daemon the task started in another session would hold the
          # binary open, and the quiet uninstall below would then end with a
          # reboot request instead of removing it. Ending the task stops it.
          schtasks /End /TN $task *> $null
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn /norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }
          if (Test-Path $exe) { throw 'crystalline.exe still present after uninstall' }
          $sysPath = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment').Path
          if ($sysPath -like '*Crystalline\bin*') { throw 'PATH entry not removed on uninstall' }
          schtasks /Query /TN $task *> $null
          if ($LASTEXITCODE -eq 0) { throw 'the task is still registered after uninstall' }
          $global:LASTEXITCODE = 0

      # Install v0.24.1 from its release, then this build over it: the task
      # must survive the major upgrade, start the new binary and start a
      # daemon of the new version. The smoke test above uninstalled, so this
      # starts from a clean machine.
      - name: Upgrade test of the .msi from v0.24.1
        if: matrix.msi
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The built version is the tag, or on a dry run (v0.0.0-dev) the
          # workspace version from Cargo.toml: the same version "Build .msi
          # package" gave the MSI and the one crystalline --version prints.
          $built = $env:RELEASE_VERSION.TrimStart('v').Split('-')[0]
          if ($built -eq '0.0.0') { $built = (Select-String -Path Cargo.toml -Pattern '^version = "([0-9.]+)"$' | Select-Object -First 1).Matches[0].Groups[1].Value }
          if ([version]$built -le [version]'0.24.1') {
            "::warning::this build is $built, not newer than 0.24.1, so there is nothing to upgrade from; the upgrade test runs on a release tag"
            exit 0
          }
          $old = Join-Path $env:RUNNER_TEMP "crystalline-v0.24.1-$env:LEG_PLATFORM.msi"
          Invoke-WebRequest -Uri "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v0.24.1/crystalline-v0.24.1-$env:LEG_PLATFORM.msi" -OutFile $old
          $new = (Get-Item dist/*.msi).FullName
          $exe = 'C:\Program Files\Crystalline\bin\crystalline.exe'
          $task = '\Crystalline\Daemon'
          $install = {
            param($msi, $log)
            $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /norestart /L*v `"$log`"" -Wait -PassThru
            $p.ExitCode
          }
          $code = & $install $old (Join-Path $env:RUNNER_TEMP 'msi-install-0.24.1.log')
          if ($code -ne 0) { throw "the v0.24.1 install failed: $code" }
          $was = & $exe --version
          if ("$was" -notlike '*0.24.1*') { throw "v0.24.1 did not install: $was" }
          schtasks /Query /TN $task *> $null
          if ($LASTEXITCODE -ne 0) { throw 'v0.24.1 registered no task' }
          $upgradeLog = Join-Path $env:RUNNER_TEMP 'msi-upgrade.log'
          $code = & $install $new $upgradeLog
          if ($code -ne 0) { Get-Content $upgradeLog -Tail 50; throw "the upgrade failed: $code" }
          $is = & $exe --version
          if ("$is" -notlike "*$built*") { throw "after the upgrade $exe is $is, not $built" }
          $t = Get-ScheduledTask -TaskPath '\Crystalline\' -TaskName 'Daemon' -ErrorAction SilentlyContinue
          if (-not $t) { throw 'the task is gone after the upgrade' }
          Export-ScheduledTask -TaskPath '\Crystalline\' -TaskName 'Daemon' |
            Set-Content -Path (Join-Path $env:RUNNER_TEMP 'daemon-task-export-after-upgrade.xml') -Encoding utf8
          $action = @($t.Actions)[0]
          if ($action.Execute.Trim('"') -ne $exe) { throw "after the upgrade the task starts $($action.Execute), not $exe" }
          if ($action.Arguments -notlike '*serve --daemon --from-task*') { throw "after the upgrade the task runs $($action.Arguments)" }
          schtasks /Run /TN $task | Out-Null
          $status = $null
          for ($i = 0; $i -lt 30; $i++) {
            $out = & $exe ctl status --json 2>$null
            if ($LASTEXITCODE -eq 0) { $status = $out | ConvertFrom-Json; break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $status) { throw 'after the upgrade the task started no daemon that answers' }
          if ("$($status.version)" -notlike "$built*") { throw "the task's daemon is v$($status.version), not $built" }
          "the upgraded task started a v$($status.version) daemon that answers"
          & $exe ctl shutdown *> $null
          schtasks /End /TN $task *> $null
          $p = Start-Process msiexec -ArgumentList "/x `"$new`" /qn /norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the uninstall after the upgrade failed: $($p.ExitCode)" }
          schtasks /Query /TN $task *> $null
          if ($LASTEXITCODE -eq 0) { throw 'the task is still registered after the uninstall' }
          $global:LASTEXITCODE = 0

      # The definition as Task Scheduler stores it, from the smoke test and
      # the upgrade test, uploaded even when a check failed.
      - name: Upload the daemon task export
        if: always() && matrix.msi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daemon-task-export-${{ matrix.platform }}
          path: ${{ runner.temp }}/daemon-task-export*.xml
          if-no-files-found: warn

      - name: Upload .msi artifact
        if: matrix.msi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crystalline-msi-${{ matrix.platform }}
          path: dist/*.msi
          if-no-files-found: error
