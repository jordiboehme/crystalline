name: CI

on:
  pull_request:
  push:
    branches: [main]
  # A dispatched run is the `stress` job alone (see there): `changes` answers
  # code=false for it, so the gated jobs skip.
  workflow_dispatch:
    inputs:
      os:
        description: Runner to stress on
        type: choice
        options: [windows-latest, ubuntu-latest, macos-latest, ubuntu-24.04-arm]
        default: windows-latest
      filter:
        description: nextest filterset of the tests to stress
        type: string
        default: (package(crystalline-index) & !test(/^embed::/)) | package(crystalline-engine) | (package(crystalline-service) & (binary(domains) | binary(overlay) | binary(engine)))
      count:
        description: Stress iterations (each runs every selected test once)
        type: string
        default: '20'

env:
  CARGO_TERM_COLOR: always

# Read only by default: every job can check out the tree and nothing more. A
# job that needs another scope names it in its own `permissions:` block.
permissions:
  contents: read

# A newer push to a pull request cancels the run it supersedes. A push to main
# keeps one group per commit and never cancels.
# A dispatched stress run has a group of its own, so it never queues behind or
# replaces a main push at the same commit.
concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Documentation-only changes skip the heavy jobs. The filter is per job and
  # deliberately NOT a `paths-ignore:` on the trigger above. Two reasons, and
  # the first is the one that matters:
  #
  # 1. A markdown change CAN break a real check. The three version pins a user
  #    copies into their own workflow live in docs/evolve.md, and
  #    scripts/version-pins.sh reads them there; the `style` job runs that
  #    script. A trigger-level ignore would silently disable the pin check on
  #    exactly the changes most likely to break it.
  # 2. A workflow that does not run reports nothing, not success. Per job, the
  #    skipped jobs report as skipped and `style` still reports green.
  #
  # So `style` carries no gate at all and runs for every change, and the jobs
  # that only ever exercise code are gated on this one.
  #
  # Documentation is the repository's prose, narrowly: root-level *.md, docs/**,
  # assets/**, LICENSE (with an optional .md or .txt) and markdown under
  # .github/ outside the workflows.
  # Everything else is code, including Cargo.toml, Cargo.lock, fluid/package.json,
  # scripts/** and .github/workflows/** itself, because a workflow change has to
  # exercise itself. Markdown deeper in the tree is code too: skills/*/SKILL.md is
  # include_str!'d into crystalline-core, and the fixture engrams under tests/ and
  # evals/ are what the suites and `verify-action` read.
  #
  # The classifier fails safe in every direction: an unknown event, a missing,
  # zeroed or unreachable base, a force push, a git error or an empty file list
  # all set code=true. The gate below reads `!cancelled() && ... != 'false'`, so
  # a `changes` job that fails outright runs everything instead of skipping it.
  #
  # On a push to main the job also asks whether a pull request run already
  # passed this exact tree (the `ci-passed` job at the end uploads the proof).
  # The tree is compared, never a commit sha: a merge commit carries the same
  # tree as the `refs/pull/N/merge` commit its pull request tested when main
  # did not move in between, and a different tree when it did. With
  # tested=true the test legs only compile (so main still saves the caches
  # pull requests restore) and the other heavy jobs are skipped; style,
  # cargo-deny, fluid-audit and verify-action still run, and the run still ends
  # green. That check fails open as well: an API error,
  # an empty answer or anything unclear leaves tested=false, and the gates read
  # `!= 'true'`, so a missing output runs everything as before.
  changes:
    name: changes
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # The artifact lookup needs actions: read. Naming one permission drops the
    # rest to none, so checkout's contents: read is named as well.
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The classifier diffs against a base commit, which the default
          # shallow clone does not have. Only this job pays for the history,
          # and the pack is a few dozen megabytes.
          fetch-depth: 0

      - name: Classify the changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          # The runner starts this shell with -e. Turn it off on purpose: every
          # failure in here has to end in code=true, never in a non-zero exit,
          # which would skip the gated jobs instead of running them.
          set +e
          set -u

          run_everything() {
            echo "changes: $1, so every job runs."
            echo "code=true" >>"$GITHUB_OUTPUT"
            exit 0
          }

          case "$EVENT_NAME" in
            pull_request)
              # Three dots: what this side added since the merge base, so a base
              # branch that moved on does not leak into the list.
              base="$PR_BASE_SHA"
              range="${base}...HEAD"
              ;;
            push)
              if [ "$PUSH_FORCED" = "true" ]; then
                run_everything "a force push leaves no usable base"
              fi
              base="$PUSH_BEFORE_SHA"
              range="${base}..HEAD"
              ;;
            workflow_dispatch)
              # A dispatched run exists for the stress job, which does not
              # wait on this one. Skipping the gated jobs is the point.
              echo "changes: a dispatched run is the stress job alone, so the gated jobs skip."
              echo "code=false" >>"$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              run_everything "the event $EVENT_NAME has no base to compare against"
              ;;
          esac

          case "$base" in
            '')             run_everything "there is no base commit (a first push or a new branch)" ;;
            *[!0-9a-fA-F]*) run_everything "the base is not a commit sha ($base)" ;;
            *[!0]*)         ;;
            *)              run_everything "the base commit is all zeros (a first push or a new branch)" ;;
          esac

          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            run_everything "the base commit $base is not in this clone"
          fi

          # --no-renames so a file that moves shows up on both sides: a rename
          # out of code into docs must not read as a documentation change.
          if ! files=$(git diff --name-only --no-renames "$range"); then
            run_everything "git diff $range failed"
          fi
          if [ -z "$files" ]; then
            run_everything "the diff against $base is empty, which is not a diff we understand"
          fi

          code=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              # A workflow change exercises itself. This comes first, so a
              # README.md under .github/workflows/ still counts as code.
              .github/workflows/*) verdict=code ;;
              docs/*|assets/*)     verdict=docs ;;
              # LICENSE and LICENSE.md and LICENSE.txt only. A bare LICENSE*
              # would read a root file like LICENSE_KEYS.rs as prose.
              LICENSE|LICENSE.md|LICENSE.txt) verdict=docs ;;
              .github/*.md)        verdict=docs ;;
              # The skill-training harness's Python dependencies and scripts:
              # no Rust test or build script reads them (the NLI parity fixture
              # lives under evals/nli, not here). Its fixtures stay code.
              evals/skill-training/pyproject.toml|evals/skill-training/uv.lock|evals/skill-training/*.py) verdict=docs ;;
              # Anything else in a subdirectory, markdown included.
              */*)                 verdict=code ;;
              *.md)                verdict=docs ;;
              *)                   verdict=code ;;
            esac
            echo "  $verdict  $f"
            if [ "$verdict" = code ]; then
              code=true
            fi
          done <<<"$files"

          echo "code=$code" >>"$GITHUB_OUTPUT"
          if [ "$code" = true ]; then
            echo "changes: this diff touches code, so every job runs."
          else
            echo "changes: documentation only, so the heavy jobs are skipped. style still runs."
          fi

      # Only artifacts of runs whose head is in this repository count: a fork's
      # pull request runs its own copy of this file and could upload any name.
      # A branch of this repository was pushed by someone with write access,
      # who could change this file anyway.
      - name: Look for a green pull request run of this tree
        id: tested
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          # As in the classifier: every failure in here has to end in
          # tested=false and exit 0, never in a red job.
          set +e
          set -u

          run_the_tests() {
            echo "tested: $1, so the tests run."
            echo "tested=false" >>"$GITHUB_OUTPUT"
            exit 0
          }

          case "$REPO_ID" in
            ''|*[!0-9]*) run_the_tests "the repository id '$REPO_ID' is not a number" ;;
          esac

          if ! tree=$(git rev-parse 'HEAD^{tree}'); then
            run_the_tests "git could not name the tree of HEAD"
          fi
          case "$tree" in
            ''|*[!0-9a-f]*) run_the_tests "'$tree' is not a tree sha" ;;
          esac

          name="tested-tree-$tree"
          echo "tested: looking for the artifact $name"
          if ! runs=$(gh api "repos/$REPO/actions/artifacts?name=$name&per_page=100" \
            --jq "[.artifacts[] | select(.name == \"$name\" and .expired == false and .workflow_run.repository_id == $REPO_ID and .workflow_run.head_repository_id == $REPO_ID) | .workflow_run.id] | unique | map(tostring) | join(\" \")"); then
            run_the_tests "the artifact lookup for $name failed"
          fi
          if [ -z "$runs" ]; then
            run_the_tests "no pull request run of this repository left an unexpired $name"
          fi

          echo "tested: the pull request run(s) $runs passed every gated job on the tree $tree, so the test legs only compile and the other heavy jobs are skipped."
          echo "tested=true" >>"$GITHUB_OUTPUT"

  # The Windows leg is the longest by far (about 7.4 min of compile and 15.2
  # min of tests, measured 2026-10-26, where every other leg is done within
  # about 10 min), so it runs as two partitions, each on its own runner, with
  # `cargo nextest --partition hash:1/2` and `hash:2/2`. Both compile the same
  # build, so the compile is paid twice in parallel and the wall clock falls
  # by about the half of the test run, not by half of the leg. The other
  # legs carry no `partition` and run as before. Where the work goes:
  # - clippy runs in partition 1 only (it is a lint of the tree, not of a
  #   partition), and that is the one that saves the cache, so the check
  #   metadata clippy produces is still saved;
  # - the doctests run in partition 2 only, once on Windows, which also keeps
  #   partition 1 (compile, clippy and half the tests) from carrying more;
  # - on a push to main whose tree a pull request already tested, partition 1
  #   alone compiles and lints so the cache stays seeded, and partition 2 has
  #   nothing to add (same build, same key) and skips every step, which only
  #   saves its runner minutes.
  # `ci-passed` needs `test` as a whole, so every leg of this matrix, both
  # partitions included, has to pass before the proof is uploaded.
  test:
    name: test (${{ matrix.os }}${{ matrix.partition && format(', {0}', matrix.partition) || '' }})
    timeout-minutes: 90
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        include:
          # candle-core pulls in gemm-f16, whose aarch64 NEON kernels emit
          # fullfp16 asm without gating it behind a target-feature check
          # (upstream bug, see research notes). aarch64-apple-darwin enables
          # +fp16 by default so only this Linux arm64 leg needs the flag.
          - os: ubuntu-24.04-arm
            rustflags: '-C target-feature=+fp16'
          # The two Windows partitions. windows-latest is left out of the os
          # list above so these two entries are its only legs.
          - os: windows-latest
            partition: 1/2
          - os: windows-latest
            partition: 2/2
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      # nextest's `--partition` argument; empty (no partitioning) on the
      # three legs that run the whole suite.
      PARTITION: ${{ matrix.partition }}
      # True for the one leg with nothing to do on a push to main whose tree a
      # pull request tested (see the comment above the job).
      IDLE: ${{ needs.changes.outputs.tested == 'true' && matrix.partition == '2/2' }}
      # Keeps every test off the runner's real OS keychain, the same switch
      # the documented local test command sets. Without it a Windows runner's
      # Credential Manager takes a test's credential write while a Linux or
      # macOS runner falls back to the file, so a test that reads the file
      # store passes on two legs and finds nothing on the third.
      CRYSTALLINE_TEST_NO_KEYCHAIN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.IDLE != 'true' }}
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        if: ${{ env.IDLE != 'true' }}
        run: rustup show

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        if: ${{ env.IDLE != 'true' }}
        with:
          tool: nextest@0.9.151
          fallback: none

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ env.IDLE != 'true' }}
        with:
          # Named, so fluid-smoke-build and mcpb read this very entry (same
          # job key as before). Both Windows partitions share it (the key adds the OS,
          # not the partition) and they build the same thing, so only
          # partition 1 saves: two saves of one key would race for nothing.
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.partition != '2/2' }}

      # On a push to main whose tree a pull request run already passed (see
      # `changes`), the checks below are skipped and the leg only compiles the
      # tests and runs clippy, so the cache step above still saves what pull
      # requests restore: the test build and clippy's check-mode metadata,
      # which the compile alone never produces. Without clippy here, the first
      # pull request after a lockfile or toolchain change rebuilt every
      # dependency in check mode. A clippy failure turns main red, which is
      # right: the pull request ran the same clippy on the same tree.
      - name: Compile the tests only (the pull request tested this tree)
        if: ${{ needs.changes.outputs.tested == 'true' && env.IDLE != 'true' }}
        run: cargo nextest run --workspace --no-run --locked

      - name: cargo clippy (the pull request tested this tree)
        if: ${{ needs.changes.outputs.tested == 'true' && env.IDLE != 'true' }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Formatting does not depend on the OS, so one leg checks it.
      - name: cargo fmt --check
        if: ${{ matrix.os == 'ubuntu-latest' && needs.changes.outputs.tested != 'true' }}
        run: cargo fmt --all --check

      - name: cargo doc (no private intra-doc links)
        if: ${{ matrix.os == 'ubuntu-latest' && needs.changes.outputs.tested != 'true' }}
        env:
          RUSTDOCFLAGS: -D rustdoc::private_intra_doc_links
        run: cargo doc --no-deps --workspace --locked

      # On Windows partition 2 clippy would only repeat partition 1's lint.
      - name: cargo clippy
        if: ${{ needs.changes.outputs.tested != 'true' && matrix.partition != '2/2' }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The feature-gated code paths: without the default features candle,
      # sqlx and the embedded Fluid bundle are gone, and a test or helper that
      # only the gated legs use must carry its own cfg. One Linux leg is
      # enough, the cfg does not depend on the OS. Only the four workspace
      # crates that have features of their own are checked.
      - name: cargo clippy (no default features)
        if: ${{ matrix.os == 'ubuntu-latest' && needs.changes.outputs.tested != 'true' }}
        run: |
          for crate in crystalline-index crystalline-engine crystalline-service crystalline; do
            cargo clippy -p "$crate" --no-default-features --all-targets --locked -- -D warnings
          done

      # The postgres backend's tests, on the x86_64 ubuntu leg only (not the
      # arm one): every test of the workspace run below that reads
      # CRYSTALLINE_TEST_POSTGRES_URL runs its postgres leg against this
      # container instead of skipping it, in the same build and the same
      # cache entry (shared-key: test) as the rest of the leg. Started with
      # docker run rather than as a job service because a service cannot be
      # limited to one matrix leg. The readiness probe goes over TCP inside
      # the container: the image's init phase runs a socket-only server, so
      # a socket probe could answer before the real server is up. The
      # extension is pre-created in public so the migration's defensive
      # CREATE EXTENSION is always a no-op. The migration's advisory lock
      # already makes parallel first opens race free; the
      # concurrent_first_opens tests in postgres/migrations.rs reach the
      # extension leg through a database of their own.
      - name: Start postgres with pgvector
        if: ${{ matrix.os == 'ubuntu-latest' && needs.changes.outputs.tested != 'true' }}
        run: |
          set -euo pipefail
          docker run -d --name pg \
            -e POSTGRES_PASSWORD=crystalline \
            -e POSTGRES_DB=crystalline_test \
            -p 5432:5432 \
            pgvector/pgvector:0.8.7-pg17-bookworm
          for _ in $(seq 1 60); do
            if docker exec pg pg_isready -h 127.0.0.1 -U postgres -d crystalline_test >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if ! docker exec pg pg_isready -h 127.0.0.1 -U postgres -d crystalline_test; then
            docker logs pg
            echo "::error::postgres was not ready after 60 s"
            exit 1
          fi
          docker exec -e PGPASSWORD=crystalline pg \
            psql -h 127.0.0.1 -U postgres -d crystalline_test -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"
          echo "CRYSTALLINE_TEST_POSTGRES_URL=postgres://postgres:crystalline@localhost:5432/crystalline_test" >>"$GITHUB_ENV"

      - name: cargo nextest run
        if: ${{ needs.changes.outputs.tested != 'true' }}
        # The `ci` profile is the default one plus a single retry, so an
        # environmental failure on a hosted runner reports FLAKY instead of
        # turning a green change red. A test that fails twice still fails.
        shell: bash
        run: |
          set -o pipefail
          # The log goes to the runner's temp folder, never the workspace.
          args=()
          if [ -n "$PARTITION" ]; then
            args+=(--partition "hash:$PARTITION")
          fi
          cargo nextest run --workspace --profile ci --locked "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/nextest.log"

      # A test that passed on its retry is FLAKY in the log. Show each as a
      # warning on the run; the job stays green.
      - name: flaky tests
        if: ${{ success() && needs.changes.outputs.tested != 'true' }}
        shell: bash
        run: |
          # CARGO_TERM_COLOR=always puts colour codes in the log; strip them.
          sed $'s/\x1b\\[[0-9;]*m//g' "$RUNNER_TEMP/nextest.log" | grep -E '^ *FLAKY ' | while read -r line; do
            echo "::warning::flaky test: ${line}"
          done || true

      # Once on Windows: partition 2 runs them, partition 1 already carries
      # clippy.
      - name: cargo test --doc
        if: ${{ needs.changes.outputs.tested != 'true' && matrix.partition != '1/2' }}
        run: cargo test --workspace --doc --locked

  # Runs chosen tests many times on one runner, on a manual dispatch only:
  # `gh workflow run ci.yml --ref <branch> -f os=windows-latest -f count=20
  # -f filter='<filterset>'`. It is how a flake that only one runner shows is
  # pinned, since a local stress run cannot reach that runner. The default
  # profile has no retry, so every failure counts. The default filter covers
  # the Windows temp directory family: every suite that opens many stores.
  stress:
    name: stress (${{ inputs.os }})
    if: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 180
    runs-on: ${{ inputs.os }}
    env:
      RUSTFLAGS: ${{ inputs.os == 'ubuntu-24.04-arm' && '-C target-feature=+fp16' || '' }}
      CRYSTALLINE_TEST_NO_KEYCHAIN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: nextest@0.9.151
          fallback: none

      # Restores what the test legs saved on main and saves nothing.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: false

      - name: cargo nextest run --stress-count
        shell: bash
        env:
          FILTER: ${{ inputs.filter }}
          COUNT: ${{ inputs.count }}
        run: cargo nextest run --workspace --locked --no-tests=fail --no-fail-fast -E "$FILTER" --stress-count "$COUNT"

  # Fluid, the browser UI. Nothing under fluid/ is part of the cargo workspace,
  # so its gates are a job of their own: they neither wait on the Rust matrix
  # nor hold it up.
  #
  # This job runs the fast gates: the version check, the API types, typecheck,
  # lint, format check, the build and the bundle budget. The unit tests are
  # the slow part (9 to 12 minutes of a 15 minute job on main, and past the
  # old 20 minute limit on a branch with more diagram tests), so they run in
  # the fluid-unit matrix below, side by side with this job.
  fluid:
    name: fluid
    timeout-minutes: 15
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    env:
      # Corepack fetches the pinned pnpm on first use, and the confirmation it
      # would otherwise ask for has nobody to answer it here. Set the same way
      # fluid/Dockerfile sets it, and for the same reason.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    defaults:
      run:
        working-directory: fluid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to the same major fluid/Dockerfile:18 pins (node:26-alpine), so
      # CI, the image and a laptop are one fact. vitest 5 needs Node 22.12 or
      # newer; corepack is installed through npm just below, which needs Node
      # already present, so this step comes first.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      # Corepack rather than a pnpm setup action, and for one reason: corepack
      # reads the "packageManager" pin in fluid/package.json, so the pnpm
      # version used here, in the Fluid image and on a laptop is one fact in one
      # place. It is no longer bundled with Node, hence the install, pinned to
      # the same corepack release fluid/Dockerfile pins. zizmor's
      # adhoc-packages audit flags any install outside a lockfile; an exact
      # version is as pinned as npm gets here, so that finding is ignored on
      # this step and on the other corepack steps (fluid-unit,
      # fluid-unit-total, fluid-smoke-build, fluid-smoke, fluid-audit,
      # build.yml fluid-dist, release.yml sbom).
      # Registry fetches retry (scripts/ci/retry.sh) so one slow answer cannot fail a release.
      - name: Enable corepack
        run: | # zizmor: ignore[adhoc-packages]
          "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 5 npm install --global corepack@0.36.0
          corepack enable pnpm
          "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 5 pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The UI reads its own version out of package.json at build time and
      # compares it against the version GET /auth/me reports. They are bumped by
      # hand, and a bump that forgets one of the two shows every reader a
      # version-skew warning about a skew that does not exist.
      - name: The UI version matches the workspace version
        run: |
          set -euo pipefail
          cargo_version=$(grep -m1 '^version = ' ../Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          fluid_version=$(node -p "require('./package.json').version")
          if [ "$cargo_version" != "$fluid_version" ]; then
            echo "::error file=fluid/package.json::fluid/package.json says $fluid_version and the workspace Cargo.toml says $cargo_version. Fluid compares its own version against the server's and warns the reader when they differ, so the two are bumped together."
            exit 1
          fi
          echo "version parity: $fluid_version"

      # src/api/gen is generated from the OpenAPI snapshot the service
      # crate emits, and is the only description of the API the UI has. A
      # regenerated file that differs means the snapshot moved and the UI is
      # typed against an API that no longer exists.
      - name: The generated API types match the OpenAPI snapshot
        run: |
          set -euo pipefail
          pnpm generate:api
          git add -N src/api/gen
          if ! git diff --exit-code src/api/gen; then
            echo "::error file=fluid/src/api/gen::the generated types differ from the committed ones. Run 'pnpm generate:api' in fluid/ and commit the result."
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # The unit tests run in fluid-unit.

      # The /π route's lazy chunks must fit on one 1.44 MB floppy, gzipped;
      # the eager JS (entry plus modulepreloads, raw) must stay under its
      # cap; the main chunk has a guideline (a warning, never a failure). Vite
      # writes its manifest only for this build, and the script removes it
      # again: the service crate embeds dist/ and must not serve it.
      - name: Build
        run: pnpm build
        env:
          FLUID_BUNDLE_REPORT: '1'

      - name: Bundle size
        run: node scripts/bundle-budget.ts

  # The Fluid unit tests (vitest), in parallel legs. Each leg runs `pnpm test`
  # with `--shard=<shard>/<legs>`: the same run the fluid job made, limited to
  # one part of the test files. vitest sorts the files by a hash of their path
  # and gives every shard an equal run of them, so a shard is a fixed set of
  # whole files and a new file lands in any shard. The split is by file count,
  # not by time: the two slowest files (editor/marks/fidelity and
  # diagram/flowchart/opsProperty, about 2.5 minutes each in CI) are next to
  # each other in that order and share shard 4/4, which therefore carries
  # about twice the work of the others. Measured on 2026-11-09 against the
  # per-file times of CI run 42635034806, that leg still needs only about 5
  # minutes of tests. More legs do not separate the two; a split of either
  # file, or a sequencer that shards by measured time, would.
  #
  # The number of legs is the length of the shard list and nothing else: the
  # leg reads it from strategy.job-total, so the list and the split cannot
  # disagree. Add a leg by adding the next number to the list.
  #
  # Every leg writes its file and test count to the job summary and hands the
  # list of files it ran to fluid-unit-total, which checks that the legs
  # together ran every test file once. `ci-passed` needs both jobs, so a
  # failed, cancelled or skipped leg uploads no tested-tree proof.
  fluid-unit:
    name: fluid-unit (${{ matrix.shard }}/${{ strategy.job-total }})
    timeout-minutes: 15
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # See the fluid job: corepack must not stop to ask before fetching pnpm.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      SHARD: ${{ matrix.shard }}
      TOTAL: ${{ strategy.job-total }}
      LEG: ${{ strategy.job-index }}
    defaults:
      run:
        working-directory: fluid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same pin and major as the fluid job.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      # Pinned corepack; the fluid job explains the zizmor ignore.
      # Registry fetches retry (scripts/ci/retry.sh) so one slow answer cannot fail a release.
      - name: Enable corepack
        run: | # zizmor: ignore[adhoc-packages]
          "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 5 npm install --global corepack@0.36.0
          corepack enable pnpm
          "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 5 pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The shard list must read 1, 2, ... in order, with no second matrix
      # dimension beside it: otherwise one shard runs twice and another never,
      # and the total no longer counts shards. This stops that before any test.
      - name: The shard matches its leg
        run: |
          set -euo pipefail
          if [ "$SHARD" != "$((LEG + 1))" ]; then
            echo "::error::leg $((LEG + 1)) of $TOTAL runs shard '$SHARD'. The shard list must be 1, 2, ... in order, and the matrix must have no other dimension."
            exit 1
          fi
          echo "this leg runs shard $SHARD of $TOTAL"

      # On GitHub vitest reports with `default` and `github-actions` (the
      # failure annotations) unless told otherwise. Naming `json` for the count
      # replaces that list, so the two are named here as well.
      - name: Unit tests
        run: >-
          pnpm test --shard="$SHARD/$TOTAL"
          --reporter=default --reporter=github-actions
          --reporter=json --outputFile.json="$RUNNER_TEMP/vitest.json"

      # Runs after a red test run too, so the summary still says what ran.
      - name: Count what this shard ran
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/vitest.json"
          out="$RUNNER_TEMP/fluid-unit"
          mkdir -p "$out"
          if [ ! -s "$report" ]; then
            echo "::error::shard $SHARD/$TOTAL wrote no vitest report"
            exit 1
          fi
          # The report names every file with its absolute path.
          jq -r --arg root "$PWD/" '.testResults[].name | ltrimstr($root)' "$report" \
            | sort >"$out/files-$SHARD.txt"
          files=$(awk 'END { print NR }' "$out/files-$SHARD.txt")
          tests=$(jq '.numTotalTests' "$report")
          printf '%s %s %s %s\n' "$SHARD" "$TOTAL" "$files" "$tests" >"$out/count-$SHARD.txt"
          line=$(jq -r --arg shard "$SHARD/$TOTAL" --arg files "$files" \
            '"shard \($shard): \($files) files, \(.numTotalTests) tests (\(.numPassedTests) passed, \(.numFailedTests) failed, \(.numPendingTests) skipped, \(.numTodoTests) todo)"' \
            "$report")
          echo "$line"
          {
            echo "$line"
            echo
            echo "<details><summary>the files of shard $SHARD/$TOTAL</summary>"
            echo
            sed 's/^/    /' "$out/files-$SHARD.txt"
            echo
            echo "</details>"
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$files" -eq 0 ] || [ "$tests" -eq 0 ]; then
            echo "::error::shard $SHARD/$TOTAL ran no test"
            exit 1
          fi

      # One day is enough: fluid-unit-total of this run is the only reader. A
      # re-run of this leg uploads the same name again, hence overwrite.
      - name: Upload the count
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fluid-unit-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/fluid-unit
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  # The legs of fluid-unit add up to the whole suite: vitest lists the test
  # files without running them, and that list must equal the files the legs
  # ran together, each once. Every shard must have reported. The sum of the
  # test counts goes to the job summary. Runs only when every leg passed (the
  # implicit success()), so a red leg shows as that leg and not as this check.
  fluid-unit-total:
    name: fluid-unit-total
    timeout-minutes: 10
    needs: fluid-unit
    runs-on: ubuntu-latest
    env:
      # See the fluid job: corepack must not stop to ask before fetching pnpm.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    defaults:
      run:
        working-directory: fluid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same pin and major as the fluid job.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      # Pinned corepack; the fluid job explains the zizmor ignore.
      # Registry fetches retry (scripts/ci/retry.sh) so one slow answer cannot fail a release.
      - name: Enable corepack
        run: | # zizmor: ignore[adhoc-packages]
          "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 5 npm install --global corepack@0.36.0
          corepack enable pnpm
          "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 5 pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the counts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fluid-unit-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/fluid-unit

      - name: Every test file ran in exactly one shard
        run: |
          set -euo pipefail
          counts="$RUNNER_TEMP/fluid-unit"
          work="$(mktemp -d)"
          shopt -s nullglob
          count_files=("$counts"/count-*.txt)
          if [ "${#count_files[@]}" -eq 0 ]; then
            echo "::error::no shard of fluid-unit left a count"
            exit 1
          fi
          # Each count file is one line: shard, total, files, tests.
          sort -n "${count_files[@]}" >"$work/counts"
          total=$(awk 'NR == 1 { print $2 }' "$work/counts")
          if ! awk -v total="$total" '$1 != NR || $2 != total { bad = 1 } END { exit (bad || NR != total) }' "$work/counts"; then
            echo "::error::the counts are not one per shard from 1 to $total:"
            cat "$work/counts"
            exit 1
          fi
          pnpm exec vitest list --filesOnly | sort >"$work/all"
          if [ ! -s "$work/all" ]; then
            echo "::error::vitest lists no test file at all"
            exit 1
          fi
          cat "$counts"/files-*.txt | sort >"$work/union"
          if ! diff -u "$work/all" "$work/union"; then
            echo "::error::the shards do not add up to the suite: a line with - is a test file no shard ran, a line with + one that two shards ran"
            exit 1
          fi
          files=$(awk 'END { print NR }' "$work/all")
          tests=$(awk '{ sum += $4 } END { print sum }' "$work/counts")
          line="the $total shards ran all $files test files, each once, with $tests tests together"
          echo "$line"
          {
            echo "$line"
            echo
            echo "| shard | files | tests |"
            echo "| --- | --- | --- |"
            awk '{ printf "| %s/%s | %s | %s |\n", $1, $2, $3, $4 }' "$work/counts"
          } >>"$GITHUB_STEP_SUMMARY"

  # The Claude Desktop launcher and the two bundle manifests. The launcher
  # is plain Node, so its tests run here on every change rather than only
  # when a release packs it. The hollow bundle is built on the user's machine
  # by `crystalline install claude-desktop`; CI stages the same source with
  # the hidden `desktop-bundle` command and checks it, so it needs the
  # binary built first.
  mcpb:
    name: mcpb
    timeout-minutes: 30
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The ubuntu test leg's entry (same profile, same target dir). Read only.
          shared-key: test
          save-if: false

      - name: Build crystalline
        run: cargo build -p crystalline --locked

      # The same pin and major as the fluid job.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: The launcher's tests
        run: node --test packaging/mcpb/shim/

      - name: Both manifests carry what they must
        env:
          CRYSTALLINE_BIN: target/debug/crystalline
        run: bash packaging/mcpb/tests/check-manifests.sh

      # The packer is pinned like the release's. validate checks the schema
      # and the icon only, never a binary, so the Desktop-only stage gets a
      # placeholder file. The hollow stage is packed by mcpb (what a user's
      # machine builds); the zip our own writer makes is unpacked and
      # validated too.
      - name: Both bundles validate and the hollow one packs
        shell: bash
        run: |
          set -euo pipefail
          crystalline=target/debug/crystalline
          "$crystalline" desktop-bundle hollow bundle/hollow --binary /opt/homebrew/bin/crystalline --pack bundle/own.mcpb
          npx --yes @anthropic-ai/mcpb@2.1.2 validate bundle/hollow
          npx --yes @anthropic-ai/mcpb@2.1.2 pack bundle/hollow bundle/hollow.mcpb
          mkdir -p bundle/own
          unzip -q bundle/own.mcpb -d bundle/own
          npx --yes @anthropic-ai/mcpb@2.1.2 validate bundle/own
          "$crystalline" desktop-bundle desktop-only bundle/desktop-only
          mkdir -p bundle/desktop-only/server
          printf 'placeholder\n' > bundle/desktop-only/server/crystalline
          npx --yes @anthropic-ai/mcpb@2.1.2 validate bundle/desktop-only

  # The browser smoke: the built bundle, a real daemon and a real browser. It
  # covers what jsdom cannot (see fluid/e2e/smoke.spec.ts) and needs the Rust
  # toolchain as well as Node.
  #
  # It runs as two jobs. This one builds the binary once and checks the split;
  # `fluid-smoke` below is a matrix of shards that each download the binary,
  # start their own daemon with run-smoke.sh and run a part of the spec files.
  # The suite in one job took 17 minutes on main and over 28 on a branch with
  # more diagram specs; the shards run side by side.
  #
  # The number of shards is set here once, in SMOKE_SHARDS. The build job
  # hands it to the matrix as an output, so the legs and the split cannot
  # disagree. Every shard runs twice: at the root, and under a path prefix.
  fluid-smoke-build:
    name: fluid-smoke-build
    timeout-minutes: 30
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    env:
      # See the fluid job: corepack must not stop to ask before fetching pnpm.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      SMOKE_SHARDS: '5'
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      total: ${{ steps.plan.outputs.total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The ubuntu test leg's entry (same profile, same target dir). Read only.
          shared-key: test
          save-if: false

      # Pinned to the same major fluid/Dockerfile:18 pins (node:26-alpine), so
      # CI, the image and a laptop are one fact. vitest 5 needs Node 22.12 or
      # newer; corepack is installed through npm just below, which needs Node
      # already present, so this step comes first.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      # Pinned corepack; the fluid job explains the zizmor ignore.
      # Registry fetches retry (scripts/ci/retry.sh) so one slow answer cannot fail a release.
      - name: Enable corepack
        run: | # zizmor: ignore[adhoc-packages]
          "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 5 npm install --global corepack@0.36.0
          corepack enable pnpm
          "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 5 pnpm --version
        working-directory: fluid

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: fluid

      - name: Plan the shards
        id: plan
        run: |
          set -euo pipefail
          case "$SMOKE_SHARDS" in
            ''|*[!0-9]*|0) echo "::error::SMOKE_SHARDS must be a whole number from 1, not '$SMOKE_SHARDS'"; exit 1 ;;
          esac
          echo "total=$SMOKE_SHARDS" >>"$GITHUB_OUTPUT"
          echo "shards=$(jq -nc --argjson n "$SMOKE_SHARDS" '[range(1; $n + 1)]')" >>"$GITHUB_OUTPUT"

      # The shards run what scripts/smoke-shards.ts gives them, and nothing
      # may fall out between them. Playwright lists the tests without running
      # them (no daemon, no browser), so this compares, for both runs, the
      # tests the shards list together with the whole suite: a test no shard
      # runs, a test two shards run or an empty shard fails here, before any
      # shard starts.
      - name: Every test is in exactly one shard
        working-directory: fluid
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          # Playwright's --list prints one line per test: two spaces, the
          # project in brackets, the file with line and column, and the title.
          tests() {
            pnpm exec playwright test --list "$@" >"$work/raw"
            grep '^  \[' "$work/raw" | sort || true
          }
          for base in '' /crystalline; do
            export FLUID_E2E_BASE_PATH="$base"
            run="${base:-the root}"
            tests >"$work/all"
            if [ ! -s "$work/all" ]; then
              echo "::error::playwright lists no test at all for the run at $run"
              exit 1
            fi
            : >"$work/union"
            for shard in $(seq 1 "$SMOKE_SHARDS"); do
              files=$(node scripts/smoke-shards.ts "$shard" "$SMOKE_SHARDS")
              mapfile -t args <<<"$files"
              tests "${args[@]}" >"$work/shard"
              if [ ! -s "$work/shard" ]; then
                echo "::error::shard $shard/$SMOKE_SHARDS of the run at $run lists no test"
                exit 1
              fi
              echo "shard $shard/$SMOKE_SHARDS ($run): $(wc -l <"$work/shard") tests in $(echo "$files" | tr '\n' ' ')"
              cat "$work/shard" >>"$work/union"
            done
            sort "$work/union" -o "$work/union"
            if ! diff -u "$work/all" "$work/union"; then
              echo "::error::the shards of the run at $run do not add up to the suite: a line with - is a test no shard runs, a line with + a test two shards run"
              exit 1
            fi
            echo "the $SMOKE_SHARDS shards of the run at $run hold all $(wc -l <"$work/all") tests, each once"
          done

      # The bundle is built before the binary, and the order is the point: the
      # service crate's build script copies fluid/dist into its OUT_DIR at
      # compile time, so a binary compiled first carries nothing and answers
      # 503 on every navigation. This is the one job in CI that exercises a
      # real embedded bundle (the Rust matrix compiles against the empty
      # placeholder and covers the serving rules with fixture assets), and
      # run-smoke.sh asserts it against the daemon's own port. Only the binary
      # and its staged bundle travel to the shards (see "Keep only what the
      # shards get" below): run-smoke.sh builds fluid/dist again for `vite
      # preview` on purpose, and the build is the same inputs and costs a few
      # seconds.
      - name: Build the bundle
        run: pnpm build
        working-directory: fluid

      # Debug rather than release: the smoke drives the API, not the throughput
      # of the index, and a release build would cost more than the run does.
      - name: Build crystalline
        run: cargo build -p crystalline --locked

      # A debug build does not put the bundle inside the binary. rust-embed
      # reads the files at run time from the folder the derive names, and in a
      # debug build that is the absolute path of the build script's staging
      # folder, target/debug/build/crystalline-service-<hash>/out/fluid-dist.
      # A release build embeds the files; this job builds debug on purpose (see
      # above). So the shards get that folder as well as the binary, at the
      # same path: the checkout path is the same on every runner, and the
      # artifact is unpacked into target/debug again.
      #
      # The rest of target/ moves aside, so the check below runs against
      # exactly the files the upload carries and nothing the build left beside
      # them. The last step of this job puts the full tree back.
      - name: Keep only what the shards get
        run: |
          set -euo pipefail
          mv target "$RUNNER_TEMP/target-built"
          mkdir -p target/debug
          cp "$RUNNER_TEMP/target-built/debug/crystalline" target/debug/
          found=0
          for staged in "$RUNNER_TEMP"/target-built/debug/build/crystalline-service-*/out/fluid-dist; do
            [ -f "$staged/index.html" ] || continue
            rel="${staged#"$RUNNER_TEMP"/target-built/debug/}"
            mkdir -p "target/debug/$rel"
            cp -R "$staged/." "target/debug/$rel/"
            echo "staged bundle: target/debug/$rel"
            found=1
          done
          if [ "$found" -ne 1 ]; then
            echo "::error::no staged bundle with an index.html under target/debug/build/crystalline-service-*/out/fluid-dist; the build script ran without fluid/dist"
            exit 1
          fi

      # The binary as a shard will run it: started on a free port with a
      # scratch state directory, it must answer GET / with the app shell (200)
      # and not with the 503 a binary without a bundle gives. This catches a
      # build that ran before the bundle existed as well as a bundle folder the
      # upload would leave behind, before ten legs fail on it one by one.
      - name: The binary serves the bundle
        run: |
          set -euo pipefail
          bin=target/debug/crystalline
          state="$(mktemp -d)"
          port=""
          for candidate in $(seq 7411 7431); do
            if ! (exec 3<>"/dev/tcp/127.0.0.1/$candidate") 2>/dev/null; then
              port="$candidate"
              break
            fi
          done
          if [ -z "$port" ]; then
            echo "::error::no free port from 7411 to 7431 for the bundle check"
            exit 1
          fi
          env XDG_CONFIG_HOME="$state/config" XDG_STATE_HOME="$state/state" \
            XDG_CACHE_HOME="$state/cache" XDG_DATA_HOME="$state/data" \
            CRYSTALLINE_DOMAINS_ROOT="$state/domains" \
            "$bin" serve --http "127.0.0.1:$port" >"$state/daemon.log" 2>&1 &
          daemon=$!
          trap 'kill "$daemon" 2>/dev/null || true' EXIT
          status=""
          for _ in $(seq 1 60); do
            status=$(curl --silent --output "$state/body" --write-out '%{http_code}' \
              --max-time 5 --header 'Accept: text/html' "http://127.0.0.1:$port/" || true)
            if [ "$status" != "000" ]; then
              break
            fi
            sleep 1
          done
          if [ "$status" != "200" ]; then
            echo "::error::the binary answered GET / with $status rather than 200, so it carries no web bundle the shards could use"
            tail -n 20 "$state/daemon.log" || true
            exit 1
          fi
          echo "the binary serves the bundle on its own (GET / answered 200)"

      # One day is enough: the shards of this run are the only readers. A
      # re-run of this job uploads the same name again, hence overwrite.
      # The whole of target/debug is the binary and its staged bundle now.
      - name: Upload the binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fluid-smoke-binary
          path: target/debug
          include-hidden-files: true
          retention-days: 1
          overwrite: true
          if-no-files-found: error

      # The full target/ back in place, whatever happened above. rust-cache
      # here only restores (save-if: false, the ubuntu test leg is the one that
      # saves the shared `test` key on main), so today its post step saves
      # nothing. This step keeps it that way if that ever changes: a save of
      # the cut-down tree would leave the next build with nothing to reuse.
      - name: Put the full target back
        if: always()
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/target-built" ]; then
            rm -rf target
            mv "$RUNNER_TEMP/target-built" target
            echo "target/ is the full build tree again"
          else
            echo "target/ was never moved aside"
          fi

  # One shard of the browser smoke: `run` says at the root or under a path
  # prefix, `shard` which part of the spec files. Every leg has its own
  # daemon, its own fixture domains and one Playwright worker, as the whole
  # suite had in one job. `ci-passed` needs this job, so every leg has to
  # pass; a failed, cancelled or skipped leg uploads no tested-tree proof.
  #
  # The `if` names the build job's result: `!cancelled()` replaces the implicit
  # success() check, so without it a failed build would still start every leg.
  fluid-smoke:
    name: fluid-smoke (${{ matrix.run }}, ${{ matrix.shard }}/${{ needs.fluid-smoke-build.outputs.total }})
    timeout-minutes: 30
    needs: fluid-smoke-build
    if: ${{ !cancelled() && needs.fluid-smoke-build.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.fluid-smoke-build.outputs.shards) }}
        run: [root, path]
    env:
      # See the fluid job: corepack must not stop to ask before fetching pnpm.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      CRYSTALLINE_BIN: ${{ github.workspace }}/target/debug/crystalline
      # The run under a path prefix: the same journeys with the daemon under
      # /crystalline, against the UI it serves itself. The base tag, the
      # router basename and every address outside the router are what that
      # run checks. Empty is the run at the root.
      FLUID_E2E_BASE_PATH: ${{ matrix.run == 'path' && '/crystalline' || '' }}
      SHARD: ${{ matrix.shard }}
      TOTAL: ${{ needs.fluid-smoke-build.outputs.total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same pin and major as the fluid job.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      # Pinned corepack; the fluid job explains the zizmor ignore.
      # Registry fetches retry (scripts/ci/retry.sh) so one slow answer cannot fail a release.
      - name: Enable corepack
        run: | # zizmor: ignore[adhoc-packages]
          "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 5 npm install --global corepack@0.36.0
          corepack enable pnpm
          "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 5 pnpm --version
        working-directory: fluid

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: fluid

      # The binary and its staged bundle, back at the paths the build job had
      # them (see "Keep only what the shards get" there).
      - name: Download the binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fluid-smoke-binary
          path: target/debug

      # An artifact does not keep the executable bit.
      - name: Make the binary executable
        run: chmod +x "$CRYSTALLINE_BIN"

      # The browsers are cached per runner OS and Playwright version. System
      # packages live outside the cache, so a hit still installs those.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        working-directory: fluid

      - name: Cache the browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install the browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit
        working-directory: fluid

      - name: Install the browser system packages
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium webkit
        working-directory: fluid

      # Stands up the daemon on a scratch state directory with the fixture
      # domains and four accounts (three of those domains private), checks
      # the UI the daemon serves out of the binary, rebuilds the bundle and
      # runs Playwright against `vite preview` (or, under a path, against the
      # daemon's own UI) for this shard's spec files. The script is the whole
      # sequence, so a local run of the same files is the same run.
      - name: Run the browser smoke
        run: |
          set -euo pipefail
          files=$(cd fluid && node scripts/smoke-shards.ts "$SHARD" "$TOTAL")
          mapfile -t args <<<"$files"
          echo "this shard runs: ${args[*]}"
          bash fluid/e2e/run-smoke.sh "${args[@]}"

      - name: Upload the failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fluid-smoke-traces-${{ matrix.run }}-${{ matrix.shard }}
          path: fluid/test-results
          if-no-files-found: ignore

  # The Fluid image, built the way the release builds it. Nothing here is
  # pushed: what it proves is that the Dockerfile still assembles (corepack on
  # musl, the COPY paths, the nginx stage) and that the configuration template
  # the entrypoint renders is one nginx accepts.
  fluid-image:
    name: fluid-image
    timeout-minutes: 10
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The build context is fluid/, exactly as the release job and the compose
      # file build it.
      - name: Build the image
        run: docker build -f fluid/Dockerfile -t crystalline-fluid:ci fluid/

      # A literal address rather than the image's own `crystalline:7411`
      # default: nginx resolves a proxy_pass host when it loads its
      # configuration, so a name nothing answers to would fail the test for a
      # reason that has nothing to do with the configuration.
      #
      # The command starts with `nginx`, which is what makes the image's own
      # entrypoint run envsubst over the template first: this validates the
      # rendered configuration, not the template.
      - name: The rendered nginx configuration is valid
        run: docker run --rm -e CRYSTALLINE_UPSTREAM=127.0.0.1:7411 crystalline-fluid:ci nginx -t

      - name: The rendered nginx configuration is valid under a path
        run: |
          docker run --rm -e CRYSTALLINE_UPSTREAM=127.0.0.1:7411 -e CRYSTALLINE_BASE_PATH=/crystalline \
            crystalline-fluid:ci sh -c '/docker-entrypoint.sh nginx -t && cat /etc/nginx/conf.d/default.conf /etc/nginx/conf.d/crystalline/*.conf' \
            | tee rendered.conf
          grep -q 'location /crystalline/api/' rendered.conf
          grep -q 'location = /.well-known/oauth-protected-resource/crystalline' rendered.conf
          grep -q "sub_filter '<base href=\"/\" />' '<base href=\"/crystalline/\" />';" rendered.conf

      - name: The app answers under a path
        run: |
          set -euo pipefail
          docker run -d --name fluid-base -e CRYSTALLINE_UPSTREAM=127.0.0.1:7411 -e CRYSTALLINE_BASE_PATH=/crystalline crystalline-fluid:ci
          trap 'docker rm -f fluid-base >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if docker exec fluid-base wget --spider -q http://127.0.0.1/crystalline/; then
              echo "the app answers under /crystalline"
              exit 0
            fi
            sleep 0.5
          done
          docker logs fluid-base
          echo "::error::the app did not answer under /crystalline within 15 s"
          exit 1

      - name: A base path that cannot be a prefix stops the container with its sentence
        run: |
          set -uo pipefail
          # The step shell runs with -e, so the expected failure is caught here.
          status=0
          out=$(docker run --rm -e CRYSTALLINE_UPSTREAM=127.0.0.1:7411 -e CRYSTALLINE_BASE_PATH=crystalline/ crystalline-fluid:ci nginx -t 2>&1) || status=$?
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then
            echo "::error::a bad CRYSTALLINE_BASE_PATH was accepted"
            exit 1
          fi
          if ! printf '%s\n' "$out" | grep -q 'CRYSTALLINE_BASE_PATH must look like /crystalline'; then
            echo "::error::the container stopped, but not with the base path sentence"
            exit 1
          fi

      - name: The bundle is where nginx serves from
        run: |
          docker run --rm --entrypoint sh crystalline-fluid:ci -c '
            set -eu
            test -f /usr/share/nginx/html/index.html
            test -d /usr/share/nginx/html/assets
            ls /usr/share/nginx/html/assets | head -n 3
          '

      # docs/deployment.md strips /crystalline with `uri strip_prefix`, and
      # the bare /crystalline has to reach the daemon as /. Checked with a real
      # Caddy, the second site standing in for the daemon and answering the
      # path it got.
      - name: The Caddy example strips the bare path to the root
        run: |
          set -euo pipefail
          cat > Caddyfile <<'CADDY'
          {
            admin off
            auto_https off
          }
          :8080 {
            @crystalline path /crystalline /crystalline/*
            handle @crystalline {
              uri strip_prefix /crystalline
              reverse_proxy 127.0.0.1:7411
            }
          }
          :7411 {
            respond "{http.request.uri.path}"
          }
          CADDY
          docker run -d --name caddy-check --network host -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
          trap 'docker rm -f caddy-check >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/crystalline/health >/dev/null 2>&1 && break
            sleep 0.5
          done
          for pair in "/crystalline:/" "/crystalline/:/" "/crystalline/health:/health" "/crystalline/api/v1/x:/api/v1/x"; do
            asked="${pair%%:*}"
            want="${pair#*:}"
            got=$(curl -fsS "http://127.0.0.1:8080${asked}")
            echo "$asked -> $got"
            [ "$got" = "$want" ] || { echo "::error::$asked reached the daemon as '$got', not '$want'"; exit 1; }
          done

  style:
    name: style
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run style lint
        run: bash scripts/style-lint.sh

      # The version moves three files together and the fluid job compares only
      # two of them. The three pins in docs/evolve.md are what a user copies into
      # their own workflow, so a bump that forgets them ships a snippet pinning
      # the previous release.
      - name: The docs' action pins match the workspace version
        run: bash scripts/version-pins.sh

  # Static checks of the workflows and the bundled action. actionlint catches
  # expression, type and shell errors; zizmor catches the security mistakes
  # (template injection, over-wide tokens, persisted credentials, unpinned
  # or impostor actions). Both tools run from images pinned by digest inside
  # the SHA-pinned actions, at the versions named below. zizmor fails the job
  # inline instead of uploading SARIF, so the job needs no write scope, and an
  # accepted finding is ignored with a `# zizmor: ignore[...]` comment next to
  # its line and a reason above it. Not gated on `changes`: it takes seconds,
  # and a new zizmor audit can flag an unchanged workflow.
  workflow-lint:
    name: workflow-lint
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint 1.7.12 (the image digest is in the action's settings.json).
      - name: actionlint
        uses: devops-actions/actionlint@ec02b36684b2f574f1d219ad0a43b082e46bf3e4 # v0.1.13

      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          advanced-security: false
          annotations: true

  # Dependency audit for the Rust graph: advisories (RustSec), licenses (the
  # allowlist in deny.toml), sources (crates.io only) and bans (warnings).
  # Not gated on `changes`: a new advisory appears without any change here,
  # and it should show on the next pull request, whatever that touches.
  cargo-deny:
    name: cargo-deny
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # The workspace pin, so the action's container does not resolve a
          # different toolchain than the build. Move it together with
          # rust-toolchain.toml.
          rust-version: '1.99.1'
          arguments: --all-features --locked
          command: check

  # Dependency audit for the Fluid bundle's runtime dependencies. Only
  # --prod: what ships inside the binary is the production graph; the dev
  # tools (vite, vitest, eslint) never reach a reader.
  fluid-audit:
    name: fluid-audit
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    defaults:
      run:
        working-directory: fluid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      # Pinned corepack; the fluid job explains the zizmor ignore.
      # Registry fetches retry (scripts/ci/retry.sh) so one slow answer cannot fail a release.
      - name: Enable corepack
        run: | # zizmor: ignore[adhoc-packages]
          "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 5 npm install --global corepack@0.36.0
          corepack enable pnpm
          "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 5 pnpm --version

      # A pull request fails on an advisory. On a push to main the step may
      # fail without failing the job (continue-on-error), because a new
      # advisory has nothing to do with the merged tree and would only turn
      # main red; the report step below turns it into a warning instead.
      # The registry request retries (three tries) so one timeout is not an advisory.
      - name: pnpm audit --prod
        id: audit
        continue-on-error: ${{ github.event_name == 'push' }}
        run: '"$GITHUB_WORKSPACE"/scripts/ci/retry.sh 3 pnpm audit --prod'

      # Runs on both: failure() on a pull request (the step failed the job),
      # the outcome on main (continue-on-error left the job green). Writes the
      # advisories to the run summary and names the packages in a warning.
      - name: Report the advisories
        if: ${{ failure() || steps.audit.outcome == 'failure' }}
        run: |
          set -uo pipefail
          json="$RUNNER_TEMP/pnpm-audit.json"
          pnpm audit --prod --json >"$json" || true
          {
            echo "## pnpm audit --prod"
            echo
            echo "| package | severity | advisory |"
            echo "| --- | --- | --- |"
            jq -r '.advisories[] | "| \(.module_name) | \(.severity) | [\(.title)](\(.url)) |"' "$json" || echo "| (the audit output could not be read) | | |"
          } >>"$GITHUB_STEP_SUMMARY"
          packages=$(jq -r '[.advisories[].module_name] | unique | join(", ")' "$json" 2>/dev/null || true)
          echo "::warning title=pnpm audit::advisories for ${packages:-packages the audit output did not name}; see the run summary"

  musl-spike:
    name: musl-spike
    timeout-minutes: 30
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build crystalline for musl
        run: cargo build --release --locked --target x86_64-unknown-linux-musl -p crystalline

  # Dogfoods the bundled action end to end: it downloads the latest release
  # binary from jordiboehme/crystalline and verifies a fixture domain. A
  # regression to the caller's repo (the github.action_repository quirk that
  # this job guards against) would fail at the download step.
  verify-action:
    name: verify-action
    timeout-minutes: 10
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `./action` on purpose: the job tests the action as it is in this
      # checkout, which is the same commit the self-repository syntax `$/`
      # would resolve to. actionlint 1.7.12 does not parse `$/` yet, so
      # zizmor's self-repository finding is ignored here.
      - uses: ./action # zizmor: ignore[self-repository]
        with:
          paths: tests/fixtures/domain-good
          comment: 'false'

      # The team-repository input wired off, over the fixture a team
      # repository passes with. The action runs the latest release, so the
      # run with the input on joins here once a release carries
      # --team-repository (0.30.0); until then the crystalline crate's
      # `team_repository_adds_the_team_rules` covers the flag itself.
      - uses: ./action # zizmor: ignore[self-repository]
        with:
          paths: tests/fixtures/team-repository-good
          team-repository: 'false'
          comment: 'false'

  # The proof `changes` looks for on main: this pull request run passed every
  # gated job on this tree. A job `if` without a status function means
  # `success() && ...`, and a skipped need skips this job, so a run with a
  # failed, cancelled or skipped gated job uploads nothing. That includes a
  # documentation-only pull request, whose heavy jobs were skipped; main's own
  # classifier skips the same tree anyway. The ungated jobs (style, cargo-deny,
  # fluid-audit) are left out on purpose: they run again on every push to main,
  # and the two audits can go red on a new advisory that has nothing to do with
  # this tree. workflow-lint is ungated too but waited for: a workflow that
  # fails it should not count as tested. A matrix job such as `test`,
  # `fluid-unit` or `fluid-smoke` is a success here only when every one of its
  # legs is, so each shard of the unit tests and of the browser smoke is
  # required.
  ci-passed:
    name: ci-passed
    timeout-minutes: 10
    needs:
      - changes
      - test
      - fluid
      - fluid-unit
      - fluid-unit-total
      - fluid-smoke-build
      - fluid-smoke
      - fluid-image
      - mcpb
      - musl-spike
      - verify-action
      - workflow-lint
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      # The commit every job above checked out: refs/pull/N/merge at
      # github.sha.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Name the tested tree
        id: tree
        run: |
          set -euo pipefail
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "ci-passed: every gated job passed on the tree $tree (commit $GITHUB_SHA)"
          echo "tree=$tree" >>"$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/tested-tree"
          printf 'tree %s\ncommit %s\nrun %s\n' "$tree" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            >"$RUNNER_TEMP/tested-tree/tested-tree.txt"

      # A re-run of this job uploads the same name again, hence overwrite.
      - name: Upload the proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: ${{ runner.temp }}/tested-tree/tested-tree.txt
          retention-days: 7
          overwrite: true
          if-no-files-found: error
