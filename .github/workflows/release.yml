name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual dry run: exercises the full build-and-package matrix without
  # publishing a GitHub Release (the publish, images and homebrew jobs only
  # run for a tag push).
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Guards the whole build against a tag with no notes to publish. A tag push
  # with a missing, empty or motto-less release-notes/<tag>.md would otherwise
  # sail through the entire build-and-package matrix and fail only at the very
  # end, in `publish`, when `gh release create` has nothing to point
  # --notes-file at. `scripts/version-pins.sh` catches the common case (the
  # release PR forgot the file) earlier still, on main before the tag exists;
  # this is the backstop for a tag pushed straight, or a tag re-pushed after a
  # fix.
  #
  # workflow_dispatch has no tag and nothing to check, so the one step below
  # is a no-op then and the job stays green, which is what keeps a manual dry
  # run building end to end without a notes file.
  notes:
    name: verify the release notes file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: The release notes file exists, is not empty and opens with an H1
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "not a tag push, nothing to verify"
            exit 0
          fi
          file="release-notes/${{ github.ref_name }}.md"
          if [ ! -s "$file" ]; then
            echo "::error file=$file::$file is missing or empty. Add it and push the tag again (or, if the release PR already merged without it, add the file to main first)."
            exit 1
          fi
          if ! head -1 "$file" | grep -qE '^# .+'; then
            echo "::error file=$file::$file must open with an H1 (a line starting with '# ' followed by text), the release's motto. Fix the file and push the tag again."
            exit 1
          fi
          echo "release notes: $file"

  # The Fluid bundle and the six platform legs (build, sign, notarize,
  # package, plus the .deb and .msi packages) live in build.yml, which the dev
  # channel (dev.yml) shares. Its artifacts belong to this run, under the same
  # names as before, so every job below downloads them unchanged. The
  # secrets are passed through for the signing and notarization steps.
  build:
    name: build
    needs: notes
    uses: ./.github/workflows/build.yml
    with:
      channel: stable
    secrets: inherit

  mcpb:
    name: package MCP bundles
    needs: build
    runs-on: ubuntu-latest
    # No tag guard, unlike publish/images/homebrew below: a workflow_dispatch
    # dry run packages and validates all five bundles too (four per-arch
    # plus the universal one), it just has nowhere to upload them.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          else
            version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Download macos-arm64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crystalline-macos-arm64
          path: downloads/macos-arm64

      - name: Download macos-intel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crystalline-macos-intel
          path: downloads/macos-intel

      - name: Download windows-amd64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crystalline-windows-amd64
          path: downloads/windows-amd64

      - name: Download windows-arm64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crystalline-windows-arm64
          path: downloads/windows-arm64

      # One shell loop over the four per-arch platforms rather than a
      # build-style matrix, so the four resulting .mcpb files land in a
      # single directory and can be uploaded as one combined artifact below,
      # plus one extra universal bundle staged from binaries the loop already
      # extracted.
      - name: Stage bundles, generate manifests and pack
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p mcpb-out
          for platform in macos-arm64 macos-intel windows-amd64 windows-arm64; do
            download_dir="downloads/$platform"
            stage="bundle/$platform"
            mkdir -p "$stage/server"

            if [[ "$platform" == windows-* ]]; then
              unzip -q "$download_dir"/*.zip -d "$download_dir"
              bin=$(find "$download_dir" -type f -name 'crystalline.exe' | head -n1)
              cp "$bin" "$stage/server/crystalline.exe"
            else
              tar xzf "$download_dir"/*.tar.gz -C "$download_dir"
              bin=$(find "$download_dir" -type f -name 'crystalline' | head -n1)
              cp "$bin" "$stage/server/crystalline"
              chmod +x "$stage/server/crystalline"
            fi

            packaging/mcpb/generate-manifest.sh "$platform" "$version" "$stage"
            # The packer is pinned like every other release tool; bump it deliberately.
            npx --yes @anthropic-ai/mcpb@2.1.2 validate "$stage"
            npx --yes @anthropic-ai/mcpb@2.1.2 pack "$stage" "mcpb-out/crystalline-v${version}-${platform}.mcpb"
          done

          # Universal bundle: macOS arm64 plus windows amd64 in one package,
          # reusing the binaries the loop above already staged so nothing is
          # re-extracted from the downloaded archives.
          stage="bundle/universal"
          mkdir -p "$stage/server"
          cp bundle/macos-arm64/server/crystalline "$stage/server/crystalline"
          chmod +x "$stage/server/crystalline"
          cp bundle/windows-amd64/server/crystalline.exe "$stage/server/crystalline.exe"

          packaging/mcpb/generate-manifest.sh universal "$version" "$stage"
          npx --yes @anthropic-ai/mcpb@2.1.2 validate "$stage"
          npx --yes @anthropic-ai/mcpb@2.1.2 pack "$stage" "mcpb-out/crystalline-v${version}.mcpb"

      - name: Upload mcpb artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcpb-bundles
          path: mcpb-out/*.mcpb
          if-no-files-found: error

      # Skill zips: crystalline-claude-desktop-skill carries the consolidated
      # crystalline-intelligence skill Claude Desktop users upload as-is (the skill
      # FOLDER must sit at the zip root, hence zipping from inside skills/);
      # crystalline-agent-skills carries the four topical skills for harnesses
      # that install skill folders directly.
      - name: Package skill zips
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p skill-out
          (cd skills && zip -qr "../skill-out/crystalline-claude-desktop-skill-v${version}.zip" crystalline-intelligence)
          (cd skills && zip -qr "../skill-out/crystalline-agent-skills-v${version}.zip" \
            crystalline-routing crystalline-capture crystalline-schema crystalline-collaboration)
          # Exact-path assertions: each skill folder must sit at the zip ROOT
          # (an unanchored grep would also match a wrong skills/<name> layout)
          # and every topical skill must be present in the bundle zip.
          unzip -Z1 "skill-out/crystalline-claude-desktop-skill-v${version}.zip" | grep -qx 'crystalline-intelligence/SKILL.md'
          for s in crystalline-routing crystalline-capture crystalline-schema crystalline-collaboration; do
            unzip -Z1 "skill-out/crystalline-agent-skills-v${version}.zip" | grep -qx "$s/SKILL.md"
          done

      - name: Upload skill zips artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-zips
          path: skill-out/*.zip
          if-no-files-found: error

  # CycloneDX SBOMs: one per release target for the Rust binary (the crates
  # of Cargo.lock that the crystalline package links for that target; a
  # host-default run would drop the Windows-only crates), and one for the
  # Fluid bundle every binary embeds. No tag guard: a workflow_dispatch dry
  # run generates and checks them too, it just has nowhere to publish them.
  # Kept out of build.yml on purpose, so the dev channel stays as it is.
  sbom:
    name: generate the SBOMs
    needs: notes
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        run: rustup show

      # The same version string the archives carry (build.yml), so an SBOM
      # sits next to the archive it describes under the same prefix.
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=v0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      # cargo-cyclonedx writes a file next to every workspace member's
      # Cargo.toml whatever --manifest-path says, so the crates/cli one is
      # kept and the rest removed. It has no --locked flag; the diff check at
      # the end proves it did not touch the lockfile.
      - name: Generate the Rust SBOMs
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p sbom
          while read -r target platform; do
            [ -n "$target" ] || continue
            name="crystalline-${version}-${platform}.cdx"
            cargo cyclonedx --manifest-path crates/cli/Cargo.toml \
              --format json --spec-version 1.5 \
              --target "$target" --override-filename "$name"
            mv "crates/cli/${name}.json" "sbom/${name}.json"
            find crates -name "${name}.json" -delete
          done <<'TARGETS'
          aarch64-apple-darwin macos-arm64
          x86_64-apple-darwin macos-intel
          x86_64-unknown-linux-musl linux-amd64
          aarch64-unknown-linux-musl linux-arm64
          x86_64-pc-windows-msvc windows-amd64
          aarch64-pc-windows-msvc windows-arm64
          TARGETS
          git diff --exit-code Cargo.lock

      - name: Enable corepack
        working-directory: fluid
        run: |
          npm install --global corepack@0.35.0
          corepack enable pnpm
          pnpm --version

      # The store, not the lockfile alone, carries the license data, hence
      # the install. The file goes to ../sbom, never under fluid/dist: the
      # service crate embeds everything in that folder into the binary.
      - name: Generate the Fluid SBOM
        working-directory: fluid
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm sbom --sbom-format cyclonedx --sbom-type application \
            --sbom-spec-version 1.5 --prod \
            --out "../sbom/crystalline-fluid-${{ steps.version.outputs.version }}.cdx.json"

      # Cheap guards against an SBOM that is empty or describes the wrong
      # platform.
      - name: Check the SBOMs
        shell: bash
        run: |
          set -euo pipefail
          ls -la sbom
          test "$(find sbom -name '*.cdx.json' | wc -l)" -eq 7
          for f in sbom/*.cdx.json; do
            jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.5" and (.components | length) > 20' "$f" > /dev/null
          done
          for f in sbom/crystalline-*-windows-*.cdx.json; do
            jq -e '[.components[].name] | index("windows-sys") != null' "$f" > /dev/null
          done
          for f in sbom/crystalline-*-linux-*.cdx.json; do
            jq -e '[.components[].name] | index("windows-sys") == null' "$f" > /dev/null
          done
          jq -e '[.components[].name] | index("react") != null' sbom/crystalline-fluid-*.cdx.json > /dev/null

      - name: Upload the SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms
          path: sbom/*.cdx.json
          if-no-files-found: error

  publish:
    name: publish release
    needs: [build, mcpb, sbom]
    runs-on: ubuntu-latest
    # Only a tag push produces a real GitHub Release; workflow_dispatch stops
    # after the build matrix above so it can be used as a dry run.
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download all archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: downloads

      - name: Collect archives and generate checksums
        run: |
          set -euo pipefail
          mkdir -p release
          # The step above downloads every artifact the run produced, and one of
          # them is the fluid-dist bundle the build legs embed rather than
          # anything a reader downloads. Its files carry none of the extensions
          # below today, so the filter alone would do; the path exclusion is
          # what keeps that true when the bundler starts emitting something new.
          # The SBOMs (`*.cdx.json`) are release assets too, so they are listed in
          # SHA256SUMS like everything else.
          find downloads -type f -not -path 'downloads/fluid-dist/*' \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' -o -name '*.mcpb' -o -name '*.msi' -o -name '*.cdx.json' \) -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
          ls -la

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" release/* \
            --title "${{ github.ref_name }}" \
            --notes-file "release-notes/${{ github.ref_name }}.md"

  images:
    name: publish container images
    needs: build
    runs-on: ubuntu-latest
    # Same tag guard as publish: workflow_dispatch is a build-matrix dry run
    # only, it never pushes an image.
    if: github.ref_type == 'tag'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download x86_64 musl artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crystalline-linux-amd64
          path: downloads/amd64

      - name: Download aarch64 musl artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crystalline-linux-arm64
          path: downloads/arm64

      - name: Stage per-arch binaries
        run: |
          set -euo pipefail
          mkdir -p dist/linux-amd64 dist/linux-arm64
          tar xzf downloads/amd64/*.tar.gz -C downloads/amd64
          tar xzf downloads/arm64/*.tar.gz -C downloads/arm64
          amd64_bin=$(find downloads/amd64 -type f -name crystalline | head -n1)
          arm64_bin=$(find downloads/arm64 -type f -name crystalline | head -n1)
          cp "$amd64_bin" dist/linux-amd64/crystalline
          cp "$arm64_bin" dist/linux-arm64/crystalline
          chmod +x dist/linux-amd64/crystalline dist/linux-arm64/crystalline

      # The model layer is arch-independent (weights, tokenizer and config
      # files, no compiled code), so it is fetched once here on the runner
      # rather than once per target platform in the buildx step below. The
      # staged amd64 binary is statically linked (musl) and runs fine on this
      # glibc runner. XDG_CACHE_HOME is redirected to a scratch directory so
      # this never touches the runner's real cache, and the resulting
      # `crystalline/models` directory is renamed to `dist/model` to match
      # the layout `runtime-with-model` in the Dockerfile expects.
      - name: Prefetch the embedding model
        run: |
          set -euo pipefail
          XDG_CACHE_HOME="$PWD/dist/model-xdg" ./dist/linux-amd64/crystalline model download
          mv dist/model-xdg/crystalline/models dist/model

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/jordiboehme/crystalline
          # latest=false everywhere: the default latest=auto appends a bare
          # `latest` to every semver tag list, so the with-model push (which
          # runs last) would silently steal `latest` from the runtime image.
          # Only the explicit raw tag below moves `latest`, and only here.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Crystalline
            org.opencontainers.image.description=Local-first knowledge management for humans and AI agents.
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          # No provenance attestations: they publish as extra unknown/unknown
          # platform entries in the image index, which registry UIs list next
          # to the real platforms, and nothing consumes them here.
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate with-model image metadata
        id: meta_with_model
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/jordiboehme/crystalline
          # See the runtime metadata step: without latest=false this variant
          # would also emit `latest` and overwrite the runtime image's tag.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},suffix=-with-model
            type=raw,value=with-model
          labels: |
            org.opencontainers.image.title=Crystalline (with model)
            org.opencontainers.image.description=Local-first knowledge management for humans and AI agents, with the ibm-granite/granite-embedding-97m-multilingual-r2 embedding model (Apache-2.0 licensed) baked in so semantic search is ready immediately with no runtime download.
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      # Builds the variant for one platform and loads it into the local
      # docker daemon (buildx --load does not support a multi-platform
      # manifest) so it can be smoke tested below before anything is pushed.
      - name: Build the with-model image for an offline smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime-with-model
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta_with_model.outputs.tags }}
          labels: ${{ steps.meta_with_model.outputs.labels }}

      # Proves the baked model is complete and usable with zero network
      # access before the variant is published: `--network none` means
      # `model download` can only succeed by finding every file already in
      # place (including the hf-hub blob symlinks surviving the Dockerfile
      # COPY intact), the same offline path a real air-gapped deployment
      # depends on.
      - name: Verify the with-model image works fully offline
        run: |
          set -euo pipefail
          image="$(head -n1 <<< "${{ steps.meta_with_model.outputs.tags }}")"
          output="$(docker run --rm --network none "$image" model download)"
          echo "$output"
          grep -q "Model ready" <<< "$output"

      - name: Build and push the with-model image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime-with-model
          platforms: linux/amd64,linux/arm64
          push: true
          # Same as the runtime push: no unknown/unknown attestation entries.
          provenance: false
          tags: ${{ steps.meta_with_model.outputs.tags }}
          labels: ${{ steps.meta_with_model.outputs.labels }}

  # Fluid, the browser UI, as an image of its own. It carries no binary and
  # consumes nothing the build matrix produces, but it still waits on it: a tag
  # whose binaries failed to build is not a release, and a UI image published
  # for one would point at a Crystalline nobody can install.
  fluid-image:
    name: publish the Fluid image
    needs: build
    runs-on: ubuntu-latest
    # Same tag guard as publish and images: workflow_dispatch is a build-matrix
    # dry run only, it never pushes an image.
    if: github.ref_type == 'tag'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/jordiboehme/crystalline-fluid
          # latest=false plus the explicit raw tag, the same shape the
          # crystalline images use, so what moves `latest` is written down
          # rather than inferred from a default.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Crystalline Fluid
            org.opencontainers.image.description=The browser UI for a Crystalline instance. Crystalline stores what was learned; Fluid is where you think with it.
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      # No QEMU, unlike the crystalline images: the node stage is pinned to the
      # build platform (see fluid/Dockerfile) because a static bundle is the
      # same bytes whatever the target is, so only the nginx stage is built per
      # platform and nothing runs emulated.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: fluid
          file: fluid/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          # Same as the crystalline pushes: no unknown/unknown attestation
          # entries in the image index.
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  homebrew:
    name: update homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: read
    steps:
      - name: Download release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern SHA256SUMS --dir /tmp/release

      - name: Regenerate and push the formula
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          sums="/tmp/release/SHA256SUMS"

          sha_macos_arm=$(grep "crystalline-${TAG}-macos-arm64.tar.gz" "$sums" | awk '{print $1}')
          sha_macos_intel=$(grep "crystalline-${TAG}-macos-intel.tar.gz" "$sums" | awk '{print $1}')
          sha_linux_amd64=$(grep "crystalline-${TAG}-linux-amd64.tar.gz" "$sums" | awk '{print $1}')
          sha_linux_arm64=$(grep "crystalline-${TAG}-linux-arm64.tar.gz" "$sums" | awk '{print $1}')

          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/jordiboehme/homebrew-tap.git" \
            "${{ runner.temp }}/homebrew-tap"

          mkdir -p "${{ runner.temp }}/homebrew-tap/Formula"

          cat > "${{ runner.temp }}/homebrew-tap/Formula/crystalline.rb" << FORMULA
          class Crystalline < Formula
            desc "Local-first knowledge management for humans and AI agents"
            homepage "https://github.com/jordiboehme/crystalline"
            license "AGPL-3.0-or-later"
            version "${VERSION}"

            on_macos do
              on_arm do
                url "https://github.com/jordiboehme/crystalline/releases/download/v#{version}/crystalline-v#{version}-macos-arm64.tar.gz"
                sha256 "${sha_macos_arm}"
              end

              on_intel do
                url "https://github.com/jordiboehme/crystalline/releases/download/v#{version}/crystalline-v#{version}-macos-intel.tar.gz"
                sha256 "${sha_macos_intel}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/jordiboehme/crystalline/releases/download/v#{version}/crystalline-v#{version}-linux-amd64.tar.gz"
                sha256 "${sha_linux_amd64}"
              end

              on_arm do
                url "https://github.com/jordiboehme/crystalline/releases/download/v#{version}/crystalline-v#{version}-linux-arm64.tar.gz"
                sha256 "${sha_linux_arm64}"
              end
            end

            def install
              bin.install "crystalline"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/crystalline --version")
            end
          end
          FORMULA

          cd "${{ runner.temp }}/homebrew-tap"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/crystalline.rb
          git commit -m "Update crystalline to ${VERSION}"
          # The dev channel (dev.yml) writes Formula/crystalline-dev.rb in the
          # same tap, and a release merge and this tag push can race on it.
          # The two never touch the same file, so a rejected push rebases onto
          # the other one's commit and tries again; what is written does not
          # change.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), rebasing onto the tap and trying again"
            sleep $((attempt * 5))
            git pull --rebase
          done
          echo "::error::could not push Formula/crystalline.rb to the tap"
          exit 1
