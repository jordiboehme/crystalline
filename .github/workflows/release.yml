name: Release

# Two ways in. The `notes` job below resolves the release tag once and every
# later job reads its outputs, never the ref:
#
# - workflow_call: CI on main calls this after `ci-passed` when the workspace
#   version has no tag yet (scripts/release-check.sh). The tag comes from the
#   `tag` input; github.ref and github.event_name are the caller's here
#   (refs/heads/main, push), so they say nothing about the release. The
#   publish job creates the tag at the tested commit (github.sha) first.
# - workflow_dispatch: a dry run, from any branch or tag. It builds and
#   packages everything and publishes nothing (publish, images, fluid-image
#   and homebrew skip). On main it also makes, signs and checks SHA256SUMS
#   under a dry-run tag, which proves the signing key before a release.
#
# A pushed `v*` tag starts nothing. The `release` environment, which holds
# the signing keys, admits only main, so a run started by a tag push could
# never sign or publish; it would build the whole matrix and then fail at
# the environment. A merge to main is the only way to release.
on:
  workflow_dispatch: {}
  workflow_call:
    inputs:
      tag:
        description: The tag to release, v<version> of the workspace Cargo.toml
        type: string
        required: true
    # By name, as this file passes them on to build.yml, never `inherit`. The
    # Apple secrets resolve to the `release` environment's copies inside the
    # signing legs; TAP_GITHUB_TOKEN is the homebrew job's.
    secrets:
      APPLE_CERTIFICATE_P12:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_API_KEY_P8:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER_ID:
        required: false
      TAP_GITHUB_TOKEN:
        required: false
      # Declared only so the sign job may name it: no caller passes it. It
      # lives in the `release` environment, whose copy is what the sign job
      # reads, and nothing outside that environment ever sees it.
      MINISIGN_SECRET_KEY:
        required: false

env:
  CARGO_TERM_COLOR: always

# Read only by default. The jobs that publish (publish, images, fluid-image)
# name the scopes they need in their own `permissions:` block, so the build
# legs, which run every crate's build script, never hold a token that writes.
permissions:
  contents: read

jobs:
  # Resolves the release tag once, for every job below, and guards the whole
  # build against a tag with no notes to publish. A missing, empty or
  # motto-less release-notes/<tag>.md would otherwise sail through the entire
  # build-and-package matrix and fail only at the very end, in `publish`, when
  # `gh release create` has nothing to point --notes-file at.
  # `scripts/version-pins.sh` catches the common case (the release PR forgot
  # the file) earlier still, on the pull request, and so does
  # scripts/release-check.sh before CI calls this; this is the backstop.
  #
  # Outputs:
  # - tag: the release tag, or empty for a dry run.
  # - publish: true when the run publishes (a call from CI).
  # - build: false only when a call finds its tag already at another commit,
  #   which means another release of this version won the race; then the run
  #   skips everything after this job and stays green.
  # - sign: true when the run signs SHA256SUMS: every call that builds, and a
  #   dry run on main, which proves the secret key and the compiled-in public
  #   keys together before a release depends on them. A dry run from any
  #   other ref cannot enter the `release` environment and signs nothing.
  # - sign_tag: what the trusted comment names: the tag, or for a dry run
  #   v<version>-dry-run, which no updater ever asks for, so a dry run's
  #   signature can never pass for a release.
  #
  # workflow_dispatch has no tag and nothing to check, so the notes check is a
  # no-op then and the job stays green, which is what keeps a manual dry run
  # building end to end without a notes file.
  notes:
    name: verify the release notes file
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
      build: ${{ steps.resolve.outputs.build }}
      sign: ${{ steps.resolve.outputs.sign }}
      sign_tag: ${{ steps.resolve.outputs.sign_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # inputs.tag is set only by a call. A dry run has no inputs, and it
      # stays a dry run even when it was started on a tag: the ref never
      # makes a release. In a call GITHUB_REF is the caller's (main), so the
      # ref decides only whether a dry run signs.
      - name: Resolve the release tag
        id: resolve
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
            if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::the tag input '$tag' is not of the form vX.Y.Z"
              exit 1
            fi
            version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
            if [ "$tag" != "v$version" ]; then
              echo "::error::the tag input $tag does not match the workspace version $version at $GITHUB_SHA"
              exit 1
            fi
            # The caller checked that the tag is new, but a second push to
            # main can pass that check while the first release still runs.
            # The tag at this commit is a re-run and goes on; the tag at
            # another commit means that release won, so this one stops here.
            at="$(bash scripts/release-check.sh tag-commit "$tag")"
            build=true
            if [ -n "$at" ] && [ "$at" != "$GITHUB_SHA" ]; then
              echo "release: $tag already points at $at, not at $GITHUB_SHA, so another run released it; nothing to do"
              build=false
            fi
            # publish follows build: a run that lost the race publishes nothing.
            { echo "tag=$tag"; echo "publish=$build"; echo "build=$build"; echo "sign=$build"; echo "sign_tag=$tag"; } >> "$GITHUB_OUTPUT"
          else
            { echo "tag="; echo "publish=false"; echo "build=true"; } >> "$GITHUB_OUTPUT"
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
              { echo "sign=true"; echo "sign_tag=v${version}-dry-run"; } >> "$GITHUB_OUTPUT"
            else
              { echo "sign=false"; echo "sign_tag="; } >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: The release notes file exists, is not empty and opens with an H1
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TAG}" ]; then
            echo "a dry run, nothing to verify"
            exit 0
          fi
          file="release-notes/${RELEASE_TAG}.md"
          if [ ! -s "$file" ]; then
            echo "::error file=$file::$file is missing or empty. Add it to main (a merge releases again)."
            exit 1
          fi
          if ! head -1 "$file" | grep -qE '^# .+'; then
            echo "::error file=$file::$file must open with an H1 (a line starting with '# ' followed by text), the release's motto. Fix the file on main (a merge releases again)."
            exit 1
          fi
          echo "release notes: $file"

  # The Fluid bundle and the six platform legs (build, sign, notarize,
  # package, plus the .deb and .msi packages) live in build.yml. Its
  # artifacts belong to this run, under the same names as before, so every job
  # below downloads them unchanged.
  build:
    name: build
    needs: notes
    if: needs.notes.outputs.build == 'true'
    # A local reusable workflow resolves at the commit this run started on,
    # which is what the self-repository syntax `$/` would give too.
    # actionlint 1.7.12 does not parse `$/` yet, so zizmor's self-repository
    # finding is ignored here.
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository]
    # The tag names the archives and decides whether the Mac legs must sign.
    # In a call github.ref is the caller's branch, so build.yml cannot read
    # the tag from the ref itself.
    with:
      tag: ${{ needs.notes.outputs.tag }}
    # Only the six Apple secrets, by name, never `inherit`. Once they live in
    # the `release` environment, which build.yml's signing legs declare, the
    # environment's copy wins and these resolve to nothing here; until then
    # this is how the repository-level secrets reach the called workflow.
    secrets:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

  # One file for both Mac arches: MCPB picks a binary by OS, never by arch,
  # so the Desktop-only bundle carries a universal Mach-O. The slices come
  # from build.yml, signed and notarized there. lipo keeps each slice's own
  # signature, and notarization is recorded per slice, so the signed and
  # notarized thin binaries make a signed fat one. On a dry run without the
  # Apple secrets the slices are unsigned and there is nothing to verify.
  macos-universal:
    name: universal macOS binary
    needs: [notes, build]
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ needs.notes.outputs.tag }}
    steps:
      - name: Download macos-arm64 artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crystalline-macos-arm64
          path: downloads/arm64

      - name: Download macos-intel artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crystalline-macos-intel
          path: downloads/intel

      - name: Join the two slices
        shell: bash
        run: |
          set -euo pipefail
          tar xzf downloads/arm64/*.tar.gz -C downloads/arm64
          tar xzf downloads/intel/*.tar.gz -C downloads/intel
          arm=$(find downloads/arm64 -type f -name crystalline | head -n1)
          intel=$(find downloads/intel -type f -name crystalline | head -n1)
          mkdir -p universal
          lipo -create "$arm" "$intel" -output universal/crystalline
          lipo universal/crystalline -verify_arch arm64 x86_64
          # An unsigned branch build still carries the linker's ad-hoc
          # signature on the arm64 slice, so only a Developer ID authority
          # means the slices were really signed and notarized. The output is
          # read into a variable first, as build.yml does: a grep -q that
          # stops reading early could make codesign fail on a closed pipe,
          # and under pipefail a signed build would then skip the check.
          info="$(codesign -dvv "$arm" 2>&1 || true)"
          if grep -q 'Authority=Developer ID' <<<"$info"; then
            codesign --verify --strict --verbose=2 --arch arm64 universal/crystalline
            codesign --verify --strict --verbose=2 --arch x86_64 universal/crystalline
          elif [ -n "${RELEASE_TAG}" ]; then
            echo "::error::the macOS slices carry no Developer ID signature, and a tag must ship a signed and notarized binary"
            exit 1
          else
            echo "unsigned dry run: no signature to verify"
          fi
          universal/crystalline --version
          # The Intel slice runs through Rosetta on this arm runner. The
          # runner image has carried Rosetta so far; if one does not, the
          # check is skipped with a note instead of failing the release.
          # Rosetta is probed by its file, not by running a system binary:
          # newer macOS ships those without an x86_64 slice.
          if [ -x /Library/Apple/usr/share/rosetta/rosetta ]; then
            arch -x86_64 universal/crystalline --version
          else
            echo "::warning::Rosetta is not installed on this runner, so the x86_64 slice was not run"
          fi

      - name: Upload the universal binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crystalline-macos-universal
          path: universal/crystalline
          if-no-files-found: error

  mcpb:
    name: package MCP bundles
    needs: [notes, build, macos-universal]
    runs-on: ubuntu-latest
    # No tag guard, unlike publish/images/homebrew below: a workflow_dispatch
    # dry run stages, validates and packs the Desktop-only Mac bundle too, it
    # just has nowhere to upload it. The hollow launcher extension is no
    # release asset any more: `crystalline install claude-desktop` builds it
    # on the user's machine.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to the major CI's fluid job uses. No package cache: this job
      # makes release assets, and a cache a pull request could have written
      # must never reach them.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          package-manager-cache: false

      - name: The launcher's tests
        run: node --test packaging/mcpb/shim/

      - name: Resolve release version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.notes.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_TAG}" ]; then
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the universal macOS binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crystalline-macos-universal
          path: downloads/macos-universal

      # The release's own Linux build stages the bundles: it runs on this
      # runner, and it is the same source as the macOS binary, so the staged
      # manifest's version is the release's.
      - name: Download the Linux amd64 binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crystalline-linux-amd64
          path: downloads/linux-amd64

      - name: Extract the Linux amd64 binary
        shell: bash
        run: |
          set -euo pipefail
          tar xzf downloads/linux-amd64/*.tar.gz -C downloads/linux-amd64
          bin=$(find downloads/linux-amd64 -type f -name crystalline | head -n1)
          chmod +x "$bin"
          cp "$bin" downloads/linux-amd64/stage-crystalline

      - name: The manifest checks
        run: bash packaging/mcpb/tests/check-manifests.sh
        env:
          CRYSTALLINE_BIN: downloads/linux-amd64/stage-crystalline

      # The packer is pinned like every other release tool; bump it
      # deliberately. validate checks the manifest schema and the icon only.
      - name: Stage, validate and pack the Desktop-only bundle
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          mkdir -p mcpb-out

          # The Claude Desktop only extension: macOS, the universal binary
          # inside, for people who use only Claude Desktop.
          stage="bundle/desktop-only"
          mkdir -p "$stage/server"
          cp downloads/macos-universal/crystalline "$stage/server/crystalline"
          chmod +x "$stage/server/crystalline"
          downloads/linux-amd64/stage-crystalline desktop-bundle desktop-only "$stage"
          npx --yes @anthropic-ai/mcpb@2.1.2 validate "$stage"
          npx --yes @anthropic-ai/mcpb@2.1.2 pack "$stage" "mcpb-out/crystalline-claude-desktop-only-v${version}-macos.mcpb"

          # The bundle says the version it was packed for, so a manifest left
          # at an old version never ships under a new name.
          f="mcpb-out/crystalline-claude-desktop-only-v${version}-macos.mcpb"
          got=$(unzip -p "$f" manifest.json | jq -r .version)
          [ "$got" = "$version" ] || { echo "::error::$f says version $got, expected $version"; exit 1; }

          # It carries the binary, executable: validate and the version check
          # read only the manifest, so a stage without the binary would pass.
          # mcpb stores the permission bits only, with no file type, so
          # zipinfo prints '?rwxr-xr-x' for it; the first character is either.
          mode=$( (unzip -Z "$f" server/crystalline 2>/dev/null || true) | awk 'NR==1 {print $1}')
          case "$mode" in
            ?rwx*) ;;
            *) echo "::error::$f holds no executable server/crystalline (mode '${mode:-missing}')"; exit 1 ;;
          esac

      - name: Upload mcpb artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpb-bundles
          path: mcpb-out/*.mcpb
          if-no-files-found: error

      # Skill zips: crystalline-claude-desktop-skill carries the consolidated
      # crystalline-intelligence skill Claude Desktop users upload as-is (the skill
      # FOLDER must sit at the zip root, hence zipping from inside skills/);
      # crystalline-agent-skills carries the six topical skills for harnesses
      # that install skill folders directly.
      - name: Package skill zips
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          mkdir -p skill-out
          (cd skills && zip -qr "../skill-out/crystalline-claude-desktop-skill-v${version}.zip" crystalline-intelligence)
          (cd skills && zip -qr "../skill-out/crystalline-agent-skills-v${version}.zip" \
            crystalline-routing crystalline-capture crystalline-schema crystalline-collaboration crystalline-provisioning \
            crystalline-presentation)
          # Exact-path assertions: each skill folder must sit at the zip ROOT
          # (an unanchored grep would also match a wrong skills/<name> layout)
          # and every topical skill must be present in the bundle zip.
          unzip -Z1 "skill-out/crystalline-claude-desktop-skill-v${version}.zip" | grep -qx 'crystalline-intelligence/SKILL.md'
          for s in crystalline-routing crystalline-capture crystalline-schema crystalline-collaboration crystalline-provisioning crystalline-presentation; do
            unzip -Z1 "skill-out/crystalline-agent-skills-v${version}.zip" | grep -qx "$s/SKILL.md"
          done

      - name: Upload skill zips artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-zips
          path: skill-out/*.zip
          if-no-files-found: error

  # CycloneDX SBOMs: one per release target for the Rust binary (the crates
  # of Cargo.lock that the crystalline package links for that target; a
  # host-default run would drop the Windows-only crates), and one for the
  # Fluid bundle every binary embeds. No tag guard: a workflow_dispatch dry
  # run generates and checks them too, it just has nowhere to publish them.
  sbom:
    name: generate the SBOMs
    needs: notes
    if: needs.notes.outputs.build == 'true'
    runs-on: ubuntu-latest
    # Read only: the tools this job installs never get a token that can write.
    permissions:
      contents: read
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      # The same version string the archives carry (build.yml), so an SBOM
      # sits next to the archive it describes under the same prefix.
      - name: Resolve release version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.notes.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_TAG}" ]; then
            echo "version=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "version=v0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      # A prebuilt binary, checked against the SHA-256 in the install
      # action's manifest; `fallback: none` fails the step rather than
      # downloading an unpinned binary if the manifest ever lacks this host.
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-cyclonedx@0.5.9
          fallback: none

      # cargo-cyclonedx writes a file next to every workspace member's
      # Cargo.toml whatever --manifest-path says, so the crates/cli one is
      # kept and the rest removed. It has no --locked flag; the diff check at
      # the end proves it did not touch the lockfile.
      - name: Generate the Rust SBOMs
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          mkdir -p sbom
          while read -r target platform; do
            [ -n "$target" ] || continue
            name="crystalline-${version}-${platform}.cdx"
            cargo cyclonedx --manifest-path crates/cli/Cargo.toml \
              --format json --spec-version 1.5 \
              --target "$target" --override-filename "$name"
            mv "crates/cli/${name}.json" "sbom/${name}.json"
            find crates -name "${name}.json" -delete
          done <<'TARGETS'
          aarch64-apple-darwin macos-arm64
          x86_64-apple-darwin macos-intel
          x86_64-unknown-linux-musl linux-amd64
          aarch64-unknown-linux-musl linux-arm64
          x86_64-pc-windows-msvc windows-amd64
          aarch64-pc-windows-msvc windows-arm64
          TARGETS
          git diff --exit-code Cargo.lock

      # Pinned corepack; ci.yml's fluid job explains the zizmor ignore.
      # Registry fetches retry (scripts/ci/retry.sh) so one slow answer cannot fail a release.
      - name: Enable corepack
        working-directory: fluid
        run: | # zizmor: ignore[adhoc-packages]
          "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 5 npm install --global corepack@0.36.0
          corepack enable pnpm
          "$GITHUB_WORKSPACE"/scripts/ci/retry.sh 5 pnpm --version

      # The store, not the lockfile alone, carries the license data, hence
      # the install. The file goes to ../sbom, never under fluid/dist: the
      # service crate embeds everything in that folder into the binary.
      - name: Generate the Fluid SBOM
        working-directory: fluid
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm sbom --sbom-format cyclonedx --sbom-type application \
            --sbom-spec-version 1.5 --prod \
            --out "../sbom/crystalline-fluid-${RELEASE_VERSION}.cdx.json"

      # Cheap guards against an SBOM that is empty or describes the wrong
      # platform.
      - name: Check the SBOMs
        shell: bash
        run: |
          set -euo pipefail
          ls -la sbom
          test "$(find sbom -name '*.cdx.json' | wc -l)" -eq 7
          for f in sbom/*.cdx.json; do
            jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.5" and (.components | length) > 20' "$f" > /dev/null
          done
          for f in sbom/crystalline-*-windows-*.cdx.json; do
            jq -e '[.components[].name] | index("windows-sys") != null' "$f" > /dev/null
          done
          for f in sbom/crystalline-*-linux-*.cdx.json; do
            jq -e '[.components[].name] | index("windows-sys") == null' "$f" > /dev/null
          done
          jq -e '[.components[].name] | index("react") != null' sbom/crystalline-fluid-*.cdx.json > /dev/null

      - name: Upload the SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sboms
          path: sbom/*.cdx.json
          if-no-files-found: error

  # The release's SHA256SUMS, made once here for the signing job. The steps
  # are the publish job's own download and collect steps, so publish makes
  # the same file again from the same artifacts and compares it with the
  # signed one byte for byte. Only the sums travel to the signing job, never
  # an archive. A dry run on main runs this, sign and check-signature too
  # (see the notes job's `sign` output); nothing of it is published.
  checksums:
    name: release checksums
    needs: [notes, build, mcpb, sbom]
    runs-on: ubuntu-latest
    if: needs.notes.outputs.sign == 'true'
    permissions:
      contents: read
    steps:
      # Only the release's own artifacts, by name. In a call from CI this run
      # is the CI run, so a bare download would also pull its test artifacts
      # (the smoke binary with a whole target/debug, the unit shards). The
      # build legs upload crystalline-<platform>, crystalline-deb-<arch> and
      # crystalline-msi-<platform>; the jobs above upload the other three.
      # Each lands in downloads/<artifact name>/, as a bare download did.
      - name: Download the build archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: crystalline-*
          path: downloads

      - name: Download the MCP bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcpb-bundles
          path: downloads/mcpb-bundles

      - name: Download the skill zips
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: skill-zips
          path: downloads/skill-zips

      - name: Download the SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sboms
          path: downloads/sboms

      - name: Collect archives and generate checksums
        run: |
          set -euo pipefail
          mkdir -p release
          # Positively the release artifacts the steps above downloaded, by
          # folder, then by extension, so nothing else that lands under
          # downloads/ (another run's artifact, a new bundler output) becomes
          # a release asset. crystalline-macos-universal is a bare binary and
          # falls out by extension; the bundle carries it. The SBOMs
          # (`*.cdx.json`) are release assets too, so they are listed in
          # SHA256SUMS like everything else.
          find downloads -type f \( -path 'downloads/crystalline-*/*' -o -path 'downloads/mcpb-bundles/*' -o -path 'downloads/skill-zips/*' -o -path 'downloads/sboms/*' \) \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' -o -name '*.mcpb' -o -name '*.msi' -o -name '*.cdx.json' \) -exec cp {} release/ \;
          cd release
          # The C locale fixes the glob's order, so this job and the other
          # copy of this step make the same bytes.
          LC_ALL=C sha256sum -- * > SHA256SUMS
          ls -la

      - name: Upload the checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sums
          path: release/SHA256SUMS
          if-no-files-found: error
          # Only this run needs it; a signed file for a release that may
          # never ship should not linger.
          retention-days: 1

  # Signs SHA256SUMS with the online minisign key, the only job that sees
  # MINISIGN_SECRET_KEY. It stays small on purpose: no checkout, so no build
  # script or repository file runs next to the key; no third-party action;
  # no token scope at all. The key has no password (made with -W), so nothing
  # is piped in, and stdin is /dev/null so a key that asked for one fails
  # instead of waiting. The trusted comment names the tag (`tag:v0.34.0`),
  # which is what crystalline_core::update::verify_signature checks, so an
  # old signature cannot pass for a new release. A dry run on main signs
  # with `tag:v<version>-dry-run`. The key file lives under RUNNER_TEMP,
  # readable only by the runner user, and is shredded whatever the signing
  # step did.
  sign:
    name: sign the checksums
    needs: [notes, checksums]
    runs-on: ubuntu-latest
    if: needs.notes.outputs.sign == 'true'
    # The protected `release` environment (main only) holds the key.
    environment:
      name: release
      deployment: false
    permissions: {}
    env:
      TAG: ${{ needs.notes.outputs.sign_tag }}
    steps:
      - name: Install minisign
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y minisign
          minisign -v

      - name: Download the checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sums
          path: signing

      - name: ${{ needs.notes.outputs.publish == 'true' && 'Sign SHA256SUMS' || 'Sign SHA256SUMS (dry run, nothing is published)' }}
        working-directory: signing
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::error::MINISIGN_SECRET_KEY is not set in the release environment"
            exit 1
          fi
          key="$RUNNER_TEMP/minisign.key"
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          unset MINISIGN_SECRET_KEY
          minisign -S -s "$key" -t "tag:${TAG}" -m SHA256SUMS -x SHA256SUMS.minisig < /dev/null
          ls -la

      - name: Remove the key
        if: always()
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/minisign.key"
          if [ -e "$key" ]; then
            shred -u "$key"
          fi

      - name: Upload the signature
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signature
          path: signing/SHA256SUMS.minisig
          if-no-files-found: error
          retention-days: 1

  # Proves the key pair before anything is published: the release's own
  # Linux binary checks the signature with the public keys compiled into it
  # and the tag in the trusted comment, the check every updater runs. A
  # missing, bad or wrongly tagged signature, or a secret key that does not
  # match the compiled-in keys, fails here, before the tag and the release
  # exist. In a dry run on main it checks the dry run's signature the same
  # way, so the secret and the keys are proven before a release needs them.
  check-signature:
    name: check the signature
    needs: [notes, build, sign]
    runs-on: ubuntu-latest
    if: needs.notes.outputs.sign == 'true'
    permissions: {}
    env:
      TAG: ${{ needs.notes.outputs.sign_tag }}
    steps:
      - name: Download the Linux amd64 binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crystalline-linux-amd64
          path: downloads/linux-amd64

      - name: Download the checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sums
          path: signed

      - name: Download the signature
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signature
          path: signed

      - name: ${{ needs.notes.outputs.publish == 'true' && 'Check the release signature' || 'Check the release signature (dry run, nothing is published)' }}
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/verify"
          mkdir -p "$dir"
          tar xzf downloads/linux-amd64/*.tar.gz -C "$dir"
          bin=$(find "$dir" -type f -name crystalline | head -n1)
          [ -n "$bin" ] || { echo "::error::no crystalline binary in the linux-amd64 archive"; exit 1; }
          chmod +x "$bin"
          # The test seams exist only in debug builds; the shipped binary
          # must not even carry their names. A new seam adds its name here.
          for seam in CRYSTALLINE_TEST_UPDATE_KEY; do
            if grep -a -q "$seam" "$bin"; then
              echo "::error::the release binary carries the test seam $seam"
              exit 1
            fi
          done
          "$bin" update verify-sums --tag "$TAG" signed/SHA256SUMS signed/SHA256SUMS.minisig

  publish:
    name: publish release
    needs: [notes, build, mcpb, sbom, checksums, sign, check-signature]
    runs-on: ubuntu-latest
    # Only a call from CI produces a real GitHub Release; workflow_dispatch
    # stops after the build matrix above so it can be used as a dry run.
    if: needs.notes.outputs.publish == 'true'
    # The protected `release` environment (main only).
    environment:
      name: release
      deployment: false
    # id-token and attestations: keyless signing of the attestations below (Sigstore through GitHub's OIDC token), nothing else.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.notes.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the release's own artifacts, by name. In a call from CI this run
      # is the CI run, so a bare download would also pull its test artifacts
      # (the smoke binary with a whole target/debug, the unit shards). The
      # build legs upload crystalline-<platform>, crystalline-deb-<arch> and
      # crystalline-msi-<platform>; the jobs above upload the other three.
      # Each lands in downloads/<artifact name>/, as a bare download did.
      - name: Download the build archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: crystalline-*
          path: downloads

      - name: Download the MCP bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcpb-bundles
          path: downloads/mcpb-bundles

      - name: Download the skill zips
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: skill-zips
          path: downloads/skill-zips

      - name: Download the SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sboms
          path: downloads/sboms

      - name: Collect archives and generate checksums
        run: |
          set -euo pipefail
          mkdir -p release
          # Positively the release artifacts the steps above downloaded, by
          # folder, then by extension, so nothing else that lands under
          # downloads/ (another run's artifact, a new bundler output) becomes
          # a release asset. crystalline-macos-universal is a bare binary and
          # falls out by extension; the bundle carries it. The SBOMs
          # (`*.cdx.json`) are release assets too, so they are listed in
          # SHA256SUMS like everything else.
          find downloads -type f \( -path 'downloads/crystalline-*/*' -o -path 'downloads/mcpb-bundles/*' -o -path 'downloads/skill-zips/*' -o -path 'downloads/sboms/*' \) \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' -o -name '*.mcpb' -o -name '*.msi' -o -name '*.cdx.json' \) -exec cp {} release/ \;
          cd release
          # The C locale fixes the glob's order, so this job and the other
          # copy of this step make the same bytes.
          LC_ALL=C sha256sum -- * > SHA256SUMS
          ls -la

      # The sums the sign job signed, and check-signature checked, must be
      # the sums made here: the same artifacts give the same file, and any
      # difference stops the release. The signature then ships next to them
      # as SHA256SUMS.minisig.
      - name: Download the signed checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sums
          path: signed

      - name: Download the signature
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signature
          path: signed

      - name: The signed checksums are these checksums
        shell: bash
        run: |
          set -euo pipefail
          if ! cmp signed/SHA256SUMS release/SHA256SUMS; then
            echo "::error::the signed SHA256SUMS differs from the one made from this run's artifacts"
            exit 1
          fi
          cp signed/SHA256SUMS.minisig release/SHA256SUMS.minisig

      # check-signature proved the key pair on its own download; this checks
      # the very files that ship, before the tag and the release exist.
      - name: Check the release signature
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/verify"
          mkdir -p "$dir"
          tar xzf "release/crystalline-${TAG}-linux-amd64.tar.gz" -C "$dir"
          bin=$(find "$dir" -type f -name crystalline | head -n1)
          [ -n "$bin" ] || { echo "::error::no crystalline binary in crystalline-${TAG}-linux-amd64.tar.gz"; exit 1; }
          chmod +x "$bin"
          "$bin" update verify-sums --tag "$TAG" release/SHA256SUMS release/SHA256SUMS.minisig

      # actions/attest fails only when a whole subject list matches nothing,
      # so a single renamed asset would drop out of its attestation without a
      # sound. Every path and glob the attest steps below use is checked here
      # first, and a missing one stops the release before anything is signed.
      - name: Check the attestation subjects exist
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for f in \
            SHA256SUMS \
            SHA256SUMS.minisig \
            "crystalline-fluid-${TAG}.cdx.json" \
            "crystalline-claude-desktop-only-${TAG}-macos.mcpb"; do
            [ -f "release/$f" ] || { echo "::error::missing attestation subject release/$f"; missing=1; }
          done
          for p in macos-arm64 macos-intel linux-amd64 linux-arm64 windows-amd64 windows-arm64; do
            [ -f "release/crystalline-${TAG}-${p}.cdx.json" ] || { echo "::error::missing SBOM release/crystalline-${TAG}-${p}.cdx.json"; missing=1; }
          done
          for f in macos-arm64.tar.gz macos-intel.tar.gz \
            linux-amd64.tar.gz linux-arm64.tar.gz \
            windows-amd64.zip windows-amd64.msi \
            windows-arm64.zip windows-arm64.msi; do
            [ -f "release/crystalline-${TAG}-${f}" ] || { echo "::error::missing attestation subject release/crystalline-${TAG}-${f}"; missing=1; }
          done
          for g in \
            'release/crystalline_*_amd64.deb' \
            'release/crystalline_*_arm64.deb' \
            "release/crystalline-${TAG}-*.tar.gz" \
            "release/crystalline-${TAG}-*.zip" \
            "release/crystalline-${TAG}-*.msi" \
            'release/crystalline_*.deb' \
            "release/crystalline-*${TAG}*.mcpb"; do
            compgen -G "$g" > /dev/null || { echo "::error::no attestation subject matches $g"; missing=1; }
          done
          exit "$missing"

      # Build provenance for every release asset, SHA256SUMS and the SBOMs
      # included, in one attestation. Verify with
      # `gh attestation verify <file> --repo jordiboehme/crystalline`.
      # Before the release is created, so a failed attestation stops the
      # release rather than leaving it published without provenance.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*

      # Each platform's SBOM, attested against the assets that carry that
      # platform's binary. The Desktop-only bundle carries both macOS slices
      # and gets both macOS SBOMs.
      - name: Attest the macos-arm64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: release/crystalline-${{ needs.notes.outputs.tag }}-macos-arm64.cdx.json
          subject-path: |
            release/crystalline-${{ needs.notes.outputs.tag }}-macos-arm64.tar.gz
            release/crystalline-claude-desktop-only-${{ needs.notes.outputs.tag }}-macos.mcpb

      - name: Attest the macos-intel SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: release/crystalline-${{ needs.notes.outputs.tag }}-macos-intel.cdx.json
          subject-path: |
            release/crystalline-${{ needs.notes.outputs.tag }}-macos-intel.tar.gz
            release/crystalline-claude-desktop-only-${{ needs.notes.outputs.tag }}-macos.mcpb

      - name: Attest the linux-amd64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: release/crystalline-${{ needs.notes.outputs.tag }}-linux-amd64.cdx.json
          subject-path: |
            release/crystalline-${{ needs.notes.outputs.tag }}-linux-amd64.tar.gz
            release/crystalline_*_amd64.deb

      - name: Attest the linux-arm64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: release/crystalline-${{ needs.notes.outputs.tag }}-linux-arm64.cdx.json
          subject-path: |
            release/crystalline-${{ needs.notes.outputs.tag }}-linux-arm64.tar.gz
            release/crystalline_*_arm64.deb

      - name: Attest the windows-amd64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: release/crystalline-${{ needs.notes.outputs.tag }}-windows-amd64.cdx.json
          subject-path: |
            release/crystalline-${{ needs.notes.outputs.tag }}-windows-amd64.zip
            release/crystalline-${{ needs.notes.outputs.tag }}-windows-amd64.msi

      - name: Attest the windows-arm64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: release/crystalline-${{ needs.notes.outputs.tag }}-windows-arm64.cdx.json
          subject-path: |
            release/crystalline-${{ needs.notes.outputs.tag }}-windows-arm64.zip
            release/crystalline-${{ needs.notes.outputs.tag }}-windows-arm64.msi

      # Fluid is embedded in every binary, so its SBOM is attested against
      # every asset that carries one. The archive globs name the tag, which
      # keeps the two skill zips (no binary inside) out.
      - name: Attest the Fluid SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: release/crystalline-fluid-${{ needs.notes.outputs.tag }}.cdx.json
          subject-path: |
            release/crystalline-${{ needs.notes.outputs.tag }}-*.tar.gz
            release/crystalline-${{ needs.notes.outputs.tag }}-*.zip
            release/crystalline-${{ needs.notes.outputs.tag }}-*.msi
            release/crystalline_*.deb
            release/crystalline-claude-desktop-only-${{ needs.notes.outputs.tag }}-macos.mcpb

      # Every release is a call from CI, which has to create its tag. An
      # annotated tag, made through the API because the checkout keeps no
      # credentials. Its tagger is the workflow's token. A tag made with that
      # token starts no other workflow, so this run is the only release of
      # it. The tag already at this commit is a re-run of a failed publish;
      # at another commit it is an error, never moved.
      - name: Create the tag at the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          at="$(bash scripts/release-check.sh tag-commit "$TAG")"
          if [ -n "$at" ]; then
            if [ "$at" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG already points at $at, not at the tested commit $GITHUB_SHA"
              exit 1
            fi
            echo "release: $TAG already points at $GITHUB_SHA"
            exit 0
          fi
          object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="$TAG" -f message="$TAG" -f object="$GITHUB_SHA" -f type=commit \
            --jq .sha)"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$object" > /dev/null
          echo "release: tagged $GITHUB_SHA as $TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" release/* \
            --verify-tag \
            --title "${TAG}" \
            --notes-file "release-notes/${TAG}.md"

  images:
    name: publish container images
    # sbom too, so a release whose SBOMs failed pushes no image either.
    needs: [notes, build, sbom]
    runs-on: ubuntu-latest
    # Same guard as publish: workflow_dispatch is a build-matrix dry run
    # only, it never pushes an image.
    if: needs.notes.outputs.publish == 'true'
    # The protected `release` environment (main only).
    environment:
      name: release
      deployment: false
    # id-token and attestations: keyless signing of the attestations below (Sigstore through GitHub's OIDC token), nothing else.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download x86_64 musl artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crystalline-linux-amd64
          path: downloads/amd64

      - name: Download aarch64 musl artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crystalline-linux-arm64
          path: downloads/arm64

      - name: Stage per-arch binaries
        run: |
          set -euo pipefail
          mkdir -p dist/linux-amd64 dist/linux-arm64
          tar xzf downloads/amd64/*.tar.gz -C downloads/amd64
          tar xzf downloads/arm64/*.tar.gz -C downloads/arm64
          amd64_bin=$(find downloads/amd64 -type f -name crystalline | head -n1)
          arm64_bin=$(find downloads/arm64 -type f -name crystalline | head -n1)
          cp "$amd64_bin" dist/linux-amd64/crystalline
          cp "$arm64_bin" dist/linux-arm64/crystalline
          chmod +x dist/linux-amd64/crystalline dist/linux-arm64/crystalline

      # The model layer is arch-independent (weights, tokenizer and config
      # files, no compiled code), so it is fetched once here on the runner
      # rather than once per target platform in the buildx step below. The
      # staged amd64 binary is statically linked (musl) and runs fine on this
      # glibc runner. XDG_CACHE_HOME is redirected to a scratch directory so
      # this never touches the runner's real cache, and the resulting
      # `crystalline/models` directory is renamed to `dist/model` to match
      # the layout `runtime-with-model` in the Dockerfile expects.
      - name: Prefetch the embedding model
        run: |
          set -euo pipefail
          XDG_CACHE_HOME="$PWD/dist/model-xdg" ./dist/linux-amd64/crystalline model download
          mv dist/model-xdg/crystalline/models dist/model

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No QEMU: the Dockerfile has no RUN step (it only copies the files
      # staged above and sets metadata), so the linux/arm64 build executes
      # nothing emulated. Add QEMU back together with any RUN step.
      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/jordiboehme/crystalline
          # The semver tags read the resolved release tag through `value`:
          # without it they come from the git ref, which in a call from CI is
          # refs/heads/main and yields no version tag at all.
          # latest=false everywhere: the default latest=auto appends a bare
          # `latest` to every semver tag list, so the with-model push (which
          # runs last) would silently steal `latest` from the runtime image.
          # Only the explicit raw tag below moves `latest`, and only here.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.notes.outputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Crystalline
            org.opencontainers.image.description=Local-first knowledge management for humans and AI agents.
            org.opencontainers.image.licenses=MPL-2.0

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          # No provenance attestations: they publish as extra unknown/unknown
          # platform entries in the image index, which registry UIs list next
          # to the real platforms, and nothing consumes them here.
          # The GitHub attestation below is stored beside the image, not inside its index.
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Provenance for the pushed image index, stored in the registry beside
      # it. Verify with
      # `gh attestation verify oci://ghcr.io/jordiboehme/crystalline:<version> --repo jordiboehme/crystalline`.
      # No storage record: that needs a third permission and an
      # organisation-owned repository.
      - name: Attest the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/jordiboehme/crystalline
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Generate with-model image metadata
        id: meta_with_model
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/jordiboehme/crystalline
          # See the runtime metadata step: without latest=false this variant
          # would also emit `latest` and overwrite the runtime image's tag.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.notes.outputs.tag }},suffix=-with-model
            type=raw,value=with-model
          labels: |
            org.opencontainers.image.title=Crystalline (with model)
            org.opencontainers.image.description=Local-first knowledge management for humans and AI agents, with the ibm-granite/granite-embedding-97m-multilingual-r2 embedding model (Apache-2.0 licensed) baked in so semantic search is ready immediately with no runtime download.
            org.opencontainers.image.licenses=MPL-2.0

      # Builds the variant for one platform and loads it into the local
      # docker daemon (buildx --load does not support a multi-platform
      # manifest) so it can be smoke tested below before anything is pushed.
      - name: Build the with-model image for an offline smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime-with-model
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta_with_model.outputs.tags }}
          labels: ${{ steps.meta_with_model.outputs.labels }}

      # Proves the baked model is complete and usable with zero network
      # access before the variant is published: `--network none` means
      # `model download` can only succeed by finding every file already in
      # place (including the hf-hub blob symlinks surviving the Dockerfile
      # COPY intact), the same offline path a real air-gapped deployment
      # depends on.
      - name: Verify the with-model image works fully offline
        env:
          IMAGE_TAGS: ${{ steps.meta_with_model.outputs.tags }}
        run: |
          set -euo pipefail
          image="$(head -n1 <<< "$IMAGE_TAGS")"
          output="$(docker run --rm --network none "$image" model download)"
          echo "$output"
          grep -q "Model ready" <<< "$output"

      - name: Build and push the with-model image
        id: push_with_model
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime-with-model
          platforms: linux/amd64,linux/arm64
          push: true
          # Same as the runtime push: no unknown/unknown attestation entries.
          # The GitHub attestation below is stored beside the image, not inside its index.
          provenance: false
          tags: ${{ steps.meta_with_model.outputs.tags }}
          labels: ${{ steps.meta_with_model.outputs.labels }}

      # As for the runtime image above; verify with
      # `gh attestation verify oci://ghcr.io/jordiboehme/crystalline:<version>-with-model --repo jordiboehme/crystalline`.
      - name: Attest the with-model image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/jordiboehme/crystalline
          subject-digest: ${{ steps.push_with_model.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  # Fluid, the browser UI, as an image of its own. It carries no binary and
  # consumes nothing the build matrix produces, but it still waits on it: a tag
  # whose binaries failed to build is not a release, and a UI image published
  # for one would point at a Crystalline nobody can install. It waits on the
  # SBOM job for the same reason.
  fluid-image:
    name: publish the Fluid image
    needs: [notes, build, sbom]
    runs-on: ubuntu-latest
    # Same guard as publish and images: workflow_dispatch is a build-matrix
    # dry run only, it never pushes an image.
    if: needs.notes.outputs.publish == 'true'
    # The protected `release` environment (main only).
    environment:
      name: release
      deployment: false
    # id-token and attestations: keyless signing of the attestations below (Sigstore through GitHub's OIDC token), nothing else.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/jordiboehme/crystalline-fluid
          # latest=false plus the explicit raw tag, the same shape the
          # crystalline images use, so what moves `latest` is written down
          # rather than inferred from a default.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.notes.outputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Crystalline Fluid
            org.opencontainers.image.description=The browser UI for a Crystalline instance. Crystalline stores what was learned; Fluid is where you think with it.
            org.opencontainers.image.licenses=MPL-2.0

      # No QEMU, as for the crystalline images: the node stage is pinned to the
      # build platform (see fluid/Dockerfile) because a static bundle is the
      # same bytes whatever the target is, so only the nginx stage is built per
      # platform and nothing runs emulated.
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: fluid
          file: fluid/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          # Same as the crystalline pushes: no unknown/unknown attestation
          # entries in the image index.
          # The GitHub attestation below is stored beside the image, not inside its index.
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # As for the runtime image in the images job; verify with
      # `gh attestation verify oci://ghcr.io/jordiboehme/crystalline-fluid:<version> --repo jordiboehme/crystalline`.
      - name: Attest the Fluid image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/jordiboehme/crystalline-fluid
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  homebrew:
    name: update homebrew tap
    needs: [notes, publish]
    runs-on: ubuntu-latest
    if: needs.notes.outputs.publish == 'true'
    # The protected `release` environment (main only).
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    env:
      TAG: ${{ needs.notes.outputs.tag }}
    steps:
      - name: Download release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          gh release download "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern SHA256SUMS --dir /tmp/release

      - name: Regenerate and push the formula
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          sums="/tmp/release/SHA256SUMS"

          sha_macos_arm=$(grep "crystalline-${TAG}-macos-arm64.tar.gz" "$sums" | awk '{print $1}')
          sha_macos_intel=$(grep "crystalline-${TAG}-macos-intel.tar.gz" "$sums" | awk '{print $1}')
          sha_linux_amd64=$(grep "crystalline-${TAG}-linux-amd64.tar.gz" "$sums" | awk '{print $1}')
          sha_linux_arm64=$(grep "crystalline-${TAG}-linux-arm64.tar.gz" "$sums" | awk '{print $1}')

          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/jordiboehme/homebrew-tap.git" \
            "${RUNNER_TEMP}/homebrew-tap"

          mkdir -p "${RUNNER_TEMP}/homebrew-tap/Formula"

          cat > "${RUNNER_TEMP}/homebrew-tap/Formula/crystalline.rb" << FORMULA
          class Crystalline < Formula
            desc "Local-first knowledge management for humans and AI agents"
            homepage "https://github.com/jordiboehme/crystalline"
            license "MPL-2.0"
            version "${VERSION}"

            on_macos do
              on_arm do
                url "https://github.com/jordiboehme/crystalline/releases/download/v#{version}/crystalline-v#{version}-macos-arm64.tar.gz"
                sha256 "${sha_macos_arm}"
              end

              on_intel do
                url "https://github.com/jordiboehme/crystalline/releases/download/v#{version}/crystalline-v#{version}-macos-intel.tar.gz"
                sha256 "${sha_macos_intel}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/jordiboehme/crystalline/releases/download/v#{version}/crystalline-v#{version}-linux-amd64.tar.gz"
                sha256 "${sha_linux_amd64}"
              end

              on_arm do
                url "https://github.com/jordiboehme/crystalline/releases/download/v#{version}/crystalline-v#{version}-linux-arm64.tar.gz"
                sha256 "${sha_linux_arm64}"
              end
            end

            def install
              bin.install "crystalline"
              (libexec/"install-source").write "homebrew\n"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/crystalline --version")
            end
          end
          FORMULA

          cd "${RUNNER_TEMP}/homebrew-tap"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/crystalline.rb
          git commit -m "Update crystalline to ${VERSION}"
          # Another push to the tap can land first. A rejected push rebases
          # onto the tap's newer commit and tries again; what is written does
          # not change.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), rebasing onto the tap and trying again"
            sleep $((attempt * 5))
            git pull --rebase
          done
          echo "::error::could not push Formula/crystalline.rb to the tap"
          exit 1
