# pnpm's own version is enforced by corepack from the "packageManager" pin in
# package.json (CI, the Fluid image and the release job enable corepack before
# any pnpm command). pnpm 12 would also switch to that version itself and then
# record it in a second YAML document at the top of pnpm-lock.yaml, and
# GitHub's dependency graph reads only the first document of a pnpm lockfile
# (dependabot/dependabot-core#15904), so Dependabot alerts for Fluid would go
# silent. `ignore` turns that switch off, and with it the second document.
pmOnFail: ignore
overrides:
  js-yaml: ^4.3.2
  "lodash-es@<4.18.0": ^4.18.1
  # GHSA-cg2g-xh64-v4q7, GHSA-mrv2-3pqr-j5jr, GHSA-c6gr-qvv4-5v3f: mermaid allows an older dompurify, keep it at the fixed release
  "dompurify@<3.4.17": ^3.4.17
  # GHSA-238p-pmpm-9mq7: mermaid 12.2 allows katex ^0.18.0, keep it at the fixed release.
  # One copy for the whole app: mermaid and micromark-extension-math use the
  # KaTeX the reader sets math with (0.19.1).
  "katex@<0.19.1": ^0.19.1
  # GHSA-g3hv-75wg-m249: eslint, @eslint/config-array and typescript-estree ask for
  # minimatch ^10 (eslint 10.14 asks ^10.2.6), and no 10.x release has the fix
  # (first patched: 11.0.1). They use only Minimatch#match, the pattern and
  # minimatch(), which 11 keeps, so keep it at the fixed release.
  "minimatch@<11.0.1": ^11.0.4
