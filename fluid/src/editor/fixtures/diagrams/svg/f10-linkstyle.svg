<svg id="rec-f10-linkstyle" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 1116px;" viewBox="0 0 1116 99" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#rec-f10-linkstyle{font-family:ui-sans-serif,system-ui,sans-serif;font-size:16px;fill:#0f172a;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#rec-f10-linkstyle .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#rec-f10-linkstyle .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#rec-f10-linkstyle .error-icon{fill:#ffffff;}#rec-f10-linkstyle .error-text{fill:#000000;stroke:#000000;}#rec-f10-linkstyle .edge-thickness-normal{stroke-width:1px;}#rec-f10-linkstyle .edge-thickness-thick{stroke-width:3.5px;}#rec-f10-linkstyle .edge-pattern-solid{stroke-dasharray:0;}#rec-f10-linkstyle .edge-thickness-invisible{stroke-width:0;fill:none;}#rec-f10-linkstyle .edge-pattern-dashed{stroke-dasharray:3;}#rec-f10-linkstyle .edge-pattern-dotted{stroke-dasharray:2;}#rec-f10-linkstyle .marker{fill:#475569;stroke:#475569;}#rec-f10-linkstyle .marker.cross{stroke:#475569;}#rec-f10-linkstyle svg{font-family:ui-sans-serif,system-ui,sans-serif;font-size:16px;}#rec-f10-linkstyle p{margin:0;}#rec-f10-linkstyle .label{font-family:ui-sans-serif,system-ui,sans-serif;color:#0f172a;}#rec-f10-linkstyle .cluster-label text{fill:#0f172a;}#rec-f10-linkstyle .cluster-label span{color:#0f172a;}#rec-f10-linkstyle .cluster-label span p{background-color:transparent;}#rec-f10-linkstyle .label text,#rec-f10-linkstyle span{fill:#0f172a;color:#0f172a;}#rec-f10-linkstyle .node rect,#rec-f10-linkstyle .node circle,#rec-f10-linkstyle .node ellipse,#rec-f10-linkstyle .node polygon,#rec-f10-linkstyle .node path{fill:#ece8f9;stroke:#45388c;stroke-width:1px;}#rec-f10-linkstyle .rough-node .label text,#rec-f10-linkstyle .node .label text,#rec-f10-linkstyle .image-shape .label,#rec-f10-linkstyle .icon-shape .label{text-anchor:middle;}#rec-f10-linkstyle .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#rec-f10-linkstyle .rough-node .label,#rec-f10-linkstyle .node .label,#rec-f10-linkstyle .image-shape .label,#rec-f10-linkstyle .icon-shape .label{text-align:center;}#rec-f10-linkstyle .node.clickable{cursor:pointer;}#rec-f10-linkstyle .root .anchor path{fill:#475569!important;stroke-width:0;stroke:#475569;}#rec-f10-linkstyle .arrowheadPath{fill:#475569;}#rec-f10-linkstyle .edgePaths .path{stroke:#475569;stroke-width:1px;}#rec-f10-linkstyle .flowchart-link{stroke:#475569;fill:none;}#rec-f10-linkstyle .edgeLabel{background-color:#f1f5f9;text-align:center;}#rec-f10-linkstyle .edgeLabel p{background-color:#f1f5f9;}#rec-f10-linkstyle .edgeLabel rect{opacity:0.5;background-color:#f1f5f9;fill:#f1f5f9;}#rec-f10-linkstyle .labelBkg{background-color:rgba(241, 245, 249, 0.5);}#rec-f10-linkstyle .cluster rect{fill:#ffffff;stroke:hsl(0, 0%, 90%);stroke-width:1px;}#rec-f10-linkstyle .cluster text{fill:#0f172a;}#rec-f10-linkstyle .cluster span{color:#0f172a;}#rec-f10-linkstyle .node .collapsed-indicator{fill:hsl(0, 0%, 90%);stroke:none;opacity:0.6;}#rec-f10-linkstyle .node .collapsed-separator{stroke:hsl(0, 0%, 90%);stroke-width:0.75px;}#rec-f10-linkstyle div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;background:#ffffff;border:1px solid hsl(0, 0%, 90%);border-radius:2px;pointer-events:none;z-index:100;}#rec-f10-linkstyle .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#0f172a;}#rec-f10-linkstyle rect.text{fill:none;stroke-width:0;}#rec-f10-linkstyle .icon-shape,#rec-f10-linkstyle .image-shape{background-color:#f1f5f9;text-align:center;}#rec-f10-linkstyle .icon-shape p,#rec-f10-linkstyle .image-shape p{background-color:#f1f5f9;padding:2px;}#rec-f10-linkstyle