<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fluid</title>
    <!--
      The mark, inline: a cut gem in the two accent stops, so a tab says which
      app it is without a round trip for a file. No stock icon is left to
      replace - there never was one, so a tab showed the browser's blank page
      glyph.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230d9488' d='M12 2 3 9l9 13 9-13z'/%3E%3Cpath fill='%232dd4bf' d='M12 2 8 9h8z'/%3E%3C/svg%3E"
    />
    <script>
      // Set the theme before the first paint, so a dark-mode browser never
      // sees a white page flash while the bundle loads. The provider reads the
      // same key and takes over from here.
      (function () {
        try {
          var stored = localStorage.getItem("fluid-theme");
          var dark =
            stored === "dark" ||
            ((stored === null || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
