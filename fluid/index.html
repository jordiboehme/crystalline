<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fluid</title>
    <!--
      The mark, inline: the iso cell from the banner, a hexagon split into
      three faces in three accent stops, so a tab says which app it is without
      a round trip for a file. No stock icon is left to replace - there never
      was one, so a tab showed the browser's blank page glyph.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpolygon fill='%23b9afe6' points='12,12 1.5,12 6.75,2.91 17.25,2.91'/%3E%3Cpolygon fill='%236c5eb5' points='12,12 17.25,2.91 22.5,12 17.25,21.09'/%3E%3Cpolygon fill='%2345388c' points='12,12 17.25,21.09 6.75,21.09 1.5,12'/%3E%3C/svg%3E"
    />
    <script>
      // Set the theme before the first paint, so a dark-mode browser never
      // sees a white page flash while the bundle loads. The provider reads the
      // same key and takes over from here.
      (function () {
        try {
          var stored = localStorage.getItem("fluid-theme");
          var dark =
            stored === "dark" ||
            ((stored === null || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
