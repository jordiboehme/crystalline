# cargo-deny configuration: advisories, licenses, sources and bans.
# CI runs `cargo deny --all-features --locked check` on every pull request
# and every push to main (.github/workflows/ci.yml, job cargo-deny).

[graph]
# No target list: every platform is audited, so the Windows-only and
# macOS-only crates are audited from a Linux runner too. All features, so
# optional crates are audited too (the same as the CLI's --all-features, so
# a bare `cargo deny check` matches CI).
all-features = true

[advisories]
# Vulnerabilities fail the build wherever they sit in the tree. An
# "unmaintained" notice only counts for crates the workspace depends on
# directly, so a notice deep in the tree cannot stop every PR and the dev
# channel for a crate nobody here can replace (Jordi, 2026-09-30).
unmaintained = "workspace"
# An ignored advisory needs a reason and the date of the decision, in the
# reason text: { id = "RUSTSEC-YYYY-NNNN", reason = "YYYY-MM-DD: why" }.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "2026-09-30: rsa (Marvin attack) comes in through openidconnect, which uses it only to verify identity provider signatures with public keys, and as a dev dependency for the test identity provider's fixture keys; the timing leak needs private-key decryption or signing with rsa on a server, which Crystalline never does (the GitHub App token is signed with aws-lc-rs, not rsa), and no fixed version exists upstream yet" },
    { id = "RUSTSEC-2026-0387", reason = "2026-10-26: crypto-bigint 0.5.5 comes in only through p256 0.13, used by openidconnect to verify identity provider ID token signatures with public keys, and as a dev dependency through jsonwebtoken for the test identity provider's fixture keys; the timing leak needs secret integers, which Crystalline never computes with, and the fix exists only on the 0.7 line, which p256 0.13 cannot take. Remove once openidconnect moves to an elliptic-curve release on crypto-bigint 0.7.6 or later" },
    { id = "RUSTSEC-2026-0391", reason = "2026-10-26: zstd 0.13.3 with zstd-safe 7.3.0 comes in only through turso_core 0.8.3, tantivy 0.26.2 and tantivy-sstable 0.7.0, which call only the bulk API (zstd::bulk::Compressor and Decompressor, compress_to_buffer, decompress_to_buffer); the advisory is about the stream encoders and decoders built with with_context, which nothing in the graph calls, and the fix exists only on zstd 0.14 and zstd-safe 8, which tantivy 0.26 cannot take. Remove once turso moves to a tantivy on zstd 0.14.3 or later" },
    { id = "RUSTSEC-2026-0398", reason = "2026-10-26: zstd 0.13.3 with zstd-safe 7.3.0 comes in only through turso_core 0.8.3, tantivy 0.26.2 and tantivy-sstable 0.7.0, which call only the bulk API (zstd::bulk::Compressor and Decompressor, compress_to_buffer, decompress_to_buffer); the advisory is about Seekable::decompress behind the seekable feature, which nothing in the graph enables, and the fix exists only on zstd 0.14 and zstd-safe 8, which tantivy 0.26 cannot take. Remove once turso moves to a tantivy on zstd 0.14.3 or later" },
    { id = "RUSTSEC-2026-0403", reason = "2026-10-26: zstd 0.13.3 with zstd-safe 7.3.0 comes in only through turso_core 0.8.3, tantivy 0.26.2 and tantivy-sstable 0.7.0, which call only the bulk API (zstd::bulk::Compressor and Decompressor, compress_to_buffer, decompress_to_buffer); the advisory is about DCtx::decompress_stream, the streaming decoder, which the bulk API does not use, and the fix exists only on zstd 0.14 and zstd-safe 8, which tantivy 0.26 cannot take. Remove once turso moves to a tantivy on zstd 0.14.3 or later" },
    { id = "RUSTSEC-2026-0367", reason = "2026-10-17: zip 8.6.0 comes in only through candle-core 0.11.0, which has no release on zip 9 yet; candle opens archives with ZipArchive::new and reads entries by name (npy.rs, pickle.rs) and never calls ZipArchive::extract or ZipStreamReader::extract, the only functions this advisory is about, and Crystalline's own code is on zip 9.1.3. Remove once candle moves to zip 9" },
    { id = "RUSTSEC-2026-0368", reason = "2026-10-17: zip 8.6.0 comes in only through candle-core 0.11.0, which has no release on zip 9 yet; candle opens archives with ZipArchive::new and reads entries by name (npy.rs, pickle.rs) and never calls ZipArchive::extract or ZipStreamReader::extract, the only functions this advisory is about, and Crystalline's own code is on zip 9.1.3. Remove once candle moves to zip 9" },
    { id = "RUSTSEC-2026-0369", reason = "2026-10-17: zip 8.6.0 comes in only through candle-core 0.11.0, which has no release on zip 9 yet; candle opens archives with ZipArchive::new and reads entries by name (npy.rs, pickle.rs) and never calls ZipArchive::extract or ZipStreamReader::extract, the only functions this advisory is about, and Crystalline's own code is on zip 9.1.3. Remove once candle moves to zip 9" },
    { id = "RUSTSEC-2026-0429", reason = "2026-11-02: zip 8.6.0 comes in only through candle-core 0.11.0, which has no release on zip 9 yet; the advisory is about ZipArchive::extract on a symlink entry, and candle opens archives with ZipArchive::new and reads entries by name (npy.rs, pickle.rs), never calling extract; Crystalline's own code is on zip 9.1.3. Remove once candle moves to zip 9" },
]

[licenses]
# Exactly the licenses the lockfile uses today (2026-09-30). A dependency
# that brings a new license fails the check until it is added here on
# purpose.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
# The workspace crates carry Crystalline's own license, MPL-2.0, which is in
# the global allow list above, so they need no per-crate exception.

# cfg_block has no license field, only a LICENSE file (Apache-2.0). The
# clarification makes the result independent of cargo-deny's license-file
# detection; the hash pins the file it was checked against.
[[licenses.clarify]]
crate = "cfg_block"
expression = "Apache-2.0"
license-files = [{ path = "LICENSE", hash = 0xc9663a1e }]

[bans]
# Reported, never failing: duplicate versions are common in a graph this
# size, and the workspace path dependencies carry no version.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
