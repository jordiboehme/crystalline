[package]
name = "crystalline-identity"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Who a caller is and what they may touch in Crystalline: the account store, roles, domain access, grants, joins and scope."

[lib]
name = "crystalline_identity"
path = "src/lib.rs"

[features]
# The test seam another crate's tests read (the argon2 verification counter
# in auth_store), and nothing else. Off in every released binary.
testing = []
# The Postgres arm of the auth store (`auth_store/pg.rs`): accounts, sessions,
# tokens and grants in the configured Postgres database. Off here so a
# `--no-default-features` build of a dependent stays free of sqlx; the service
# and the CLI turn it on through their own `postgres` feature, and this
# crate's own tests through the self dev-dependency below.
postgres = ["dep:sqlx", "crystalline-index/postgres"]

[dependencies]
# hex_lower (ruled: identity depends on the index for it).
crystalline-index = { workspace = true }
# `Author` and `sanitize_name` for `ReflectionCaller` (scope.rs).
crystalline-core = { workspace = true }
anyhow = { workspace = true }
# URL-safe base64 for invite tokens (`auth_store/invites.rs`).
base64 = { workspace = true }
# `KnowledgeGovernor` (scope.rs), the engine's GitHub role lookup.
async-trait = { workspace = true }
argon2 = { workspace = true }
getrandom = { workspace = true }
# URL parsing for the OAuth redirect and resource checks (named directly
# since Task 7b; the same crate openidconnect re-exports).
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
# Accent folding for the account matcher (`account_match.rs`).
unicode-normalization = { workspace = true }
tracing = { workspace = true }
turso = { workspace = true }
sqlx = { workspace = true, optional = true }

[dev-dependencies]
# This crate's own tests always build the Postgres arm, so
# `CRYSTALLINE_TEST_AUTH_BACKEND=postgres` can run the suite against it.
# The self dev-dependency is intended (Cargo.lock lists the crate as its own
# dev-dependency), and `cargo deny` accepts it.
crystalline-identity = { path = ".", features = ["postgres"] }
futures = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
