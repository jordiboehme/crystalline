[package]
name = "crystalline-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "The shared engine of Crystalline: every data operation the MCP tools, the JSON API, the CLI and the control socket run, the review-mode overlay, origins and co-editing sessions."

[lib]
name = "crystalline_engine"
path = "src/lib.rs"

[features]
default = ["local-embeddings", "postgres"]
local-embeddings = ["crystalline-index/local-embeddings"]
postgres = ["crystalline-index/postgres"]
# The test seams this crate carries outside plain `cfg(test)`: the engine's
# arming methods and counters and nudge's share-walk counter. Off by
# default; crystalline-service's `testing` feature turns it on for that
# package's test builds, which is how its integration tests reach them.
testing = []

[dependencies]
crystalline-core = { workspace = true }
crystalline-index = { workspace = true }
crystalline-remote = { workspace = true }
crystalline-identity = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
# diffy has a workspace pin already (crates/remote uses it), but this crate
# does not inherit it automatically: plain-text merge conflict surfacing here
# needs its own line.
diffy = { workspace = true }
futures = { workspace = true }
globset = { workspace = true }
http = { workspace = true }
indexmap = { workspace = true }
percent-encoding = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
similar = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
walkdir = { workspace = true }
yrs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
serde_yaml_ng = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }
