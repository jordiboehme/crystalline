[package]
name = "crystalline-service"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Single-instance daemon and MCP server for Crystalline: lock and socket ownership, the file watcher, and the tool router."

[lib]
name = "crystalline_service"
path = "src/lib.rs"

[features]
# Forwarded to crystalline-index so a `--no-default-features` workspace build
# drops candle and sqlx while the daemon still compiles and serves text search
# over Turso.
default = ["local-embeddings", "postgres", "fluid-ui"]
local-embeddings = ["crystalline-index/local-embeddings", "crystalline-engine/local-embeddings"]
postgres = ["crystalline-index/postgres", "crystalline-engine/postgres"]
# The Fluid web bundle, compiled into the binary and served by every daemon on
# its HTTP endpoint (on at 127.0.0.1:7411 unless it is turned off).
# On by default so a plain `cargo build` produces the same code paths a release
# ships; a packager who wants a lean binary drops it with
# `--no-default-features`. The build script stages `fluid/dist` into `$OUT_DIR`
# and tolerates its absence, so a clone without node still builds and tests
# green with this on - the embed is then simply empty.
fluid-ui = ["dep:rust-embed"]
# The test seams outside plain `cfg(test)`, which live in crystalline-engine
# and are forwarded to its `testing` feature, and nothing else: the engine's own arming method and the branch that reads it, its
# counters (`prune_statements_issued`, `detection_walks`), plus
# `crate::nudge`'s share-walk counter (`SHARE_WALKS`, `share_walks_for`,
# `count_walk`), which moved out of the engine into its own module but is
# the same shape of seam. Off by default, so a released binary carries none
# of it; turned on for this package's own test builds by the self
# dev-dependency below, which is how an integration test - a separate crate -
# reaches something `cfg(test)` alone would hide from it.
testing = ["crystalline-engine/testing"]

[dependencies]
crystalline-core = { workspace = true }
crystalline-index = { workspace = true }
crystalline-identity = { workspace = true }
crystalline-engine = { workspace = true }
crystalline-rest = { workspace = true }
crystalline-remote = { workspace = true }
getrandom = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
percent-encoding = { workspace = true }
tokio = { workspace = true }
rmcp = { workspace = true, features = [
    "server",
    "client",
    "macros",
    # The elicitation surface a confirmation round is built from (SEP-2322
    # MRTR): `delete_engram` and the two edit verbs answer `input_required`
    # with one form question rather than acting straight away, whenever the
    # peer is on 2026-07-28 and declared it can put a question to its user.
    # Not `request-state`: these flows are stateless, the client's answer is
    # the whole state, and nothing is sealed into an echoed handle.
    "elicitation",
    "transport-async-rw",
    "transport-io",
    "transport-streamable-http-server",
    "transport-streamable-http-server-session",
] }
interprocess = { workspace = true, features = ["tokio"] }
fs4 = { workspace = true }
notify = { workspace = true }
axum = { workspace = true }
tower-service = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
# Optional: the embedded Fluid bundle, behind the `fluid-ui` feature.
rust-embed = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
# This package, with its test seam on: an integration test is its own crate, so
# `cfg(test)` inside the library does not cover it. Cargo unifies the feature
# for the test build only - `cargo build --release` of the CLI never sees it.
# `default-features = false` because this edge must add exactly one feature and
# nothing else: with the defaults implied, a `--no-default-features` build that
# carries tests would union `local-embeddings`, `postgres` and `fluid-ui` back
# in through this line and the lean-build check would be checking nothing.
crystalline-service = { path = ".", default-features = false, features = [
    "testing",
] }
tempfile = { workspace = true }
# The integration tests open a Turso database and walk a tree directly.
turso = { workspace = true }
walkdir = { workspace = true }
# The integration tests drive the HTTP endpoint, fake an identity provider
# and read back archives, co-editing documents and hashes; the crates they
# name for it are the rest crate's dependencies, not this package's.
reqwest = { workspace = true }
openidconnect = { workspace = true }
sha2 = { workspace = true }
yrs = { workspace = true }
zip = { workspace = true }
# `test-util` adds the paused clock the device flow's countdown test runs on,
# and `tracing-subscriber` the capture layer one test asserts the sign-in's
# log lines through; both are test-only additions to crates this package
# already depends on.
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
serde_yaml_ng = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
tiktoken-rs = { workspace = true }
tokio-tungstenite = { workspace = true }
# The fake identity provider in tests/oidc.rs: `jsonwebtoken` signs its ID
# tokens (RS256, from the committed PEM fixtures) and `rsa` reads the same PEM
# back to publish the matching modulus and exponent as a JWKS, so the key set
# the relying party validates against cannot drift from the key that signed.
jsonwebtoken = { workspace = true }
rsa = { workspace = true }
