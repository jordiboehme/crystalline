[package]
name = "crystalline-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
description = "Format, parsing and static verification primitives for Crystalline. No async, database or ML dependencies."

[lib]
name = "crystalline_core"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
jsonc-parser = { workspace = true }
serde_yaml_ng = { workspace = true }
toml = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
etcetera = { workspace = true }
walkdir = { workspace = true }
globset = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
anyhow = { workspace = true }
whoami = { workspace = true }
# The zip writer for the Claude Desktop extension and its skill
# (`desktop_extension::pack`): deflate only, the workspace pin.
zip = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The roaming folder from the known-folder API (`config::roaming_root`), and
# `desktop_open.rs` handing the Claude Desktop extension to the shell
# (ShellExecuteW, with COM set up first for a shell-extension handler).
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
