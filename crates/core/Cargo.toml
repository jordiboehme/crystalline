[package]
name = "crystalline-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
description = "Format, parsing and static verification primitives for Crystalline. No async, database or ML dependencies."

[lib]
name = "crystalline_core"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
jsonc-parser = { workspace = true }
serde_yaml_ng = { workspace = true }
toml = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
jiff = { workspace = true }
thiserror = { workspace = true }
etcetera = { workspace = true }
walkdir = { workspace = true }
globset = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
sha2 = { workspace = true }
minisign-verify = { workspace = true }
hmac = { workspace = true }
anyhow = { workspace = true }
whoami = { workspace = true }
# The zip writer for the Claude Desktop extension and its skill
# (`desktop_extension::pack`): deflate only, the workspace pin.
zip = { workspace = true }

[target.'cfg(unix)'.dependencies]
# `O_NONBLOCK` for reading an install marker (`update::install`), so a FIFO
# in its place cannot block the session hook.
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The roaming folder from the known-folder API (`config::roaming_root`): the
# same three features etcetera already enables, so nothing new is built.
# `Win32_Storage_FileSystem` sets the hidden attribute on the default domains
# root (`config::root_folder`).
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
minisign = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
