[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/index",
    "crates/identity",
    "crates/engine",
    "crates/rest",
    "crates/remote",
    "crates/service",
    "crates/cli",
]

[workspace.package]
version = "0.20.0"
authors = ["Jordi Böhme <jordi@boehme-lopez.de>"]
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.96"
repository = "https://github.com/jordiboehme/crystalline"

[workspace.dependencies]
crystalline-core = { path = "crates/core" }
# default-features off here so every dependent opts in to `local-embeddings`
# explicitly; `cargo build --workspace --no-default-features` then drops candle
# from the whole build rather than pulling it back in through a dependency edge.
crystalline-index = { path = "crates/index", default-features = false }
crystalline-identity = { path = "crates/identity" }
# default-features off for the same reason as the index: every dependent opts
# in to the embedding and Postgres features explicitly.
crystalline-engine = { path = "crates/engine", default-features = false }
crystalline-remote = { path = "crates/remote" }
crystalline-rest = { path = "crates/rest" }
crystalline-service = { path = "crates/service" }

clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
rmcp = "3.4.0"
turso = "0.7.2"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
# The model downloader: an async client over the same reqwest and rustls this
# workspace already builds, so one HTTP stack serves every caller. Pinned to
# rustls-tls and nothing else, because a feature this repo turns on here is a
# feature every reqwest client in the graph gets. hf-hub and its hf-xet
# dependency take reqwest with its default features on regardless, which is
# what puts system-proxy in the graph: every client build on macOS reads the
# system proxy store (measured at about 90 us per build on an Apple laptop, so
# it is a cost on paper rather than in practice).
hf-hub = { version = "1.0.0", default-features = false, features = ["rustls-tls"] }
# Pure-Rust regex backend (fancy-regex) instead of the onig C library, and no
# esaxx C++ trainer or progress bar; keeps musl static builds clean. Only the
# JSON tokenizer load and encode paths are used.
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
pulldown-cmark = "0.13.4"
# The PostgreSQL backend. `tls-rustls` shares reqwest's rustls (ring provider)
# rather than pulling OpenSSL, so the musl static release binaries stay
# self-contained; the runtime query API is used (no compile-time macros) so no
# live database is needed at build time. Gated behind the `postgres` feature.
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    # `EXPLAIN (FORMAT JSON)` comes back as a `json` column, which the plan
    # registry in crates/index/tests/plans.rs reads as a tree. serde_json is
    # already a direct dependency of every crate that would see it.
    "json",
] }
pgvector = { version = "0.4.2", default-features = false, features = ["sqlx"] }
notify = "8.2.0"
interprocess = "2.4.4"
sha2 = "0.11.0"
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
indexmap = "2.14.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
fs4 = "1.1.0"
axum = { version = "0.8.9", features = ["ws"] }
# The yrs `sync` feature makes observer callbacks Send + Sync for the
# multi-threaded server; the `yrs::sync` protocol module itself is
# unconditional. Wire format pinned in crates/service/tests/collab/collab_wire.rs.
yrs = { version = "0.28.0", features = ["sync"] }
# Text diffing for collaborative merge conflict surfacing (crates/engine).
similar = "3.2.0"
# Cheaply cloned byte buffers for the collab broadcast fan-out; also the shape
# axum's WebSocket binary frames take, so a frame crosses the seam without a
# copy. Already in the graph through axum and tokio.
bytes = "1.12.1"
# Dev-only: a WebSocket client to drive the collab session tests against the
# real server socket.
tokio-tungstenite = "0.30.0"
# Only the cookie extractor is used (session and CSRF handling in the REST
# auth layer); default features pull in tracing for unrelated extractors.
axum-extra = { version = "0.12.6", default-features = false, features = ["cookie"] }
# Only `Duration`, for the session cookie's Max-Age: the `cookie` crate that
# axum-extra builds on takes its durations from here and re-exports no
# constructor of its own. Already in the graph through that edge.
time = { version = "0.3.55", default-features = false }
# The `tower_service::Service` trait alone, which is what the MCP gate
# implements and what axum's `any_service`/`fallback_service` bound on. rmcp
# implements the same trait from the same crate; `tower::Service` is a
# re-export of it, and pulling the trait crate keeps the middleware stack out
# of the graph.
tower-service = "0.3.3"
libc = "0.2.189"
serde_yaml_ng = "0.10.0"
toml = "1.1.6"
async-trait = "0.1.92"
uuid = { version = "1.26.1", features = ["v4"] }
thiserror = "2.0.20"
anyhow = "1.0.104"
etcetera = "0.11.0"
walkdir = "2.5.0"
# Canonicalizes without adding (and, on Windows, while stripping) a `\\?\`
# verbatim prefix, so two paths naming the same file converge on one shape
# instead of a plain `std::fs::canonicalize` call introducing a new mismatch
# of its own (crates/cli's doctor, matching a verify finding back to a file
# a separate walk of "the same" root already found).
dunce = "1.0.5"
globset = "0.4.20"
schemars = "1.2.2"
futures = "0.3.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

# GitHub collaboration (crates/remote): plain-text three-way merge, the
# GitHub-issued token in the OS keychain and repository tarball extraction.
diffy = "0.5.2"
# `v1` pulls in exactly the apple-native (Keychain), windows-native and
# zbus-secret-service (pure-Rust, no libdbus) backends; the 0600 file fallback
# in crates/remote covers everything else (headless Linux without a session
# bus, CI).
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
tar = "0.4.46"
flate2 = "1.1.10"
base64 = "0.23.1"
# Percent-decoding for the MCP `resources/read` uri (crates/service). Already
# in the graph through axum and url; named directly because the MCP surface
# decodes an attachment uri itself, with no extractor doing it on the way in.
percent-encoding = "2.3.2"
# Password hashing for the account store (crates/identity). 0.6's default
# set is `alloc`, `getrandom` and `password-hash` - `std` is gone and `simple`
# became `password-hash` - and `rand_core` is no longer pulled in by default,
# so `hash_password` draws its salt through `PasswordHasher::hash_password`
# itself rather than a caller-supplied RNG, and every raw-bytes site (session
# tokens, MCP tokens, setup tokens, OAuth ids and codes) settles on the
# `getrandom` dependency below instead: password-hash 0.6.1's own `rand_core`
# feature is optional and rand_core 0.10.1 exports no `OsRng` at all, so
# `argon2::password_hash::rand_core::OsRng` cannot be reached any more.
argon2 = { version = "0.6.0", features = ["alloc", "password-hash"] }
# The direct entropy source for every raw random-bytes site across the
# identity, rest and service crates (crates/service/src/daemon.rs,
# crates/identity/src/join.rs, crates/identity/src/auth_store.rs,
# crates/rest/src/oauth.rs): already in the lock through argon2's own
# `getrandom` feature by way of password-hash, so naming it directly adds no
# new version to the graph, only a name every one of those sites can import
# instead of reaching through argon2's re-export.
getrandom = "0.4.3"

# Zip archives for the domain archive download and import (crates/rest).
# Default features drag aes, bzip2, lzma, ppmd, zstd and xz in; the archives
# this reads and writes are deflate only, and flate2 is already in the graph
# through crates/remote, so the lean deflate backend is the whole need.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# The Fluid web bundle, compiled into the binary (crates/service, behind the
# `fluid-ui` feature). This crate has no default features, and all three named
# here are load bearing rather than nice to have:
# `interpolate-folder-path` is what lets the derive read `$OUT_DIR/fluid-dist`
# (without it the path is taken literally and the build fails), `mime-guess` is
# what gives `Metadata::mimetype()`, the Content-Type of every served file, and
# `include-exclude` is what makes the `#[exclude = "*.map"]` attribute compile
# at all (the derive rejects it otherwise, by name). `sha256_hash()`, the ETag
# source, needs no feature.
rust-embed = { version = "8.12", features = [
    "interpolate-folder-path",
    "mime-guess",
    "include-exclude",
] }

# The OpenAPI document for the REST surface (crates/rest). Default features
# are exactly the `macros` one the `#[utoipa::path]`, `ToSchema` and
# `IntoParams` attributes need; `preserve_order` stays off, so nothing here can
# switch serde_json's map type on the whole workspace.
utoipa = "5.5.0"

# The OpenID Connect relying party (crates/rest). `default-features = false`
# is load bearing: the defaults are `reqwest` + `rustls-tls`, which reach
# reqwest through oauth2's `^0.12` requirement and would put a SECOND reqwest
# and a second TLS stack in the graph beside the workspace's 0.13. The crate
# has an `AsyncHttpClient` trait for exactly this, so `oidc` implements
# it over the one reqwest this workspace already builds.
#
# `accept-string-booleans` and `accept-rfc3339-timestamps` are tolerance for
# providers that spell a claim the way the specification does not: Entra, the
# provider the settings layer names, sends `email_verified` as the string
# "true", and RFC 3339 timestamps turn up in the wild where the spec asks for
# seconds since the epoch. Both only widen what parses; neither loosens a
# signature, an issuer or an audience check.
openidconnect = { version = "4.0.1", default-features = false, features = [
    "accept-string-booleans",
    "accept-rfc3339-timestamps",
] }
# The URL type openidconnect re-exports as `openidconnect::url`, named
# directly by the crates that parse addresses without speaking OpenID
# Connect (crystalline-identity, crystalline-engine). Same crate, same
# version as the re-export, so nothing new is built.
url = "2.5.8"
# The request types axum re-exports as `axum::http`, named directly by the
# engine, which reads a request's headers but never serves one. Same crate,
# same version as the re-export.
http = "1.5.0"

insta = { version = "1.48.0", features = ["yaml"] }
assert_cmd = "2.2.2"
# Dev-only, for the fake OpenID Connect provider the relying-party tests run
# against (crates/service). `rust_crypto` rather than `aws_lc_rs`: every crate
# it names - rsa, sha2 0.10, p256, p384, ed25519-dalek - is already in the
# graph through openidconnect, so the backend adds no new C or assembly build.
jsonwebtoken = { version = "11.1.0", default-features = false, features = [
    "use_pem",
    "rust_crypto",
] }
# Dev-only beside it: reads a PKCS#8 test key back out of its PEM so the fake
# provider can publish the matching JWKS. Already in the graph through
# openidconnect.
rsa = { version = "0.9.10", features = ["pem"] }
tempfile = "3.27.0"
# o200k_base tokenizer for the TOON vs JSON payload measurement test; pulls no
# serde_json (verified against its crates.io dependency list), so it cannot
# reintroduce the preserve_order feature into this workspace.
tiktoken-rs = "0.12.0"

# Dev and test builds carry line tables only: panics and backtraces keep
# file:line, links across the 45 integration-test binaries stay fast and the
# target directory stays a fraction of full-DWARF size. Interactive debugger
# variable inspection is the one thing this costs; release builds are
# untouched.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
