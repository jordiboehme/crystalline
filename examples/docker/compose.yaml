# Crystalline, single container.
#
# Engrams are the only data that matters and they live in the bind-mounted
# `./knowledge` folder on the host, one subfolder per domain. Everything
# under the named `crystalline-data` volume (the search index, the embedding
# model cache, config) is derived or cached - the image's XDG_STATE_HOME,
# XDG_CACHE_HOME and XDG_CONFIG_HOME all point under /data (see Dockerfile),
# so a single volume covers all of it. Losing it costs a `crystalline
# reindex --full` and a model re-download, never data.
#
# Agents connect over the HTTP MCP endpoint at http://localhost:7411 from
# the host (or http://crystalline:7411 from another container on this
# compose network) - stdio `crystalline mcp` is for local, non-containerized
# processes. http://localhost:7411 works out of the box; reaching the daemon
# by any other name (the crystalline service-name, a LAN host or a reverse
# proxy) needs that host in CRYSTALLINE_SERVICE_ALLOWED_HOSTS, since the
# transport validates the Host header to block DNS rebinding.
#
# Start it:
#   docker compose -f examples/docker/compose.yaml up -d
#
# One-shot initialization (run once, before or after the service is up - it
# is a separate short-lived container each time, not a shell session).
# domain add indexes /knowledge/team immediately: routed to the running
# service over the shared /data volume when it is already up, or indexed
# directly otherwise:
#
#   docker compose -f examples/docker/compose.yaml run --rm crystalline domain init /knowledge/team --name team
#   docker compose -f examples/docker/compose.yaml run --rm crystalline domain add team /knowledge/team

services:
  crystalline:
    image: ghcr.io/jordiboehme/crystalline:latest
    # Alternative: the with-model variant, with the
    # ibm-granite/granite-embedding-97m-multilingual-r2 embedding model baked
    # in. Use it when the daemon needs semantic search ready on its very
    # first start, or when this host has no egress to huggingface.co
    # (air-gapped or otherwise offline deployments):
    # image: ghcr.io/jordiboehme/crystalline:with-model
    # The image already defaults to serve with CRYSTALLINE_SERVICE_HTTP set, so
    # there is nothing to pass here. Exposure is configuration so that every
    # daemon on the host binds the same way, whoever started it.
    # Read-only variant: hide and refuse the content-mutating tools so agents
    # can only search and read this deployment's knowledge. Sync, watching and
    # embedding still run, so the index keeps following external edits to
    # ./knowledge. Uncomment:
    # command: ["serve", "--read-only"]
    environment:
      CRYSTALLINE_SERVICE_HTTP: "0.0.0.0:7411"
      # Reach the daemon by hostname / compose service-name / reverse proxy,
      # not just http://localhost:7411. Loopback is always allowed; list the
      # extra Host values (comma-separated), or "*" behind a trusted proxy.
      # CRYSTALLINE_SERVICE_ALLOWED_HOSTS: "crystalline,muthur.lan"
    ports:
      - "7411:7411"
    volumes:
      - ./knowledge:/knowledge
      - crystalline-data:/data
    restart: unless-stopped

volumes:
  crystalline-data:
