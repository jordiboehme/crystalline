# Crystalline on PostgreSQL - the accounts, sessions, tokens and the search
# index live in the database, so a redeploy keeps everyone signed in.
#
# The `db` service runs Postgres with pgvector; Crystalline points at it purely
# through CRYSTALLINE_DATABASE_BACKEND and CRYSTALLINE_DATABASE_URL, no mounted
# config file needed. Exactly one Crystalline instance is active on a database
# (or on a schema, see CRYSTALLINE_DATABASE_SCHEMA). A second instance waits as
# a standby, with no time limit, and takes over when the active one stops. A
# commented standby is included below. Several active instances on one database
# are not supported. The accounts start empty: sign in once, with the first
# admin from CRYSTALLINE_ADMIN_NAME and CRYSTALLINE_ADMIN_PASSWORD_FILE or with
# the setup token in `docker compose logs crystalline`.
#
# The vector extension is created by Crystalline on first open, so the stock
# pgvector image needs no init SQL. A file domain's files stay in ./knowledge
# and the index is rebuilt from them with `crystalline reindex --full`. A
# virtual domain keeps its engrams only in the database, so back up the Postgres
# volume or `crystalline domain export` them to a file copy.
#
# Start it:
#   docker compose -f examples/docker/compose.postgres.yaml up -d
#
# Run commands inside the running instance with `exec`. A second container
# started with `run --rm` is refused while the first one owns the database.
# Bootstrap a file domain and a virtual domain. domain add persists into the
# default config under the /data volume (XDG_CONFIG_HOME=/data/config, see
# Dockerfile), so no --config flag is needed:
#   docker compose -f examples/docker/compose.postgres.yaml exec crystalline \
#     crystalline domain init /knowledge/team --name team
#   docker compose -f examples/docker/compose.postgres.yaml exec crystalline \
#     crystalline domain add team /knowledge/team
#   docker compose -f examples/docker/compose.postgres.yaml exec crystalline \
#     crystalline domain add shared --virtual
#
# Fully immutable alternative: skip domain add and the bootstrap commands
# above entirely, and declare the team domain itself as an environment
# variable, so nothing is ever written to a config file at all - add this to
# the crystalline service's environment: block below:
#   CRYSTALLINE_DOMAIN_TEAM: /knowledge/team

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_USER: crystalline
      POSTGRES_PASSWORD: crystalline
      POSTGRES_DB: crystalline
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crystalline -d crystalline"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  crystalline:
    image: ghcr.io/jordiboehme/crystalline:latest
    # The name a standby and the status commands show for this instance (unless
    # service.public_url is set, whose host is used instead). Without it a
    # container is named by its container id, which changes on every recreate.
    hostname: crystalline-a
    # Alternative with the embedding model baked in (no first-start download):
    # image: ghcr.io/jordiboehme/crystalline:with-model
    # The image already defaults to serve with CRYSTALLINE_SERVICE_HTTP set, so
    # there is nothing to pass here. Exposure is configuration so that every
    # daemon on the host binds the same way, whoever started it.
    environment:
      CRYSTALLINE_SERVICE_HTTP: "0.0.0.0:7411"
      # Every agent that connects over HTTP signs in with a personal MCP
      # token. Without this, anyone who can reach the port is served with no
      # sign-in: they can read and change every shared domain, register
      # folders and change settings. The Host allow-list is not access
      # control, because any program can send "Host: localhost". Give each
      # agent its own account and token (the token is printed once):
      #   docker compose -f examples/docker/compose.postgres.yaml exec crystalline \
      #     crystalline users add agent-build --role editor --mcp-token build
      CRYSTALLINE_AUTH_MCP: "true"
      CRYSTALLINE_DATABASE_BACKEND: postgres
      CRYSTALLINE_DATABASE_URL: postgres://crystalline:crystalline@db:5432/crystalline
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "7411:7411"
    volumes:
      - ./knowledge:/knowledge
      - crystalline-data:/data
    restart: unless-stopped

  # An optional standby on the same database. It waits until the first
  # instance stops or dies, then takes over. It answers /health with
  # "role": "standby" and /ready with 503 while it waits, and it serves nothing
  # else. Give it the same database role as the first instance, so it can end
  # that instance's sessions when it takes over. It needs the same knowledge
  # files, so mount the same folder.
  #
  # crystalline-b:
  #   image: ghcr.io/jordiboehme/crystalline:latest
  #   hostname: crystalline-b
  #   environment:
  #     CRYSTALLINE_SERVICE_HTTP: "0.0.0.0:7411"
  #     CRYSTALLINE_AUTH_MCP: "true"
  #     CRYSTALLINE_DATABASE_BACKEND: postgres
  #     CRYSTALLINE_DATABASE_URL: postgres://crystalline:crystalline@db:5432/crystalline
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   volumes:
  #     - ./knowledge:/knowledge
  #     - crystalline-data-b:/data
  #   restart: unless-stopped

volumes:
  pgdata:
  crystalline-data:
  # crystalline-data-b:
