<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" role="img" aria-labelledby="two-title two-desc">
  <!-- TODO-0.26.0: Reflection: a second lifecycle beside evolve, sharing the agent's knowledge; a fix makes a presented section out of date, and what a discussion settles becomes knowledge the sweep tends | source: 0.23 spec Part B (B3) -->
  <title id="two-title">Two lifecycles, one body of knowledge</title>
  <desc id="two-desc">Two loops share one node in the middle, the agent's knowledge. On the left, evolve keeps the knowledge true: from the knowledge to the sweep, which finds what drifted, up to the fix, which the agent makes, and back into the knowledge. On the right, reflect keeps what people see in step: from the knowledge to present, sections people read, down to feedback, changes and comments, down to improve, what holds up, and back into the knowledge. Two dashed crossings join the loops: along the top, a fix leaves a presented section out of date; along the bottom, what a discussion settles becomes knowledge the sweep tends.</desc>
  <!-- embedded-font:start key=8973752eddd163d4 -->
  <!-- Figtree subset, SIL Open Font License 1.1, see theme/fonts/LICENSE-Figtree.txt; generated by tools/embed_svg_font.py, do not edit -->
  <style>
    @font-face { font-family: "Figtree"; font-style: normal; font-weight: 400; src: url(data:font/woff2;base64,) format("woff2"); }
    @font-face { font-family: "Figtree"; font-style: normal; font-weight: 600; src: url(data:font/woff2;base64,) format("woff2"); }
  </style>
  <!-- embedded-font:end -->

  <defs>
    <marker id="crys-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c5eb5"/>
    </marker>
  </defs>

  <!-- Panel -->
  <rect x="0.5" y="0.5" width="719" height="499" rx="12" ry="12"
        fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <g font-family="Figtree, DejaVu Sans, sans-serif"
     stroke-linejoin="round" stroke-linecap="round">

    <!-- Loop titles -->
    <text x="120" y="48" text-anchor="middle" font-size="16" font-weight="600" fill="#352879">EVOLVE</text>
    <text x="120" y="66" text-anchor="middle" font-size="12" fill="#57606a">keeps the knowledge true</text>
    <text x="600" y="48" text-anchor="middle" font-size="16" font-weight="600" fill="#352879">REFLECT</text>
    <text x="600" y="66" text-anchor="middle" font-size="12" fill="#57606a">keeps what people see in step</text>

    <!-- Evolve loop, clockwise: knowledge, sweep, fix, knowledge -->
    <g fill="none" stroke="#6c5eb5" stroke-width="1.5" marker-end="url(#crys-arrow)">
      <path d="M 280 284 Q 220 330 190 368"/>
      <path d="M 120 368 L 120 172"/>
      <path d="M 190 172 Q 220 210 280 236"/>
    </g>

    <!-- Reflect loop, clockwise: knowledge, present, feedback, improve, knowledge -->
    <g fill="none" stroke="#6c5eb5" stroke-width="1.5" marker-end="url(#crys-arrow)">
      <path d="M 440 236 Q 500 210 530 172"/>
      <path d="M 600 172 L 600 220"/>
      <path d="M 600 300 L 600 368"/>
      <path d="M 530 368 Q 500 330 440 284"/>
    </g>

    <!-- The two crossings -->
    <g fill="none" stroke="#6c5eb5" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#crys-arrow)">
      <path d="M 200 112 L 520 112"/>
      <path d="M 520 428 L 200 428"/>
    </g>
    <text x="360" y="100" text-anchor="middle" font-size="12" fill="#57606a">a fix leaves a presented section out of date</text>
    <text x="360" y="450" text-anchor="middle" font-size="12" fill="#57606a">what a discussion settles becomes</text>
    <text x="360" y="466" text-anchor="middle" font-size="12" fill="#57606a">knowledge the sweep tends</text>

    <!-- Shared node: the agent's knowledge -->
    <g>
      <rect x="280" y="214" width="160" height="92" rx="10" ry="10"
            fill="#352879" fill-opacity="0.12" stroke="#352879" stroke-width="1.5"/>
      <text x="360" y="242" text-anchor="middle" font-size="16" font-weight="600" fill="#352879">THE AGENT'S</text>
      <text x="360" y="262" text-anchor="middle" font-size="16" font-weight="600" fill="#352879">KNOWLEDGE</text>
      <text x="360" y="288" text-anchor="middle" font-size="14" fill="#1f2328">engrams</text>
    </g>

    <!-- Evolve: fix (top) and sweep (bottom) -->
    <g>
      <rect x="40" y="84" width="160" height="88" rx="10" ry="10"
            fill="#6c5eb5" fill-opacity="0.12" stroke="#6c5eb5" stroke-width="1.5"/>
      <text x="120" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#352879">FIX</text>
      <text x="120" y="140" text-anchor="middle" font-size="14" fill="#1f2328">the agent works</text>
      <text x="120" y="158" text-anchor="middle" font-size="14" fill="#1f2328">the queue</text>

      <rect x="40" y="368" width="160" height="88" rx="10" ry="10"
            fill="#6c5eb5" fill-opacity="0.12" stroke="#6c5eb5" stroke-width="1.5"/>
      <text x="120" y="404" text-anchor="middle" font-size="16" font-weight="600" fill="#352879">SWEEP</text>
      <text x="120" y="428" text-anchor="middle" font-size="14" fill="#1f2328">finds what drifted</text>
    </g>

    <!-- Reflect: present, feedback, improve -->
    <g>
      <rect x="520" y="84" width="160" height="88" rx="10" ry="10"
            fill="#70a4b2" fill-opacity="0.12" stroke="#70a4b2" stroke-width="1.5"/>
      <text x="600" y="124" text-anchor="middle" font-size="16" font-weight="600" fill="#352879">PRESENT</text>
      <text x="600" y="148" text-anchor="middle" font-size="14" fill="#1f2328">sections people read</text>

      <rect x="520" y="220" width="160" height="80" rx="10" ry="10"
            fill="#70a4b2" fill-opacity="0.12" stroke="#70a4b2" stroke-width="1.5"/>
      <text x="600" y="254" text-anchor="middle" font-size="16" font-weight="600" fill="#352879">FEEDBACK</text>
      <text x="600" y="278" text-anchor="middle" font-size="14" fill="#1f2328">changes, comments</text>

      <rect x="520" y="368" width="160" height="88" rx="10" ry="10"
            fill="#70a4b2" fill-opacity="0.12" stroke="#70a4b2" stroke-width="1.5"/>
      <text x="600" y="404" text-anchor="middle" font-size="16" font-weight="600" fill="#352879">IMPROVE</text>
      <text x="600" y="428" text-anchor="middle" font-size="14" fill="#1f2328">what holds up</text>
    </g>
  </g>
</svg>
