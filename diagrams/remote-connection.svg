<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 408" width="720" height="408" role="img" aria-labelledby="remote-title remote-desc">
  <title id="remote-title">A local Crystalline connected to a team server</title>
  <desc id="remote-desc">On the left, your laptop. The agent harness, its hooks and the CLI, with one MCP registration, talk to the local Crystalline over its socket, as today. The local Crystalline offers your domains and the team's, each from its one source, and keeps a small cache of answers. On the right, the team server holds the team's domains, MCP for agents that connect to it directly, and Fluid. A double-headed arrow labelled HTTPS, signed in joins the local Crystalline to the team's domains. A dashed arrow joins it to a dashed box, another server, if you add one. A colleague in a browser uses the team server's Fluid.</desc>
  <!-- embedded-font:start key=70fb8908b8480adb -->
  <!-- Figtree subset, SIL Open Font License 1.1, see theme/fonts/LICENSE-Figtree.txt; generated by tools/embed_svg_font.py, do not edit -->
  <style>
    @font-face { font-family: "Figtree"; font-style: normal; font-weight: 400; src: url(data:font/woff2;base64,) format("woff2"); }
    @font-face { font-family: "Figtree"; font-style: normal; font-weight: 600; src: url(data:font/woff2;base64,) format("woff2"); }
  </style>
  <!-- embedded-font:end -->

  <defs>
    <marker id="crys-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c5eb5"/>
    </marker>
  </defs>

  <!-- Panel -->
  <rect x="0.5" y="0.5" width="719" height="407" rx="12" ry="12"
        fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <g font-family="Figtree, DejaVu Sans, sans-serif"
     stroke-linejoin="round" stroke-linecap="round">

    <!-- The laptop -->
    <g>
      <rect x="24" y="40" width="240" height="320" rx="10" ry="10"
            fill="#57606a" fill-opacity="0.12" stroke="#57606a" stroke-width="1.5"/>
      <text x="144" y="70" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">YOUR LAPTOP</text>

      <rect x="40" y="88" width="208" height="80" rx="8" ry="8"
            fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
      <text x="144" y="116" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">harness, hooks, CLI</text>
      <text x="144" y="138" text-anchor="middle" font-size="12" fill="#57606a">one MCP registration</text>
      <text x="144" y="155" text-anchor="middle" font-size="12" fill="#57606a">unchanged</text>

      <rect x="40" y="232" width="208" height="108" rx="8" ry="8"
            fill="#352879" fill-opacity="0.12" stroke="#352879" stroke-width="1.5"/>
      <text x="144" y="258" text-anchor="middle" font-size="14" font-weight="600" fill="#352879">local Crystalline</text>
      <text x="144" y="280" text-anchor="middle" font-size="12" fill="#57606a">your domains and the team's,</text>
      <text x="144" y="297" text-anchor="middle" font-size="12" fill="#57606a">each from its one source</text>
      <text x="144" y="320" text-anchor="middle" font-size="12" fill="#57606a">a small cache of answers</text>
    </g>

    <!-- Harness, hooks and CLI to the local Crystalline: the socket, as today -->
    <g fill="none" stroke="#6c5eb5" stroke-width="1.5" marker-start="url(#crys-arrow)" marker-end="url(#crys-arrow)">
      <path d="M 144 168 L 144 232"/>
    </g>
    <text x="154" y="204" font-size="12" fill="#57606a">socket, as today</text>

    <!-- The team server -->
    <g>
      <rect x="400" y="40" width="184" height="256" rx="10" ry="10"
            fill="#352879" fill-opacity="0.12" stroke="#352879" stroke-width="1.5"/>
      <text x="492" y="70" text-anchor="middle" font-size="16" font-weight="600" fill="#352879">TEAM SERVER</text>

      <rect x="414" y="86" width="156" height="52" rx="8" ry="8"
            fill="#352879" fill-opacity="0.12" stroke="#352879" stroke-width="1.5"/>
      <text x="492" y="117" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">the team's domains</text>

      <rect x="414" y="150" width="156" height="56" rx="8" ry="8"
            fill="#6c5eb5" fill-opacity="0.12" stroke="#6c5eb5" stroke-width="1.5"/>
      <text x="492" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">MCP</text>
      <text x="492" y="193" text-anchor="middle" font-size="12" fill="#57606a">for direct connections</text>

      <rect x="414" y="218" width="156" height="62" rx="8" ry="8"
            fill="#70a4b2" fill-opacity="0.12" stroke="#70a4b2" stroke-width="1.5"/>
      <text x="492" y="244" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Fluid</text>
      <text x="492" y="264" text-anchor="middle" font-size="12" fill="#57606a">in the browser</text>
    </g>

    <!-- Another server, if you add one -->
    <g>
      <rect x="400" y="320" width="184" height="64" rx="10" ry="10"
            fill="#ffffff" stroke="#57606a" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text x="492" y="347" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">another server</text>
      <text x="492" y="367" text-anchor="middle" font-size="12" fill="#57606a">if you add one</text>
    </g>

    <!-- Local Crystalline to the servers: one signed-in HTTPS connection each -->
    <g fill="none" stroke="#6c5eb5" stroke-width="1.5" marker-start="url(#crys-arrow)" marker-end="url(#crys-arrow)">
      <path d="M 248 262 C 330 262, 330 112, 414 112"/>
    </g>
    <g fill="none" stroke="#6c5eb5" stroke-width="1.5" stroke-dasharray="6 4" marker-start="url(#crys-arrow)" marker-end="url(#crys-arrow)">
      <path d="M 248 318 C 330 318, 330 352, 400 352"/>
    </g>
    <text x="334" y="136" text-anchor="end" font-size="12" fill="#57606a">HTTPS,</text>
    <text x="334" y="152" text-anchor="end" font-size="12" fill="#57606a">signed in</text>

    <!-- A colleague in a browser -->
    <g>
      <rect x="604" y="218" width="92" height="62" rx="8" ry="8"
            fill="#57606a" fill-opacity="0.12" stroke="#57606a" stroke-width="1.5"/>
      <text x="650" y="244" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">colleague</text>
      <text x="650" y="264" text-anchor="middle" font-size="12" fill="#57606a">in a browser</text>
    </g>
    <g fill="none" stroke="#6c5eb5" stroke-width="1.5" marker-end="url(#crys-arrow)">
      <path d="M 604 249 L 570 249"/>
    </g>
  </g>
</svg>
