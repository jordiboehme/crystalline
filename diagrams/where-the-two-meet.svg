<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="meet-title meet-desc">
  <!-- TODO-0.26.0: Reflection is the common ground where the agent and people present, discuss and put a topic to the test | source: 0.23 spec B1, B3 -->
  <title id="meet-title">Where the two meet</title>
  <desc id="meet-desc">Two mirrored sides of equal size, the agent on the left and people on the right. The agent holds two parts: the model, which reasons, and its knowledge, the engrams. People mirror it: their knowledge, what they know, and the mind, which reasons. The two knowledge boxes face each other in the middle, joined by a two-way arrow, working together: pairing, observing, correcting. Below each side, two inputs join into one arrow into its knowledge, not into the model or the mind: experience sits under the knowledge, next to the middle, and the other input on the outside. For the agent, experience (its own actions) and onboarding (docs, code, history); for people, experience (years of work) and education (school, books, craft). Above both, spanning the full width, is Reflection: a topic presented, discussed and put to the test, with two-way arrows down to each side. Both bring what they know, both leave knowing more.</desc>
