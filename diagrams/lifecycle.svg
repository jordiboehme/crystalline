  <title id="lifecycle-title">The Crystalline lifecycle</title>
  <desc id="lifecycle-desc">A clockwise loop of three stages. Learn: onboarded, captures while working. Evolve: the sweep tends what was captured. Remember: recall routes the next task. The loop turns session by session.</desc>
