<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="refl-title refl-desc">
  <!-- TODO-0.26.0: Reflection: the agent presents its knowledge as reflections under a pact, people change and comment, the agent reads every change before it rewrites, asks in a thread, and the agent takes what holds up into its knowledge | source: 0.23 spec Part B (B1 to B4) -->
  <title id="refl-title">Present, test, improve</title>
  <desc id="refl-desc">One domain. Top row, left to right: the agent's knowledge, its engrams; the agent, which reads every change before it rewrites; and the reflections, what people read. The reflections and the people below them sit inside a frame labelled the pact: for whom, how deep, in what shape. Present runs from the knowledge to the agent and on into the reflections; feedback runs from the reflections back to the agent; improve, what holds up, runs from the agent back into its knowledge. People read, change and comment on the reflections. A thread in plain words sits between the agent and the people, and both links to it carry question and learn.</desc>
