<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 524" width="720" height="524" role="img" aria-labelledby="reach-title reach-desc">
  <title id="reach-title">A write that draws on another domain</title>
  <desc id="reach-desc">A decision flow. May the writer open that domain? If not, it is refused as if the domain did not exist. If so: does everyone who reads the page read that domain, the repository's readers too? Yes: written. No: did this person share it on this page already, for the same readers? Yes: written. No: is a person there, with a client that can ask, never in a scheduled run? No: refused, nothing written, leave out the source and its text. Yes: the question, naming who reads the page and showing the text, with one box. A ticked box and Accept: written. A decline or no answer: refused.</desc>
  <!-- embedded-font:start key=d0f2c37f464111e1 -->
  <!-- Figtree subset, SIL Open Font License 1.1, see theme/fonts/LICENSE-Figtree.txt; generated by tools/embed_svg_font.py, do not edit -->
  <style>
    @font-face { font-family: "Figtree"; font-style: normal; font-weight: 400; src: url(data:font/woff2;base64,) format("woff2"); }
    @font-face { font-family: "Figtree"; font-style: normal; font-weight: 600; src: url(data:font/woff2;base64,) format("woff2"); }
  </style>
  <!-- embedded-font:end -->

  <defs>
    <marker id="crys-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c5eb5"/>
    </marker>
  </defs>

  <!-- Panel -->
  <rect x="0.5" y="0.5" width="719" height="523" rx="12" ry="12"
        fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <g font-family="Figtree, DejaVu Sans, sans-serif"
     stroke-linejoin="round" stroke-linecap="round">

    <!-- Decisions, top to bottom -->
    <g>
      <rect x="24" y="32" width="300" height="64" rx="8" ry="8"
            fill="#6c5eb5" fill-opacity="0.12" stroke="#6c5eb5" stroke-width="1.5"/>
      <text x="174" y="69" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">May the writer open that domain?</text>

      <rect x="24" y="128" width="300" height="64" rx="8" ry="8"
            fill="#6c5eb5" fill-opacity="0.12" stroke="#6c5eb5" stroke-width="1.5"/>
      <text x="174" y="155" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Does everyone who reads the page</text>
      <text x="174" y="174" text-anchor="middle" font-size="12" fill="#57606a">read that domain? The repository's readers too?</text>

      <rect x="24" y="224" width="300" height="64" rx="8" ry="8"
            fill="#6c5eb5" fill-opacity="0.12" stroke="#6c5eb5" stroke-width="1.5"/>
      <text x="174" y="251" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Did this person share it here</text>
      <text x="174" y="270" text-anchor="middle" font-size="12" fill="#57606a">already, for the same readers?</text>

      <rect x="24" y="320" width="300" height="64" rx="8" ry="8"
            fill="#6c5eb5" fill-opacity="0.12" stroke="#6c5eb5" stroke-width="1.5"/>
      <text x="174" y="347" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Is a person there, with a client</text>
      <text x="174" y="366" text-anchor="middle" font-size="12" fill="#57606a">that can ask? Never in a scheduled run.</text>
    </g>

    <!-- Down the decisions -->
    <g fill="none" stroke="#6c5eb5" stroke-width="1.5" marker-end="url(#crys-arrow)">
      <path d="M 174 96 L 174 128"/>
      <path d="M 174 192 L 174 224"/>
      <path d="M 174 288 L 174 320"/>
    </g>
    <text x="184" y="117" font-size="12" fill="#57606a">yes</text>
    <text x="184" y="213" font-size="12" fill="#57606a">no</text>
    <text x="184" y="309" font-size="12" fill="#57606a">no</text>

    <!-- The first refusal: as if the domain did not exist -->
    <path d="M 324 64 L 364 64" fill="none" stroke="#6c5eb5" stroke-width="1.5" marker-end="url(#crys-arrow)"/>
    <text x="372" y="60" font-size="14" fill="#1f2328">no: refused, as if that domain</text>
    <text x="372" y="78" font-size="14" fill="#1f2328">did not exist</text>

    <!-- Written -->
    <rect x="440" y="128" width="256" height="160" rx="10" ry="10"
          fill="#352879" fill-opacity="0.12" stroke="#352879" stroke-width="1.5"/>
    <text x="568" y="202" text-anchor="middle" font-size="16" font-weight="600" fill="#352879">Written</text>
    <text x="568" y="222" text-anchor="middle" font-size="12" fill="#57606a">the page carries the text</text>

    <!-- The question -->
    <rect x="440" y="320" width="256" height="64" rx="8" ry="8"
          fill="#70a4b2" fill-opacity="0.12" stroke="#70a4b2" stroke-width="1.5"/>
    <text x="568" y="347" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">The question</text>
    <text x="568" y="366" text-anchor="middle" font-size="12" fill="#57606a">who reads the page, the text, one box</text>

    <!-- Refused -->
    <rect x="440" y="432" width="256" height="64" rx="8" ry="8"
          fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
    <text x="568" y="459" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Refused, nothing written</text>
    <text x="568" y="478" text-anchor="middle" font-size="12" fill="#57606a">leave out the source and its text</text>

    <!-- Into the outcomes -->
    <g fill="none" stroke="#6c5eb5" stroke-width="1.5" marker-end="url(#crys-arrow)">
      <path d="M 324 160 L 440 160"/>
      <path d="M 324 256 L 440 256"/>
      <path d="M 324 352 L 440 352"/>
      <path d="M 174 384 L 174 464 L 440 464"/>
      <path d="M 600 320 L 600 288"/>
      <path d="M 600 384 L 600 432"/>
    </g>
    <text x="382" y="152" text-anchor="middle" font-size="12" fill="#57606a">yes</text>
    <text x="382" y="248" text-anchor="middle" font-size="12" fill="#57606a">yes</text>
    <text x="382" y="344" text-anchor="middle" font-size="12" fill="#57606a">yes</text>
    <text x="184" y="428" font-size="12" fill="#57606a">no</text>
    <text x="590" y="308" text-anchor="end" font-size="12" fill="#57606a">box ticked and Accept</text>
    <text x="590" y="412" text-anchor="end" font-size="12" fill="#57606a">declined or no answer</text>
  </g>
</svg>
