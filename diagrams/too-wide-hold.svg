<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 484" width="720" height="484" role="img" aria-labelledby="hold-title hold-desc">
  <title id="hold-title">Held back until a person decides</title>
  <desc id="hold-desc">An edit on disk, a restore or a change of readers leads to a section that draws on a domain fewer people read. That becomes a source_too_wide item in the queue for curators who may open that domain, and the backup holds back the page, its threads and its own files, while the branch history keeps what went out; meanwhile the page keeps serving. A curator removes the source and its text, or a person shares it on purpose in the Review. Then the item is gone and the page goes to the branch again. A dashed arrow runs back to the section: the page's readers widen later.</desc>
  <!-- embedded-font:start key=ff88d7ff39ead32a -->
  <!-- Figtree subset, SIL Open Font License 1.1, see theme/fonts/LICENSE-Figtree.txt; generated by tools/embed_svg_font.py, do not edit -->
  <style>
    @font-face { font-family: "Figtree"; font-style: normal; font-weight: 400; src: url(data:font/woff2;base64,) format("woff2"); }
    @font-face { font-family: "Figtree"; font-style: normal; font-weight: 600; src: url(data:font/woff2;base64,) format("woff2"); }
  </style>
  <!-- embedded-font:end -->

  <defs>
    <marker id="crys-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c5eb5"/>
    </marker>
  </defs>

  <!-- Panel -->
  <rect x="0.5" y="0.5" width="719" height="483" rx="12" ry="12"
        fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <g font-family="Figtree, DejaVu Sans, sans-serif"
     stroke-linejoin="round" stroke-linecap="round">

    <!-- What can't be refused -->
    <rect x="24" y="40" width="196" height="64" rx="8" ry="8"
          fill="#57606a" fill-opacity="0.12" stroke="#57606a" stroke-width="1.5"/>
    <text x="122" y="67" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">an edit on disk, a restore</text>
    <text x="122" y="86" text-anchor="middle" font-size="12" fill="#57606a">or a change of readers</text>

    <!-- The section -->
    <rect x="252" y="40" width="216" height="64" rx="8" ry="8"
          fill="#6c5eb5" fill-opacity="0.12" stroke="#6c5eb5" stroke-width="1.5"/>
    <text x="360" y="67" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">a section draws on</text>
    <text x="360" y="86" text-anchor="middle" font-size="12" fill="#57606a">a domain fewer people read</text>

    <!-- The queue item -->
    <rect x="500" y="40" width="196" height="64" rx="8" ry="8"
          fill="#70a4b2" fill-opacity="0.12" stroke="#70a4b2" stroke-width="1.5"/>
    <text x="598" y="67" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">source_too_wide item</text>
    <text x="598" y="86" text-anchor="middle" font-size="12" fill="#57606a">for curators who may open it</text>

    <!-- The backup holds -->
    <rect x="500" y="148" width="196" height="84" rx="8" ry="8"
          fill="#352879" fill-opacity="0.12" stroke="#352879" stroke-width="1.5"/>
    <text x="598" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">the backup holds back</text>
    <text x="598" y="193" text-anchor="middle" font-size="12" fill="#57606a">page, threads, own files</text>
    <text x="598" y="211" text-anchor="middle" font-size="12" fill="#57606a">history keeps what went out</text>

    <text x="360" y="252" text-anchor="middle" font-size="12" fill="#57606a">meanwhile the page keeps serving</text>

    <g fill="none" stroke="#6c5eb5" stroke-width="1.5" marker-end="url(#crys-arrow)">
      <path d="M 220 72 L 252 72"/>
      <path d="M 468 72 L 500 72"/>
      <path d="M 468 92 L 484 92 L 484 190 L 500 190"/>
      <!-- the backup to the two ways out -->
      <path d="M 598 232 L 598 296"/>
      <path d="M 540 232 L 540 268 L 360 268 L 360 296"/>
      <!-- the ways out to the end -->
      <path d="M 598 360 L 598 396"/>
      <path d="M 360 360 L 360 396"/>
    </g>

    <!-- Two ways out -->
    <rect x="252" y="296" width="216" height="64" rx="8" ry="8"
          fill="#6c5eb5" fill-opacity="0.12" stroke="#6c5eb5" stroke-width="1.5"/>
    <text x="360" y="323" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">a person shares it</text>
    <text x="360" y="342" text-anchor="middle" font-size="12" fill="#57606a">on purpose, in the Review</text>

    <rect x="500" y="296" width="196" height="64" rx="8" ry="8"
          fill="#6c5eb5" fill-opacity="0.12" stroke="#6c5eb5" stroke-width="1.5"/>
    <text x="598" y="323" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">a curator removes</text>
    <text x="598" y="342" text-anchor="middle" font-size="12" fill="#57606a">the source and its text</text>

    <!-- The end -->
    <rect x="252" y="396" width="444" height="56" rx="8" ry="8"
          fill="#352879" fill-opacity="0.12" stroke="#352879" stroke-width="1.5"/>
    <text x="474" y="420" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">the item is gone</text>
    <text x="474" y="438" text-anchor="middle" font-size="12" fill="#57606a">and the page goes to the branch again</text>

    <!-- Later: the readers widen -->
    <path d="M 252 424 L 136 424 L 136 160 L 330 160 L 330 104" fill="none" stroke="#6c5eb5" stroke-width="1.5"
          stroke-dasharray="6 4" marker-end="url(#crys-arrow)"/>
    <text x="148" y="184" font-size="12" fill="#57606a">the page's readers</text>
    <text x="148" y="200" font-size="12" fill="#57606a">widen later</text>
  </g>
</svg>
