<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 348" width="720" height="348" role="img" aria-labelledby="split-title split-desc">
  <!-- TODO-0.27.0: Fluid is where people and the agent meet on reflections; opening the engrams there is the exception, for inspection | source: 0.23 spec B7 -->
  <title id="split-title">Fluid and crystalline intelligence</title>
  <desc id="split-desc">Two halves. Left, fluid intelligence: reasons in the moment, keeps nothing; a model and a person are both fluid minds. Right, crystalline intelligence: accumulates and keeps what the company taught; engrams in domains, plain markdown on disk. Teach and capture flow straight from the fluid side to the crystalline side, and recall flows straight back. Between the halves sits Fluid, the web UI, where they meet on reflections, joined to the fluid side by a two-way arrow. A smaller dashed arrow labelled inspect leads from Fluid into the engrams: the side door.</desc>
  <!-- embedded-font:start key=a6b1823e267c31c1 -->
  <!-- Figtree subset, SIL Open Font License 1.1, see theme/fonts/LICENSE-Figtree.txt; generated by tools/embed_svg_font.py, do not edit -->
  <style>
    @font-face { font-family: "Figtree"; font-style: normal; font-weight: 400; src: url(data:font/woff2;base64,) format("woff2"); }
    @font-face { font-family: "Figtree"; font-style: normal; font-weight: 600; src: url(data:font/woff2;base64,) format("woff2"); }
  </style>
  <!-- embedded-font:end -->

  <defs>
    <marker id="split-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c5eb5"/>
    </marker>
  </defs>

  <!-- Panel -->
  <rect x="0.5" y="0.5" width="719" height="347" rx="12" ry="12"
        fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <g font-family="Figtree, DejaVu Sans, sans-serif"
     stroke-linejoin="round" stroke-linecap="round">

    <!-- Fluid intelligence: a model and a person -->
    <g>
      <rect x="24" y="24" width="212" height="300" rx="12" ry="12"
            fill="#6c5eb5" fill-opacity="0.12" stroke="#6c5eb5" stroke-width="1.5"/>
      <text x="130" y="58" text-anchor="middle" font-size="16" font-weight="600" fill="#352879">FLUID</text>
      <text x="130" y="84" text-anchor="middle" font-size="14" fill="#1f2328">reasons in the moment,</text>
      <text x="130" y="104" text-anchor="middle" font-size="14" fill="#1f2328">keeps nothing</text>

      <rect x="44" y="152" width="172" height="40" rx="10" ry="10"
            fill="#ffffff" stroke="#352879" stroke-width="1.5"/>
      <text x="130" y="177" text-anchor="middle" font-size="14" fill="#1f2328">a model</text>

      <rect x="44" y="208" width="172" height="40" rx="10" ry="10"
            fill="#ffffff" stroke="#6c5eb5" stroke-width="1.5"/>
      <text x="130" y="233" text-anchor="middle" font-size="14" fill="#1f2328">a person</text>

      <text x="130" y="296" text-anchor="middle" font-size="14" fill="#57606a">both fluid minds</text>
    </g>

    <!-- Crystalline intelligence: the engrams -->
    <g>
      <rect x="484" y="24" width="212" height="300" rx="12" ry="12"
            fill="#352879" fill-opacity="0.12" stroke="#352879" stroke-width="1.5"/>
      <text x="590" y="58" text-anchor="middle" font-size="16" font-weight="600" fill="#352879">CRYSTALLINE</text>
      <text x="590" y="84" text-anchor="middle" font-size="14" fill="#1f2328">accumulates and keeps</text>
      <text x="590" y="104" text-anchor="middle" font-size="14" fill="#1f2328">what the company taught</text>

      <rect x="504" y="180" width="172" height="40" rx="10" ry="10"
            fill="#ffffff" stroke="#352879" stroke-width="1.5"/>
      <text x="590" y="205" text-anchor="middle" font-size="14" fill="#1f2328">engrams in domains</text>

      <text x="590" y="296" text-anchor="middle" font-size="14" fill="#57606a">plain markdown on disk</text>
    </g>

    <!-- Fluid, the web UI: where the fluid minds meet on reflections -->
    <g>
      <rect x="280" y="160" width="148" height="80" rx="12" ry="12"
            fill="#70a4b2" fill-opacity="0.12" stroke="#70a4b2" stroke-width="1.5"/>
      <text x="354" y="186" text-anchor="middle" font-size="14" font-weight="600" fill="#352879">Fluid, the web UI</text>
      <text x="354" y="206" text-anchor="middle" font-size="12" fill="#57606a">where they meet</text>
      <text x="354" y="224" text-anchor="middle" font-size="12" fill="#57606a">on reflections</text>
    </g>

    <!-- What the agent does, straight between the halves, never through the UI -->
    <g fill="none" stroke="#6c5eb5" stroke-width="1.5" marker-end="url(#split-arrow)">
      <path d="M 236 128 L 484 128"/>
      <path d="M 484 272 L 236 272"/>
    </g>
    <text x="360" y="118" text-anchor="middle" font-size="12" fill="#57606a">teach, capture</text>
    <text x="360" y="292" text-anchor="middle" font-size="12" fill="#57606a">recall</text>

    <!-- The fluid minds meet in Fluid: the main path -->
    <path d="M 236 200 L 280 200" fill="none" stroke="#6c5eb5" stroke-width="1.5"
          marker-start="url(#split-arrow)" marker-end="url(#split-arrow)"/>

    <!-- The side door: inspecting the engrams, the minor path -->
    <path d="M 428 200 L 484 200" fill="none" stroke="#6c5eb5" stroke-width="1.5"
          stroke-dasharray="6 4" marker-end="url(#split-arrow)"/>
    <text x="456" y="188" text-anchor="middle" font-size="12" fill="#57606a">inspect</text>
  </g>
</svg>
