<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 404" width="720" height="404" role="img" aria-labelledby="deputy-title deputy-desc">
  <title id="deputy-title">A question in a thread meets a scheduled run</title>
  <desc id="deputy-desc">Kane asks a question in the thread on the Dune page, which carries no source check. The scheduled reflect run on club picks it up; it is unattended and reads and writes club only. It reads club, and committee is hidden from it behind a bar. The run writes its answer into the thread, drawn from club only, with the question left open for a person. The thread reaches everyone who reads the page and everyone who can read dallas/book-club, through the backup branch.</desc>
