    <text x="94" y="67" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Kane</text>
    <text x="94" y="86" text-anchor="middle" font-size="12" fill="#57606a">asks in a thread</text>

    <!-- The thread -->
    <rect x="204" y="40" width="210" height="64" rx="8" ry="8"
          fill="#70a4b2" fill-opacity="0.12" stroke="#70a4b2" stroke-width="1.5"/>
    <text x="309" y="67" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">thread on the Dune page</text>
    <text x="309" y="86" text-anchor="middle" font-size="12" fill="#57606a">no source check</text>

    <!-- The run -->
    <rect x="454" y="40" width="242" height="64" rx="8" ry="8"
          fill="#352879" fill-opacity="0.12" stroke="#352879" stroke-width="1.5"/>
    <text x="575" y="67" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">scheduled reflect run on club</text>
    <text x="575" y="86" text-anchor="middle" font-size="12" fill="#57606a">unattended, reads and writes club only</text>

    <g fill="none" stroke="#6c5eb5" stroke-width="1.5" marker-end="url(#crys-arrow)">
      <path d="M 164 72 L 204 72"/>
      <path d="M 414 72 L 454 72"/>
      <!-- run reads club -->
      <path d="M 514 104 L 514 180"/>
      <!-- the run writes the answer -->
      <path d="M 474 104 L 474 142 L 384 142 L 384 180"/>
      <!-- answer to its readers -->
      <path d="M 309 244 L 309 300"/>
    </g>

    <!-- run to committee: ends at a bar -->
    <path d="M 636 104 L 636 146" fill="none" stroke="#6c5eb5" stroke-width="1.5"/>
    <path d="M 612 148 L 660 148" fill="none" stroke="#352879" stroke-width="4"/>

