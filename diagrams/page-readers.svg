<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 428" width="720" height="428" role="img" aria-labelledby="readers-title readers-desc">
  <title id="readers-title">Who reads the page, who reads the domain</title>
  <desc id="readers-desc">Two panels side by side. Left, a committee page draws on club: the page's readers, Dallas and you, sit entirely inside club's engram readers, every member, so it is allowed. Right, a club page draws on committee: the page's readers, every member and Lambert, spill far beyond committee's engram readers, Dallas and you, so it is refused unless shared on purpose. A strip below says that on a team domain the page's readers also include everyone who can read its repository.</desc>
