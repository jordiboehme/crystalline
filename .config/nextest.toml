# The root cause behind the two timeout overrides below, addressed rather than
# survived: every suite in this group builds a reqwest client, and on macOS
# each new client asks the system trust store for the root certificates. Under
# full-workspace parallelism dozens of those land at once, the trust store
# serializes them and the contention is not marginal - measured on 2026-08-26,
# tests that run in milliseconds per-crate ran 100 to 10000 times slower under
# full parallel load, close enough to the terminate-after ceiling to be killed
# as hangs. Capping the group at four concurrent tests keeps the contention off
# the critical path; everything else in the workspace runs at default
# parallelism.
[test-groups.forge-wire]
max-threads = 4

[[profile.default.overrides]]
filter = '''
    package(crystalline-remote) & (binary(github_client) | binary(github_auth))
    | package(crystalline-service) & (binary(collab_ws) | binary(rest_admin_api)
        | binary(rest_api) | binary(rest_evolve) | binary(rest_files)
        | binary(rest_setup_api) | binary(rest_write_api) | binary(ui_serving))
    | package(crystalline) & binary(service)
'''
test-group = 'forge-wire'

# Keeps a hung test from wedging the whole run: the sandboxed environments
# this repo is developed in can stall the loopback-binding suites
# (crates/remote/tests/github_client.rs and github_auth.rs bind
# 127.0.0.1:0), and without a terminate-after nextest waits forever.
[profile.default]
slow-timeout = { period = "120s", terminate-after = 2 }

# The same two loopback suites, given a far longer ceiling rather than a mute:
# they finish in under a second standalone, but a machine under environmental
# load (a post-update Gatekeeper scan, a sandbox) has been seen stalling them
# past the 240s the default override allows, killing tests that were only slow.
# They still terminate, so a genuine hang cannot wedge the run.
[[profile.default.overrides]]
filter = 'binary(github_auth) or binary(github_client)'
slow-timeout = { period = "120s", terminate-after = 10 }

# The same environmental stall, observed on two more loopback users during
# full-workspace runs on 2026-08-21 (post macOS update) while every one of them
# passes per-crate: the CLI's `service` suite, whose `http_smoke_*` cases spawn
# a daemon and talk to it over 127.0.0.1, and `embed::remote`'s retry tests,
# which drive a local mock HTTP endpoint. Same ceiling, same guarantee: slow is
# survivable, hung still dies.
[[profile.default.overrides]]
filter = 'package(crystalline) & binary(service) | package(crystalline-index) & test(embed::remote)'
slow-timeout = { period = "120s", terminate-after = 10 }

# The iteration profile: `cargo nextest run --profile quick -p <crate>`
# skips the tests that dominate wall time in the index suite - the
# real-embedding and remote-embed families - so a task's inner loop stays
# tight. The default profile still runs everything; the battery always uses
# the default. Refine this filter from a full run's slow report when the
# names drift.
[profile.quick]
slow-timeout = { period = "120s", terminate-after = 2 }
default-filter = 'not (package(crystalline-index) & (test(embed) | test(model)))'
